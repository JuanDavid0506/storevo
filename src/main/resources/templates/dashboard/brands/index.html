<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/dashboard-layout}">
<head>
    <title>Marcas</title>
</head>
<body>
<div layout:fragment="content" class="space-y-6">

    <div th:if="${errorMessage}" class="flex items-start gap-3 bg-red-500/10 border border-red-500/30 text-red-300 text-sm font-semibold p-4 rounded-xl">
        <span th:text="${errorMessage}"></span>
    </div>
    <div th:if="${successMessage}" class="flex items-start gap-3 bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-sm font-semibold p-4 rounded-xl">
        <span th:text="${successMessage}"></span>
    </div>

    <!-- CABECERA + NUEVA MARCA -->
    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
        <div>
            <h2 class="text-2xl font-bold text-white flex items-center gap-3">
                Marcas
                <span id="total-items-counter"
                      class="bg-slate-800 text-storevo-400 text-xs font-black px-2.5 py-1 rounded-full border border-slate-700"
                      th:text="${brands.totalElements}">0</span>
            </h2>
            <p class="text-sm text-slate-400 mt-1">Las marcas se crean solas al guardar un producto. Aquí les subes el logo y controlas si aparecen en el carrusel de marcas de tu tienda.</p>
        </div>
        <form th:action="@{|/dashboard/${slug}/brands/new|}" method="post" class="flex items-center gap-2">
            <input type="text" name="name" maxlength="100" required placeholder="Nueva marca (Ej: Nike)"
                   class="w-full sm:w-64 px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm placeholder-slate-700 focus:outline-none focus:ring-2 focus:ring-storevo-500/40 transition">
            <button type="submit"
                    class="bg-storevo-500 hover:bg-storevo-600 text-white font-bold py-2.5 px-5 rounded-xl transition shadow-lg shadow-storevo-500/20 whitespace-nowrap">
                Agregar
            </button>
        </form>
    </div>

    <!-- PANEL DE BÚSQUEDA Y FILTROS (mismo motor AJAX que Productos) -->
    <form id="listing-form" method="GET" class="bg-slate-900 p-4 sm:p-5 rounded-2xl border border-slate-800 shadow-sm flex flex-col gap-4"
          th:with="clearFiltersUrl=@{|/dashboard/${slug}/brands|},
                   hasActiveFilters=${(param.q != null and not #strings.isEmpty(param.q[0]))
                                      or (param.status != null and not #strings.isEmpty(param.status[0]))}">

        <div class="flex flex-col xl:flex-row justify-between gap-4">
            <div class="flex flex-col sm:flex-row sm:flex-wrap items-center gap-3 flex-1">

                <div class="w-full sm:w-auto" th:replace="~{components/ui/listing :: search('Buscar marca por nombre...')}"></div>

                <!-- Estado: Todas / Visibles / Ocultas / Sin logo (con contadores) -->
                <div class="w-full sm:w-auto">
                    <select name="status" data-auto-submit="true" data-filter="true"
                            class="w-full sm:w-auto px-4 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-300 focus:border-storevo-500 focus:ring-1 focus:ring-storevo-500 cursor-pointer appearance-none pr-8">
                        <option value="" th:text="|Todas (${statusCounts.total})|">Todas</option>
                        <option value="active" th:selected="${param.status != null and param.status[0] == 'active'}"
                                th:text="|Visibles en la tienda (${statusCounts.active})|">Visibles</option>
                        <option value="hidden" th:selected="${param.status != null and param.status[0] == 'hidden'}"
                                th:text="|Ocultas (${statusCounts.hidden})|">Ocultas</option>
                        <option value="nologo" th:selected="${param.status != null and param.status[0] == 'nologo'}"
                                th:text="|Sin logo (${statusCounts.nologo})|">Sin logo</option>
                    </select>
                </div>

                <div th:replace="~{components/ui/listing :: clear-filters(${clearFiltersUrl}, ${hasActiveFilters})}"></div>
            </div>

            <div class="flex items-center gap-3 self-end xl:self-auto">
                <div th:replace="~{components/ui/listing :: sort(${ {'name_asc': 'Nombre: A a Z', 'name_desc': 'Nombre: Z a A', 'newest': 'Más recientes', 'products_desc': 'Más productos'} })}"></div>
                <div>
                    <select name="size" data-auto-submit="true"
                            class="px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-400 focus:border-storevo-500 focus:ring-1 focus:ring-storevo-500 cursor-pointer appearance-none pr-8">
                        <option th:each="n : ${ {12, 24, 48, 96} }"
                                th:value="${n}"
                                th:text="|${n} / pág|"
                                th:selected="${brands.size == n}">12 / pág</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Chips de filtros activos (se ocultan solos cuando no hay filtros) -->
        <div th:replace="~{components/ui/listing :: active-filters-chips}"></div>
    </form>

    <!-- RESULTADOS (aquí se actualiza el listado por AJAX) -->
    <div id="listing-results-container" class="transition-opacity duration-200"
         th:with="clearFiltersUrl=@{|/dashboard/${slug}/brands|}">

        <!-- Sin marcas en la tienda -->
        <div th:if="${brands.empty and statusCounts.total == 0}">
            <div th:replace="~{components/ui/listing :: empty-state('Aún no tienes marcas', 'Escribe una marca al crear un producto, o agrégala con el campo de arriba.', 'M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z', ${clearFiltersUrl})}"></div>
        </div>

        <!-- Hay marcas pero ninguna coincide con la búsqueda / filtro -->
        <div th:if="${brands.empty and statusCounts.total > 0}">
            <div th:replace="~{components/ui/listing :: empty-state('Sin resultados', 'No encontramos marcas con la búsqueda o el filtro actual.', 'M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z', ${clearFiltersUrl})}"></div>
        </div>

        <div th:unless="${brands.empty}">
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                <div th:each="b : ${brands.content}" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">

                    <form th:id="${'upd-' + b.id}"
                          th:action="@{|/dashboard/${slug}/brands/${b.id}/update|}"
                          method="post" enctype="multipart/form-data" class="space-y-4">

                        <div class="flex items-center gap-4">
                            <div class="w-16 h-16 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-center overflow-hidden flex-shrink-0">
                                <img th:if="${b.logoUrl != null and !#strings.isEmpty(b.logoUrl)}"
                                     th:src="${b.logoUrl}" th:alt="${b.name}" class="max-w-full max-h-full object-contain">
                                <span th:unless="${b.logoUrl != null and !#strings.isEmpty(b.logoUrl)}"
                                      class="text-xl font-black text-slate-600"
                                      th:text="${#strings.toUpperCase(#strings.substring(b.name, 0, 1))}">M</span>
                            </div>
                            <div class="min-w-0 flex-1">
                                <input type="text" name="name" th:value="${b.name}" maxlength="100" required
                                       class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-storevo-500/40 transition">
                                <p class="text-xs text-slate-500 mt-1 flex items-center gap-2 flex-wrap">
                                    <span><span th:text="${productCounts.get(b.id) ?: 0}">0</span> producto(s)</span>
                                    <span th:if="${b.logoUrl == null or #strings.isEmpty(b.logoUrl)}"
                                          class="px-1.5 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20 font-bold text-[10px]">Sin logo</span>
                                    <span th:if="${b.isActive == false}"
                                          class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 font-bold text-[10px]">Oculta</span>
                                </p>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Logo (JPG, PNG o WEBP, máx. 5 MB)</label>
                            <input type="file" name="logo" accept="image/jpeg,image/png,image/webp"
                                   class="block w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700">
                        </div>

                        <div class="flex flex-wrap items-center gap-x-5 gap-y-2 text-xs text-slate-300">
                            <label class="inline-flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" name="isActive" th:checked="${b.isActive}"
                                       class="rounded border-slate-700 bg-slate-900 text-storevo-500">
                                Visible en el carrusel de marcas
                            </label>
                            <label th:if="${b.logoUrl != null and !#strings.isEmpty(b.logoUrl)}"
                                   class="inline-flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" name="removeLogo"
                                       class="rounded border-slate-700 bg-slate-900 text-storevo-500">
                                Quitar logo
                            </label>
                        </div>
                    </form>

                    <div class="flex items-center justify-between gap-3 pt-1">
                        <button type="submit" th:attr="form=${'upd-' + b.id}"
                                class="bg-storevo-500 hover:bg-storevo-600 text-white text-sm font-bold py-2 px-4 rounded-xl transition">
                            Guardar
                        </button>
                        <form th:action="@{|/dashboard/${slug}/brands/${b.id}/delete|}" method="post"
                              onsubmit="return confirm('¿Eliminar esta marca? Solo se puede si ningún producto la usa.');">
                            <button type="submit" class="text-xs font-semibold text-red-400 hover:text-red-300 transition">Eliminar</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Paginación (misma que Productos) -->
            <div class="mt-6">
                <div th:replace="~{components/ui/listing :: pagination(${brands})}"></div>
            </div>
        </div>
    </div>

    <div th:replace="~{components/ui/listing :: scripts}"></div>
</div>
</body>
</html>
