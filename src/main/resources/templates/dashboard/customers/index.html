<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/dashboard-layout}">
<head>
  <title>Mis Clientes</title>
</head>
<body>
<div layout:fragment="content" class="space-y-6">

  <!-- Encabezado -->
  <div class="flex justify-between items-center mb-6">
    <div>
      <h2 class="text-2xl font-bold text-white">Directorio de Clientes</h2>
      <p class="text-sm text-slate-400 mt-1">Conoce a tus compradores, su historial de pedidos y valor total generado.</p>
    </div>
  </div>

  <!-- Tabla de Clientes -->
  <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-sm">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm text-slate-400">
        <thead class="text-xs uppercase bg-slate-800 text-slate-300 border-b border-slate-800">
        <tr>
          <th scope="col" class="px-6 py-4 font-medium">Cliente</th>
          <th scope="col" class="px-6 py-4 font-medium">Ciudad</th>
          <th scope="col" class="px-6 py-4 font-medium text-center">Pedidos</th>
          <th scope="col" class="px-6 py-4 font-medium">Total Gastado</th>
          <th scope="col" class="px-6 py-4 font-medium text-right">Última Compra</th>
        </tr>
        </thead>
        <tbody class="divide-y divide-slate-800/60">

        <!-- Estado Vacío -->
        <tr th:if="${#lists.isEmpty(customers)}">
          <td colspan="5" class="px-6 py-10 text-center text-slate-500">
            Aún no tienes clientes registrados. Los datos aparecerán cuando recibas tu primer pedido.
          </td>
        </tr>

        <!-- Iteración de Clientes -->
        <tr th:each="customer : ${customers}" class="hover:bg-slate-800/30 transition-colors">
          <td class="px-6 py-4">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-full bg-storevo-500/10 text-storevo-400 flex items-center justify-center font-bold uppercase"
                   th:text="${#strings.substring(customer.name, 0, 1)}">
                A
              </div>
              <div>
                <p class="font-bold text-white" th:text="${customer.name}">Nombre</p>
                <p class="text-xs text-slate-500 flex items-center gap-1 mt-0.5">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                  <span th:text="${customer.phone}">Teléfono</span>
                </p>
              </div>
            </div>
          </td>

          <td class="px-6 py-4 text-slate-300" th:text="${customer.city}">
            Ciudad
          </td>

          <td class="px-6 py-4 text-center">
                        <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-800 text-xs font-bold text-slate-300"
                              th:text="${customer.totalOrders}">0</span>
          </td>

          <td class="px-6 py-4 font-bold text-storevo-400" th:text="${customer.totalSpent != null ? '$ ' + #numbers.formatDecimal(customer.totalSpent, 1, 'POINT', 0, 'COMMA') : '$ 0'}">
            $0
          </td>

          <td class="px-6 py-4 text-right text-xs text-slate-500"
              th:text="${#temporals.format(customer.lastOrderDate, 'dd/MM/yyyy HH:mm')}">
            Fecha
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
