<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/dashboard-layout}">
<head>
    <title>Configuración de Mi Tienda</title>
</head>
<body>

<div layout:fragment="content">

    <div th:if="${param.success}" class="mb-6 bg-green-500/10 border border-green-500/50 text-green-400 px-4 py-3 rounded-lg flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        Configuración guardada correctamente en la base de datos.
    </div>

    <form th:action="@{/dashboard/settings}" th:object="${settings}" method="POST" class="space-y-8">

        <div class="bg-slate-900 border border-slate-800 rounded-xl shadow-sm overflow-hidden">
            <div class="px-6 py-5 border-b border-slate-800">
                <h3 class="text-lg font-medium text-white">Información General</h3>
                <p class="text-sm text-slate-400 mt-1">Los datos principales de tu negocio.</p>
            </div>
            <div class="px-6 py-6 space-y-6">
                <div th:replace="~{components/ui/fragments :: input('storeName', 'Nombre Comercial', 'text', 'Ej: Moda Urbana', *{storeName})}"></div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div th:replace="~{components/ui/fragments :: input('emailContact', 'Correo de Contacto', 'email', 'contacto@mitienda.com', *{emailContact})}"></div>

                    <div>
                        <label for="primaryColor" class="block text-sm font-medium text-slate-300 mb-1">Color Primario</label>
                        <div class="flex items-center gap-3">
                            <input type="color" id="primaryColor" th:field="*{primaryColor}" class="h-10 w-full rounded bg-slate-950 border border-slate-800 cursor-pointer">
                        </div>
                    </div>

                    <div>
                        <label for="secondaryColor" class="block text-sm font-medium text-slate-300 mb-1">Color Secundario</label>
                        <div class="flex items-center gap-3">
                            <input type="color" id="secondaryColor" th:field="*{secondaryColor}" class="h-10 w-full rounded bg-slate-950 border border-slate-800 cursor-pointer">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-xl shadow-sm overflow-hidden">
            <div class="px-6 py-5 border-b border-slate-800">
                <h3 class="text-lg font-medium text-white">Redes Sociales</h3>
                <p class="text-sm text-slate-400 mt-1">Conecta con tus clientes en sus plataformas favoritas.</p>
            </div>
            <div class="px-6 py-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                <div th:replace="~{components/ui/fragments :: input('whatsapp', 'Número de WhatsApp', 'text', '+57 300 000 0000', *{whatsapp})}"></div>
                <div th:replace="~{components/ui/fragments :: input('instagram', 'Usuario de Instagram', 'text', '@modaurbana', *{instagram})}"></div>
                <div th:replace="~{components/ui/fragments :: input('facebook', 'Enlace de Facebook', 'text', 'https://facebook.com/...', *{facebook})}"></div>
                <div th:replace="~{components/ui/fragments :: input('tiktok', 'Usuario de TikTok', 'text', '@modaurbana', *{tiktok})}"></div>
            </div>
        </div>

        <div class="flex justify-end gap-4">
            <a href="/dashboard" class="bg-slate-800 hover:bg-slate-700 text-white font-medium py-2 px-6 rounded-lg border border-slate-700 transition duration-200">Descartar</a>
            <div th:replace="~{components/ui/fragments :: btn-primary('Guardar Configuración', 'submit')}"></div>
        </div>

    </form>
</div>

</body>
</html>
