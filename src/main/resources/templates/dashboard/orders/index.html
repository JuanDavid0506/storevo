<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/dashboard-layout}">
<head>
    <title>Gestión de Pedidos</title>
</head>
<body>
<div layout:fragment="content">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h2 class="text-2xl font-bold text-white">Pedidos</h2>
            <p class="text-sm text-slate-400 mt-1">Administra todo el ciclo de vida de las compras de tus clientes.</p>
        </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-sm">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-slate-400">
                <thead class="text-xs uppercase bg-slate-800 text-slate-300">
                <tr>
                    <th scope="col" class="px-6 py-4 font-bold">Pedido</th>
                    <th scope="col" class="px-6 py-4 font-bold">Fecha</th>
                    <th scope="col" class="px-6 py-4 font-bold">Cliente</th>
                    <th scope="col" class="px-6 py-4 font-bold">Artículos</th>
                    <th scope="col" class="px-6 py-4 font-bold">Total</th>
                    <th scope="col" class="px-6 py-4 font-bold">Estado</th>
                    <th scope="col" class="px-6 py-4 font-bold text-right">Acción</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-800">

                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="7" class="px-6 py-12 text-center text-slate-500">
                        <svg class="w-12 h-12 mx-auto mb-3 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                        Aún no tienes pedidos registrados en tu tienda.
                    </td>
                </tr>

                <tr th:each="order : ${orders}" class="hover:bg-slate-800/50 transition cursor-pointer" th:onclick="|window.location.href='@{/dashboard/{slug}/orders/{id}(slug=${slug},id=${order.id})}'|">
                    <td class="px-6 py-4 font-black text-white text-base" th:text="'#' + ${order.id}">#1</td>
                    <td class="px-6 py-4" th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy')}">Fecha</td>
                    <td class="px-6 py-4">
                        <p class="font-bold text-white" th:text="${order.customerName}">Nombre</p>
                        <p class="text-xs text-slate-500" th:text="${order.city}">Ciudad</p>
                    </td>
                    <td class="px-6 py-4 font-medium" th:text="${order.getTotalItemsCount()} + ' prod.'">1 prod.</td>
                    <td class="px-6 py-4 font-black text-storevo-400" th:text="${order.total != null ? '$ ' + #numbers.formatDecimal(order.total, 1, 'POINT', 0, 'COMMA') : '$ 0'}">$0</td>
                    <td class="px-6 py-4">
                        <span th:text="${order.status.getDisplayName()}"
                              th:class="'text-[10px] uppercase tracking-wider font-bold px-3 py-1.5 rounded-full border ' + ${order.status.getBadgeClasses()}">
                        </span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <a th:href="@{/dashboard/{slug}/orders/{id}(slug=${slug}, id=${order.id})}" class="text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg font-medium transition inline-block">Gestionar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
