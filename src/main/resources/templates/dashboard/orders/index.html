<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/dashboard-layout}">
<head>
    <title>Gestión de Pedidos</title>
</head>
<body>
<div layout:fragment="content">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h2 class="text-2xl font-bold text-white flex items-center gap-3">
                Pedidos
                <span id="total-items-counter" class="bg-slate-800 text-storevo-400 text-xs font-black px-2.5 py-1 rounded-full border border-slate-700" th:text="${orders.totalElements}">0</span>
            </h2>
            <p class="text-sm text-slate-400 mt-1">Administra todo el ciclo de vida de las compras de tus clientes.</p>
        </div>
    </div>

    <!-- PANEL DE BÚSQUEDA Y FILTROS (infraestructura común: components/ui/listing) -->
    <form id="listing-form" method="GET" class="bg-slate-900 p-4 sm:p-5 rounded-2xl border border-slate-800 shadow-sm flex flex-col gap-4 mb-6"
          th:with="clearFiltersUrl=@{|/dashboard/${slug}/orders|},
                 hasActiveFilters=${(param.q != null and not #strings.isEmpty(param.q[0]))
                   or (param.status != null and not #strings.isEmpty(param.status[0]))
                   or (param.channel != null and not #strings.isEmpty(param.channel[0]))}">

        <div class="flex flex-col xl:flex-row justify-between gap-4">
            <div class="flex flex-col sm:flex-row sm:flex-wrap items-center gap-3 flex-1">
                <div class="w-full sm:w-auto" th:replace="~{components/ui/listing :: search('Buscar por # pedido, cliente o teléfono...')}"></div>
                <div th:replace="~{components/ui/listing :: filter-select('status', 'Todos los estados', ${statusOptions}, 'key', 'value')}"></div>
                <div th:replace="~{components/ui/listing :: filter-select('channel', 'Todos los canales', ${channelOptions}, 'key', 'value')}"></div>
                <div th:replace="~{components/ui/listing :: clear-filters(${clearFiltersUrl}, ${hasActiveFilters})}"></div>
            </div>

            <div class="flex items-center gap-3 self-end xl:self-auto">
                <div th:replace="~{components/ui/listing :: sort(${ {'newest': 'Más recientes', 'oldest': 'Más antiguos', 'total_desc': 'Mayor total', 'total_asc': 'Menor total'} })}"></div>
                <div th:replace="~{components/ui/listing :: page-size()}"></div>
            </div>
        </div>

        <div th:replace="~{components/ui/listing :: active-filters-chips}"></div>
    </form>

    <!-- RESULTADOS (se reemplazan por AJAX) -->
    <div id="listing-results-container" class="transition-opacity duration-200">
        <div th:if="${orders.empty}">
            <div th:replace="~{components/ui/listing :: empty-state('Aún no hay pedidos', 'No se encontraron pedidos con los filtros actuales o aún no has recibido ninguno en tu tienda.', 'M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4', @{|/dashboard/${slug}/orders|})}"></div>
        </div>

        <div th:unless="${orders.empty}">
            <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-sm">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-400">
                        <thead class="text-xs uppercase bg-slate-800 text-slate-300">
                        <tr>
                            <th scope="col" class="px-6 py-4 font-bold">Pedido</th>
                            <th scope="col" class="px-6 py-4 font-bold">Fecha</th>
                            <th scope="col" class="px-6 py-4 font-bold">Cliente</th>
                            <th scope="col" class="px-6 py-4 font-bold">Artículos</th>
                            <th scope="col" class="px-6 py-4 font-bold">Total</th>
                            <th scope="col" class="px-6 py-4 font-bold">Estado</th>
                            <th scope="col" class="px-6 py-4 font-bold text-right">Acción</th>
                        </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800">

                        <tr th:each="order : ${orders}" class="hover:bg-slate-800/50 transition cursor-pointer" th:onclick="|window.location.href='@{/dashboard/{slug}/orders/{id}(slug=${slug},id=${order.id})}'|">
                            <td class="px-6 py-4 font-black text-white text-base">
                                <span th:text="'#' + ${order.id}">#1</span>
                                <span th:text="${order.channel.getDisplayName()}"
                                      th:class="'ml-2 text-[9px] uppercase tracking-wider font-bold px-2 py-0.5 rounded-full border ' + ${order.channel.getBadgeClasses()}"></span>
                            </td>
                            <td class="px-6 py-4" th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy')}">Fecha</td>
                            <td class="px-6 py-4">
                                <p class="font-bold text-white" th:text="${order.customerName}">Nombre</p>
                                <p class="text-xs text-slate-500" th:text="${order.city}">Ciudad</p>
                            </td>
                            <td class="px-6 py-4 font-medium" th:text="${order.getTotalItemsCount()} + ' prod.'">1 prod.</td>
                            <td class="px-6 py-4 font-black text-storevo-400" th:text="${order.total != null ? '$ ' + #numbers.formatDecimal(order.total, 1, 'POINT', 0, 'COMMA') : '$ 0'}">$0</td>
                            <td class="px-6 py-4">
                            <span th:text="${order.status.getDisplayName()}"
                                  th:class="'text-[10px] uppercase tracking-wider font-bold px-3 py-1.5 rounded-full border ' + ${order.status.getBadgeClasses()}">
                            </span>
                            </td>
                            <td class="px-6 py-4 text-right">
                                <a th:href="@{/dashboard/{slug}/orders/{id}(slug=${slug}, id=${order.id})}" class="text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg font-medium transition inline-block">Gestionar</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Paginación (componente común) -->
            <div class="mt-6">
                <div th:replace="~{components/ui/listing :: pagination(${orders})}"></div>
            </div>
        </div>
    </div>

    <div th:replace="~{components/ui/listing :: scripts}"></div>
</div>
</body>
</html>
