<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/dashboard-layout}">
<head>
    <title>Gestión de Pedidos</title>
    <style>
        /* Reglas de visibilidad estrictas para asegurar que el AJAX no rompa la vista activa */
        #orders-view-wrapper.view-table .order-view-grid,
        #orders-view-wrapper.view-table .order-view-compact { display: none !important; }
        #orders-view-wrapper.view-table .order-view-table { display: block !important; }

        #orders-view-wrapper.view-grid .order-view-table,
        #orders-view-wrapper.view-grid .order-view-compact { display: none !important; }
        #orders-view-wrapper.view-grid .order-view-grid { display: grid !important; }

        #orders-view-wrapper.view-compact .order-view-table,
        #orders-view-wrapper.view-compact .order-view-grid { display: none !important; }
        #orders-view-wrapper.view-compact .order-view-compact { display: flex !important; }
    </style>
</head>
<body>
<!-- class="space-y-6" sobrescribe el max-w-7xl mx-auto del layout para ocupar todo el ancho igual que Productos -->
<div layout:fragment="content" class="space-y-6">

    <!-- CABECERA -->
    <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4">
        <div>
            <h2 class="text-2xl font-bold text-white flex items-center gap-3">
                Pedidos
                <span id="total-items-counter" class="bg-slate-800 text-storevo-400 text-xs font-black px-2.5 py-1 rounded-full border border-slate-700" th:text="${page.totalElements}">0</span>
            </h2>
            <p class="text-sm text-slate-400 mt-1">Administra todo el ciclo de vida de las compras de tus clientes.</p>
        </div>
    </div>

    <!-- PANEL DE BÚSQUEDA Y FILTROS (Misma arquitectura visual que Productos) -->
    <form id="listing-form" th:action="@{/dashboard/{slug}/orders(slug=${slug})}" method="GET"
          class="bg-slate-900 p-4 sm:p-5 rounded-2xl border border-slate-800 shadow-sm flex flex-col gap-4"
          th:with="clearFiltersUrl=@{|/dashboard/${slug}/orders|},
                   hasActiveFilters=${(param.q != null and not #strings.isEmpty(param.q[0]))
                     or (param.status != null and not #strings.isEmpty(param.status[0]))
                     or (param.channel != null and not #strings.isEmpty(param.channel[0]))}">

        <!-- Fila 1: Buscador y Filtros a la izquierda / Ordenamiento y Tamaño a la derecha -->
        <div class="flex flex-col xl:flex-row justify-between gap-4">
            <div class="flex flex-col sm:flex-row sm:flex-wrap items-stretch sm:items-center gap-3 flex-1">
                <div class="w-full sm:w-auto" th:replace="~{components/ui/listing :: search('Buscar por #, cliente o teléfono...')}"></div>
                <div class="w-full sm:w-auto" th:replace="~{components/ui/listing :: filter-select('status', 'Todos los estados', ${statusOptions}, 'key', 'value')}"></div>
                <div class="w-full sm:w-auto" th:replace="~{components/ui/listing :: filter-select('channel', 'Todos los canales', ${channelOptions}, 'key', 'value')}"></div>
                <div th:replace="~{components/ui/listing :: clear-filters(${clearFiltersUrl}, ${hasActiveFilters})}"></div>
            </div>

            <div class="flex items-center gap-3 self-end xl:self-auto">
                <div th:replace="~{components/ui/listing :: sort(${ {'newest': 'Más recientes', 'oldest': 'Más antiguos', 'total_desc': 'Mayor total', 'total_asc': 'Menor total'} })}"></div>
                <div th:replace="~{components/ui/listing :: page-size()}"></div>
            </div>
        </div>

        <!-- Fila 2: Chips de Filtros Activos y Selector de Vistas (Tabla / Tarjetas / Compacto) -->
        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 border-t border-slate-800 pt-4 mt-2 w-full">
            <div id="active-filters-chips-container" class="flex-1 min-w-0">
                <div th:replace="~{components/ui/listing :: active-filters-chips}"></div>
            </div>

            <!-- SELECTOR DE VISTAS RESPONSIVO IGUAL A PRODUCTOS -->
            <div class="flex items-center bg-slate-950 border border-slate-800 p-1 rounded-xl w-fit flex-shrink-0 ml-auto lg:ml-0">
                <!-- Botón Tabla: Visible en PC -->
                <button type="button" onclick="setOrdersView('table')" class="view-btn view-btn-table hidden sm:flex px-3 py-1.5 text-sm font-bold rounded-lg text-slate-500 hover:text-slate-300 transition-all items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                    <span>Tabla</span>
                </button>
                <!-- Botón Tarjetas: Visible en ambos -->
                <button type="button" onclick="setOrdersView('grid')" class="view-btn view-btn-grid flex px-3 py-1.5 text-sm font-bold rounded-lg text-slate-500 hover:text-slate-300 transition-all items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    <span>Tarjetas</span>
                </button>
                <!-- Botón Compacto: Visible en Móvil -->
                <button type="button" onclick="setOrdersView('compact')" class="view-btn view-btn-compact flex sm:hidden px-3 py-1.5 text-sm font-bold rounded-lg text-slate-500 hover:text-slate-300 transition-all items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    <span>Compacto</span>
                </button>
            </div>
        </div>
    </form>

    <!-- WRAPPER DE VISTA (Controlado por JS) -->
    <div id="orders-view-wrapper" class="view-table">
        <!-- ZONA AJAX: RESULTADOS -->
        <div id="listing-results-container" th:fragment="listing-content" class="relative transition-opacity duration-200">

            <div th:if="${page.empty}">
                <div th:replace="~{components/ui/listing :: empty-state('Aún no hay pedidos', 'No se encontraron pedidos con los filtros actuales o aún no has recibido ninguno en tu tienda.', 'M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4', @{|/dashboard/${slug}/orders|})}"></div>
            </div>

            <div th:unless="${page.empty}">
                <!-- 1. VISTA TABLA (Escritorio por defecto) -->
                <div class="order-view-table bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-sm">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm text-slate-400 min-w-[900px]">
                            <thead class="text-xs uppercase bg-slate-950 text-slate-500 border-b border-slate-800">
                            <tr>
                                <th scope="col" class="px-6 py-4 font-bold tracking-wider">Pedido</th>
                                <th scope="col" class="px-6 py-4 font-bold tracking-wider">Fecha</th>
                                <th scope="col" class="px-6 py-4 font-bold tracking-wider">Cliente</th>
                                <th scope="col" class="px-6 py-4 font-bold tracking-wider">Artículos</th>
                                <th scope="col" class="px-6 py-4 font-bold tracking-wider">Total</th>
                                <th scope="col" class="px-6 py-4 font-bold tracking-wider">Estado</th>
                                <th scope="col" class="px-6 py-4 font-bold tracking-wider text-right">Acción</th>
                            </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800/60">
                            <tr th:each="order : ${orders}" class="hover:bg-slate-800/40 transition cursor-pointer" th:onclick="|window.location.href='@{/dashboard/{slug}/orders/{id}(slug=${slug},id=${order.id})}'|">
                                <td class="px-6 py-4 font-black text-white text-base whitespace-nowrap">
                                    <span th:text="'#' + ${order.id}">#1</span>
                                    <span th:text="${order.channel.getDisplayName()}" th:class="'ml-2 text-[9px] uppercase tracking-wider font-bold px-2 py-0.5 rounded-full border ' + ${order.channel.getBadgeClasses()}"></span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap" th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy')}">Fecha</td>
                                <td class="px-6 py-4">
                                    <p class="font-bold text-white truncate max-w-[180px]" th:text="${order.customerName}">Nombre</p>
                                    <p class="text-xs text-slate-500 truncate max-w-[180px]" th:text="${order.city}">Ciudad</p>
                                </td>
                                <td class="px-6 py-4 font-medium whitespace-nowrap" th:text="${order.getTotalItemsCount()} + ' prod.'">1 prod.</td>
                                <td class="px-6 py-4 font-black text-storevo-400 whitespace-nowrap" th:text="${order.total != null ? '$ ' + #numbers.formatDecimal(order.total, 1, 'POINT', 0, 'COMMA') : '$ 0'}">$0</td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span th:text="${order.status.getDisplayName()}" th:class="'text-[10px] uppercase tracking-wider font-bold px-3 py-1.5 rounded-full border ' + ${order.status.getBadgeClasses()}"></span>
                                </td>
                                <td class="px-6 py-4 text-right whitespace-nowrap">
                                    <a th:href="@{/dashboard/{slug}/orders/{id}(slug=${slug}, id=${order.id})}" class="text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg font-medium transition inline-block">Gestionar</a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 2. VISTA TARJETAS (Escala a 4 columnas en pantallas grandes para llenar todo el ancho) -->
                <div class="order-view-grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6">
                    <div th:each="order : ${orders}" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 hover:border-storevo-500/50 hover:shadow-xl transition-all duration-300 flex flex-col gap-4 shadow-sm group">
                        <div class="flex justify-between items-start gap-2">
                            <div>
                                <div class="flex items-center gap-2 mb-1 flex-wrap">
                                    <span class="font-black text-white text-lg" th:text="'#' + ${order.id}"></span>
                                    <span th:text="${order.channel.getDisplayName()}" th:class="'text-[9px] uppercase tracking-wider font-bold px-2 py-0.5 rounded-full border ' + ${order.channel.getBadgeClasses()}"></span>
                                </div>
                                <p class="text-xs text-slate-500 font-medium" th:text="${#temporals.format(order.createdAt, 'dd MMM, yyyy - HH:mm')}"></p>
                            </div>
                            <span th:text="${order.status.getDisplayName()}" th:class="'text-[10px] uppercase tracking-wider font-bold px-3 py-1.5 rounded-full border flex-shrink-0 ' + ${order.status.getBadgeClasses()}"></span>
                        </div>
                        <div class="py-3 border-y border-slate-800/60 flex justify-between items-center">
                            <div class="min-w-0 pr-3">
                                <p class="font-bold text-slate-200 text-sm truncate" th:text="${order.customerName}"></p>
                                <p class="text-xs text-slate-500 mt-0.5 truncate" th:text="${order.city}"></p>
                            </div>
                            <div class="text-right flex-shrink-0">
                                <p class="text-xs text-slate-400 mb-0.5" th:text="${order.getTotalItemsCount()} + ' prod.'"></p>
                                <p class="font-black text-storevo-400 text-base" th:text="${order.total != null ? '$ ' + #numbers.formatDecimal(order.total, 1, 'POINT', 0, 'COMMA') : '$ 0'}"></p>
                            </div>
                        </div>
                        <div class="flex justify-end mt-auto">
                            <a th:href="@{/dashboard/{slug}/orders/{id}(slug=${slug}, id=${order.id})}" class="text-slate-300 hover:text-white bg-slate-800 group-hover:bg-storevo-500 group-hover:border-storevo-500 border border-slate-700 px-4 py-2 rounded-lg font-bold transition-all text-sm flex items-center gap-2">
                                Gestionar
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- 3. VISTA COMPACTA (Alternativa Móvil) -->
                <div class="order-view-compact flex-col gap-2">
                    <div th:each="order : ${orders}" th:onclick="|window.location.href='@{/dashboard/{slug}/orders/{id}(slug=${slug},id=${order.id})}'|"
                         class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 hover:border-slate-700 transition flex flex-col sm:flex-row sm:items-center justify-between gap-3 cursor-pointer shadow-sm group">
                        <div class="flex items-center gap-2.5 overflow-hidden w-full">
                            <span class="font-black text-white text-base flex-shrink-0" th:text="'#' + ${order.id}"></span>
                            <span class="text-slate-600 hidden xs:inline">·</span>
                            <span class="text-slate-300 text-sm font-medium truncate" th:text="${order.customerName}"></span>
                            <span class="text-slate-600">·</span>
                            <span class="font-black text-storevo-400 text-sm flex-shrink-0" th:text="${order.total != null ? '$' + #numbers.formatDecimal(order.total, 1, 'POINT', 0, 'COMMA') : '$0'}"></span>
                        </div>
                        <div class="flex items-center justify-between sm:justify-end gap-3 w-full sm:w-auto border-t border-slate-800 sm:border-0 pt-2 sm:pt-0 mt-1 sm:mt-0">
                            <div class="flex items-center gap-2">
                                <span th:text="${order.status.getDisplayName()}" th:class="'text-[10px] uppercase tracking-wider font-bold px-2.5 py-1 rounded border ' + ${order.status.getBadgeClasses()}"></span>
                            </div>
                            <span class="text-slate-500 group-hover:text-storevo-400 transition-colors bg-slate-800 p-1.5 rounded-lg">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Paginación Común -->
                <div class="mt-6 overflow-x-auto pb-2">
                    <div th:replace="~{components/ui/listing :: pagination(${page})}"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de listados AJAX base -->
    <div th:replace="~{components/ui/listing :: scripts}"></div>
</div>

<!-- Lógica de Vistas separada en archivo JS externo -->
<th:block layout:fragment="scripts">
    <script th:src="@{/js/modules/ordersList.js}"></script>
</th:block>
</body>
</html>
