<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/dashboard-layout}">
<head>
    <title>Formulario Categoría</title>
</head>
<body>
<div layout:fragment="content" class="max-w-2xl mx-auto">
    <div class="mb-6 flex items-center gap-4">
        <a th:href="@{|/dashboard/${slug}/categories|}" class="text-slate-400 hover:text-white transition bg-slate-800 p-2 rounded-lg">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </a>
        <h2 class="text-2xl font-bold text-white" th:text="${category.id != null ? 'Editar Categoría' : 'Nueva Categoría'}">Título</h2>
    </div>

    <form th:action="@{|/dashboard/${slug}/categories|}" th:object="${category}" method="POST" class="bg-slate-900 border border-slate-800 rounded-xl shadow-sm p-8 space-y-6">
        <input type="hidden" th:field="*{id}">

        <div th:replace="~{components/ui/fragments :: input('name', 'Nombre de la Categoría (*)', 'text', 'Ej: Camisas', *{name})}"></div>

        <!-- NUEVO: Selector de Padre -->
        <div>
            <label for="parentId" class="block text-sm font-medium text-slate-300 mb-1">Categoría Principal (Opcional)</label>
            <select id="parentId" th:field="*{parentId}" class="w-full px-4 py-2 bg-slate-950 border border-slate-800 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-storevo-500 cursor-pointer">
                <option value="">Ninguna (Es Categoría Principal)</option>
                <option th:each="c : ${allCategories}" th:if="${c.id != category.id}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>
        </div>

        <div th:replace="~{components/ui/fragments :: textarea('description', 'Descripción (Opcional)', 'Breve descripción...', *{description}, '3')}"></div>
        <div th:replace="~{components/ui/fragments :: input('displayOrder', 'Orden de Visualización', 'number', '0', *{displayOrder})}"></div>

        <div class="space-y-3 pt-2">
            <!-- Checkbox Estado -->
            <div class="flex items-center gap-3">
                <input type="checkbox" id="isActive" th:field="*{isActive}" class="w-5 h-5 rounded border-slate-700 bg-slate-950 text-storevo-500 focus:ring-storevo-500 cursor-pointer">
                <label for="isActive" class="text-sm font-medium text-slate-300 cursor-pointer">Categoría Activa (Habilita compras en esta sección)</label>
            </div>

            <!-- NUEVO: Checkbox Navbar -->
            <div class="flex items-center gap-3">
                <input type="checkbox" id="showInNav" th:field="*{showInNav}" class="w-5 h-5 rounded border-slate-700 bg-slate-950 text-storevo-500 focus:ring-storevo-500 cursor-pointer">
                <label for="showInNav" class="text-sm font-medium text-slate-300 cursor-pointer">Mostrar enlace en el Menú Principal (Navbar)</label>
            </div>
        </div>

        <div class="pt-6 border-t border-slate-800 flex justify-end gap-4">
            <a th:href="@{|/dashboard/${slug}/categories|}" class="bg-slate-800 hover:bg-slate-700 text-white font-medium py-2 px-6 rounded-lg border border-slate-700 transition duration-200">Cancelar</a>
            <div th:replace="~{components/ui/fragments :: btn-primary('Guardar Categoría', 'submit')}"></div>
        </div>
    </form>
</div>
</body>
</html>
