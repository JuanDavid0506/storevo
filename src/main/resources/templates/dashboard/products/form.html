<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/dashboard-layout}">
<head>
    <title>Formulario Producto</title>
</head>
<body>
<div layout:fragment="content" class="max-w-5xl mx-auto">

    <div class="mb-6 flex items-center gap-4">
        <a th:href="@{|/dashboard/${slug}/products|}" class="text-slate-400 hover:text-white transition bg-slate-800 p-2 rounded-lg">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </a>
        <h2 class="text-2xl font-black tracking-tight text-white" th:text="${product.id != null ? 'Editar Producto' : 'Nuevo Producto'}">Título</h2>
    </div>

    <div id="categoryDataBridge" class="hidden">
        <div th:each="cat : ${categories}" class="cat-data-node"
             th:data-id="${cat.id}"
             th:data-name="${cat.name}"
             th:data-parent-id="${cat.parentCategory?.id}">
        </div>
    </div>

    <form th:action="@{|/dashboard/${slug}/products|}" th:object="${product}" method="POST" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <input type="hidden" th:field="*{id}">

        <div class="lg:col-span-2 space-y-6">

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-sm space-y-4">
                <div class="flex items-center gap-2 border-b border-slate-800 pb-3 mb-4">
                    <span class="bg-slate-800 text-slate-400 w-6 h-6 flex items-center justify-center rounded-full text-xs font-bold">1</span>
                    <h3 class="text-lg font-bold text-white">Información Básica</h3>
                </div>
                <div th:replace="~{components/ui/fragments :: input('name', 'Nombre del Producto (*)', 'text', 'Ej: Camisa Oversize', *{name})}"></div>
                <div th:replace="~{components/ui/fragments :: textarea('description', 'Descripción', 'Detalles, material, cuidados...', *{description}, '3')}"></div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-sm space-y-4">
                <div class="flex items-center gap-2 border-b border-slate-800 pb-3 mb-4">
                    <span class="bg-slate-800 text-slate-400 w-6 h-6 flex items-center justify-center rounded-full text-xs font-bold">2</span>
                    <h3 class="text-lg font-bold text-white">Organización</h3>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-2">Categoría Principal</label>
                    <select id="mainCatSelect" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-storevo-500 cursor-pointer font-medium">
                        <option value="">Selecciona la categoría del catálogo...</option>
                    </select>
                </div>

                <div id="subCatBox" class="hidden pt-3 border-t border-slate-800 mt-4">
                    <label class="block text-xs font-bold uppercase tracking-wide text-slate-500 mb-3 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
                        Subcategorías Disponibles
                    </label>
                    <div id="subCatChips" class="flex flex-wrap gap-2"></div>
                </div>

                <div id="catSummaryBox" class="hidden mt-4 p-4 bg-storevo-500/10 border border-storevo-500/20 rounded-xl flex items-center gap-4 transition-all">
                    <div class="bg-storevo-500/20 p-2 rounded-lg text-storevo-400">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    </div>
                    <div>
                        <p class="text-[11px] text-storevo-400 font-bold uppercase tracking-wider mb-0.5">Destino en el Catálogo Público</p>
                        <p id="summaryText" class="text-white font-bold text-base flex items-center gap-2"></p>
                    </div>
                </div>

                <input type="hidden" id="finalCategoryId" th:field="*{categoryId}">
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-sm space-y-4">
                <div class="flex items-center gap-2 border-b border-slate-800 pb-3 mb-4">
                    <span class="bg-slate-800 text-slate-400 w-6 h-6 flex items-center justify-center rounded-full text-xs font-bold">3</span>
                    <h3 class="text-lg font-bold text-white">Precios e Inventario</h3>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div th:replace="~{components/ui/fragments :: input('price', 'Precio Base ($) (*)', 'number', '0.00', *{price})}"></div>
                    <div th:replace="~{components/ui/fragments :: input('discountPrice', 'Precio con Descuento ($)', 'number', '0.00', *{discountPrice})}"></div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div th:replace="~{components/ui/fragments :: input('stock', 'Cantidad en Stock (*)', 'number', '0', *{stock})}"></div>
                    <div th:replace="~{components/ui/fragments :: input('sku', 'Código SKU', 'text', 'Ej: CAM-001', *{sku})}"></div>
                </div>
            </div>
        </div>

        <div class="space-y-6">

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-sm">
                <div class="flex items-center gap-2 border-b border-slate-800 pb-3 mb-4">
                    <span class="bg-slate-800 text-slate-400 w-6 h-6 flex items-center justify-center rounded-full text-xs font-bold">4</span>
                    <h3 class="text-lg font-bold text-white">Apariencia</h3>
                </div>

                <div th:if="${product.mainImageUrl != null and !product.mainImageUrl.isEmpty()}" class="mb-4 rounded-xl overflow-hidden border border-slate-800 aspect-square bg-slate-950 flex items-center justify-center">
                    <img th:src="${product.mainImageUrl}" alt="Vista previa" class="object-cover w-full h-full">
                </div>

                <div th:replace="~{components/ui/fragments :: input('mainImageUrl', 'URL de la Imagen Principal', 'url', 'https://...', *{mainImageUrl})}"></div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-sm space-y-4">
                <h3 class="text-lg font-bold text-white border-b border-slate-800 pb-2 mb-4">Detalles Adicionales</h3>

                <div th:replace="~{components/ui/fragments :: input('brand', 'Marca (Opcional)', 'text', 'Ej: Nike', *{brand})}"></div>

                <label class="flex items-start gap-3 pt-4 border-t border-slate-800 mt-4 cursor-pointer group">
                    <div class="flex items-center h-5 mt-0.5">
                        <input type="checkbox" id="isActive" th:field="*{isActive}" class="w-5 h-5 rounded border-slate-700 bg-slate-950 text-storevo-500 focus:ring-storevo-500 cursor-pointer">
                    </div>
                    <div>
                        <p class="text-sm font-bold text-white group-hover:text-storevo-400 transition-colors">Producto Visible</p>
                        <p class="text-xs text-slate-400 mt-0.5">Actívalo para que los clientes lo vean en la tienda pública.</p>
                    </div>
                </label>
            </div>

            <div class="pt-2 flex flex-col gap-3">
                <button type="submit" class="w-full bg-storevo-500 hover:bg-storevo-600 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-storevo-500/30 transition-all text-center">
                    Guardar Producto
                </button>
                <a th:href="@{|/dashboard/${slug}/products|}" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 px-6 rounded-xl border border-slate-700 transition-all text-center">
                    Cancelar
                </a>
            </div>
        </div>
    </form>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const catNodes = document.querySelectorAll('.cat-data-node');

            // Si por alguna razón está vacío, no hacemos nada para no lanzar errores
            if (catNodes.length === 0) return;

            const catMap = new Map();
            const rootCats = [];

            // Leer datos del HTML
            catNodes.forEach(node => {
                const id = parseInt(node.dataset.id);
                const name = node.dataset.name;
                const parentId = node.dataset.parentId ? parseInt(node.dataset.parentId) : null;

                catMap.set(id, {
                    id: id,
                    name: name,
                    parentId: parentId,
                    subs: []
                });
            });

            // Armar el árbol
            catMap.forEach((cat) => {
                if (cat.parentId && catMap.has(cat.parentId)) {
                    catMap.get(cat.parentId).subs.push(cat);
                } else if (!cat.parentId) {
                    rootCats.push(cat);
                }
            });

            const mainCatSelect = document.getElementById("mainCatSelect");
            const subCatBox = document.getElementById("subCatBox");
            const subCatChips = document.getElementById("subCatChips");
            const catSummaryBox = document.getElementById("catSummaryBox");
            const summaryText = document.getElementById("summaryText");
            const finalCategoryId = document.getElementById("finalCategoryId");

            // Rellenar Select Principal
            rootCats.forEach(root => {
                const opt = document.createElement("option");
                opt.value = root.id;
                opt.textContent = root.name;
                mainCatSelect.appendChild(opt);
            });

            function updateSummary(rootName, subName, finalId) {
                finalCategoryId.value = finalId;
                catSummaryBox.classList.remove('hidden');

                if (subName) {
                    summaryText.innerHTML = `${rootName} <span class="text-slate-500 font-normal mx-1">/</span> ${subName}`;
                } else {
                    summaryText.textContent = rootName;
                }
            }

            function renderChips(rootNode, activeChipId = null) {
                subCatChips.innerHTML = '';

                if (rootNode.subs.length > 0) {
                    subCatBox.classList.remove('hidden');

                    rootNode.subs.forEach(sub => {
                        const btn = document.createElement("button");
                        btn.type = "button";
                        btn.dataset.id = sub.id;

                        const inactiveClass = "px-4 py-2 rounded-xl text-sm font-bold border transition-all duration-200 bg-slate-900 border-slate-700 text-slate-300 hover:border-storevo-500 hover:text-storevo-400";
                        const activeClass = "px-4 py-2 rounded-xl text-sm font-bold border-transparent transition-all duration-200 bg-storevo-500 text-white shadow-lg shadow-storevo-500/30";

                        btn.className = activeChipId == sub.id ? activeClass : inactiveClass;
                        btn.textContent = sub.name;

                        btn.addEventListener("click", () => {
                            Array.from(subCatChips.children).forEach(b => b.className = inactiveClass);
                            btn.className = activeClass;
                            updateSummary(rootNode.name, sub.name, sub.id);
                        });

                        subCatChips.appendChild(btn);
                    });
                } else {
                    subCatBox.classList.add('hidden');
                }
            }

            mainCatSelect.addEventListener("change", (e) => {
                const rootId = parseInt(e.target.value);

                if (!rootId) {
                    subCatBox.classList.add('hidden');
                    catSummaryBox.classList.add('hidden');
                    finalCategoryId.value = "";
                    return;
                }

                const rootNode = catMap.get(rootId);
                renderChips(rootNode);
                updateSummary(rootNode.name, null, rootNode.id);
            });

            // Modo Edición
            const initialId = finalCategoryId.value;
            if (initialId && initialId !== "") {
                const node = catMap.get(parseInt(initialId));
                if (node) {
                    if (node.parentId) {
                        mainCatSelect.value = node.parentId;
                        const parentNode = catMap.get(node.parentId);
                        renderChips(parentNode, node.id);
                        updateSummary(parentNode.name, node.name, node.id);
                    } else {
                        mainCatSelect.value = node.id;
                        renderChips(node, null);
                        updateSummary(node.name, null, node.id);
                    }
                }
            }
        });
    </script>
</div>
</body>
</html>
