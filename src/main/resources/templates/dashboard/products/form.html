<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/dashboard-layout}">
<head>
    <title>Formulario Producto</title>
</head>
<body>
<div layout:fragment="content" class="max-w-4xl mx-auto">

    <div class="mb-6 flex items-center gap-4">
        <a href="/dashboard/products" class="text-slate-400 hover:text-white transition bg-slate-800 p-2 rounded-lg">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </a>
        <h2 class="text-2xl font-bold text-white" th:text="${product.id != null ? 'Editar Producto' : 'Nuevo Producto'}">Título</h2>
    </div>

    <form th:action="@{/dashboard/products}" th:object="${product}" method="POST" class="space-y-6">
        <input type="hidden" th:field="*{id}">

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-sm space-y-4">
                    <h3 class="text-lg font-medium text-white border-b border-slate-800 pb-2 mb-4">Información Básica</h3>
                    <div th:replace="~{components/ui/fragments :: input('name', 'Nombre del Producto (*)', 'text', 'Ej: Camiseta Oversize', *{name})}"></div>
                    <div th:replace="~{components/ui/fragments :: textarea('description', 'Descripción', 'Detalles del producto...', *{description}, '4')}"></div>
                </div>

                <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-sm space-y-4">
                    <h3 class="text-lg font-medium text-white border-b border-slate-800 pb-2 mb-4">Precios e Inventario</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div th:replace="~{components/ui/fragments :: input('price', 'Precio Base ($) (*)', 'number', '0.00', *{price})}"></div>
                        <div th:replace="~{components/ui/fragments :: input('discountPrice', 'Precio con Descuento ($)', 'number', '0.00', *{discountPrice})}"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div th:replace="~{components/ui/fragments :: input('stock', 'Cantidad en Stock (*)', 'number', '0', *{stock})}"></div>
                        <div th:replace="~{components/ui/fragments :: input('sku', 'Código SKU', 'text', 'Ej: CAM-001', *{sku})}"></div>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-sm space-y-4">
                    <h3 class="text-lg font-medium text-white border-b border-slate-800 pb-2 mb-4">Organización</h3>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Categoría</label>
                        <select th:field="*{categoryId}" class="w-full px-4 py-2 bg-slate-950 border border-slate-800 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-storevo-500">
                            <option value="">Sin Categoría</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                        </select>
                    </div>

                    <div th:replace="~{components/ui/fragments :: input('brand', 'Marca', 'text', 'Ej: Nike', *{brand})}"></div>

                    <div class="flex items-center gap-3 pt-4">
                        <input type="checkbox" id="isActive" th:field="*{isActive}" class="w-5 h-5 rounded border-slate-700 bg-slate-950 text-storevo-500 focus:ring-storevo-500">
                        <label for="isActive" class="text-sm font-medium text-slate-300">Producto Visible</label>
                    </div>
                </div>

                <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-sm">
                    <h3 class="text-lg font-medium text-white border-b border-slate-800 pb-2 mb-4">Imagen Principal</h3>
                    <div th:replace="~{components/ui/fragments :: input('mainImageUrl', 'URL de la Imagen', 'url', 'https://...', *{mainImageUrl})}"></div>
                    <p class="text-xs text-slate-500 mt-2">Pega la URL de una imagen para visualizarla en la tienda.</p>
                </div>
            </div>
        </div>

        <div class="pt-6 flex justify-end gap-4">
            <a href="/dashboard/products" class="bg-slate-800 hover:bg-slate-700 text-white font-medium py-2 px-6 rounded-lg border border-slate-700">Cancelar</a>
            <div th:replace="~{components/ui/fragments :: btn-primary('Guardar Producto', 'submit')}"></div>
        </div>
    </form>

</div>
</body>
</html>
