<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/dashboard-layout}">
<head>
  <title>Productos</title>
</head>
<body>
<div layout:fragment="content" class="space-y-6">

  <div class="flex justify-between items-center">
    <div>
      <h2 class="text-2xl font-bold text-white">Tu Inventario</h2>
      <p class="text-sm text-slate-400 mt-1">Gestiona los productos, precios y stock de tu tienda.</p>
    </div>
    <a th:href="@{|/dashboard/${slug}/products/new|}" class="bg-storevo-500 hover:bg-storevo-600 text-white font-medium py-2 px-4 rounded-lg flex items-center gap-2 transition shadow-lg shadow-storevo-500/20">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      Agregar Producto
    </a>
  </div>

  <form id="listing-form" method="GET" class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3 shadow-sm"
        th:with="clearFiltersUrl=@{|/dashboard/${slug}/products|},
                 hasActiveFilters=${(param.q != null and not #strings.isEmpty(param.q[0]))
                   or (param.categoryId != null and not #strings.isEmpty(param.categoryId[0]))
                   or (param.isActive != null and not #strings.isEmpty(param.isActive[0]))}">
    <div class="flex flex-col md:flex-row justify-between gap-4">
      <div class="flex flex-col sm:flex-row sm:flex-wrap gap-3 flex-1">
        <div th:replace="~{components/ui/listing :: search('Buscar por nombre o SKU...')}"></div>
        <div th:replace="~{components/ui/listing :: category-combobox('categoryId', 'Todas las categorías', ${categoryTreeJson})}"></div>
        <div th:replace="~{components/ui/listing :: filter-select('status', 'Todos (Sin papelera)', ${ {'active':'Activos', 'inactive':'Inactivos', 'deleted':'Papelera (Eliminados)'} }, 'key', 'value')}"></div>
        <div th:replace="~{components/ui/listing :: clear-filters(${clearFiltersUrl}, ${hasActiveFilters})}"></div>
      </div>
      <div class="flex items-center gap-3 self-end md:self-auto">
        <div th:replace="~{components/ui/listing :: sort(${ {
                'newest': 'Más recientes',
                'price_asc': 'Precio: Menor a Mayor',
                'price_desc': 'Precio: Mayor a Menor',
                'stock_asc': 'Menor Stock'
            } })}"></div>
        <div th:replace="~{components/ui/listing :: page-size()}"></div>
      </div>
    </div>
    <div th:replace="~{components/ui/listing :: active-filters-chips}"></div>
  </form>

  <div th:if="${products.empty}">
    <div th:replace="~{components/ui/listing :: empty-state(
        'Aún no hay productos',
        'No se encontraron productos con los filtros actuales o aún no has agregado ninguno a tu tienda.',
        'M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4',
        @{|/dashboard/${slug}/products|}
    )}"></div>
  </div>

  <div th:unless="${products.empty}" class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-sm">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm text-slate-400">
        <thead class="text-xs uppercase bg-slate-800 text-slate-300">
        <tr>
          <th scope="col" class="px-6 py-4 font-medium">Producto</th>
          <th scope="col" class="px-6 py-4 font-medium">Categoría</th>
          <th scope="col" class="px-6 py-4 font-medium text-right">Precio</th>
          <th scope="col" class="px-6 py-4 font-medium text-center">Stock Total</th>
          <th scope="col" class="px-6 py-4 font-medium text-center">Estado</th>
          <th scope="col" class="px-6 py-4 font-medium text-right">Acciones</th>
        </tr>
        </thead>
        <tbody class="divide-y divide-slate-800">
        <tr th:each="prod : ${products}" class="hover:bg-slate-800/50 transition">
          <td class="px-6 py-4 flex items-center gap-4">
            <div class="w-12 h-12 bg-slate-800 rounded-lg flex-shrink-0 border border-slate-700 overflow-hidden shadow-sm">
              <img th:if="${prod.mainImageUrl != null}" th:src="${prod.getMainImageThumbnailUrl() != null ? prod.getMainImageThumbnailUrl() : '/img/placeholder.jpg'}" class="w-full h-full object-cover">
            </div>
            <div>
              <p class="font-bold text-white text-base leading-tight mb-0.5" th:text="${prod.name}">Nombre</p>
              <div class="flex items-center gap-2">
                <span th:if="${prod.hasVariants}" class="inline-flex items-center gap-1 bg-storevo-500/10 text-storevo-400 border border-storevo-500/20 text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                  Variantes
                </span>
                <span th:unless="${prod.hasVariants}" class="text-xs text-slate-500 font-mono" th:text="${'SKU: ' + (prod.sku != null ? prod.sku : 'N/A')}">SKU</span>
              </div>
            </div>
          </td>

          <td class="px-6 py-4 text-slate-300 font-medium" th:text="${prod.category != null ? prod.category.name : 'General'}">Categoría</td>

          <td class="px-6 py-4 text-right">
            <p class="font-bold text-storevo-400 text-base">
              <span th:if="${prod.hasVariants}" class="text-[10px] font-bold uppercase tracking-widest text-slate-500 mr-1 block">Desde</span>
              <span th:text="${prod.price != null ? '$ ' + #numbers.formatDecimal(prod.price, 1, 'POINT', 0, 'COMMA') : '$ 0'}">$0</span>
            </p>
          </td>

          <td class="px-6 py-4 text-center">
            <span th:text="${prod.stock}" th:class="${prod.stock <= 5 ? 'bg-red-500/10 text-red-400 px-3 py-1 rounded-lg font-black border border-red-500/20' : 'text-slate-300 font-bold bg-slate-950 px-3 py-1 rounded-lg border border-slate-700'}">0</span>
          </td>

          <td class="px-6 py-4 text-center">
            <span th:if="${prod.isActive}" class="bg-green-500/10 text-green-400 text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full border border-green-500/20">Activo</span>
            <span th:unless="${prod.isActive}" class="bg-slate-500/10 text-slate-400 text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full border border-slate-500/20">Oculto</span>
          </td>

          <td class="px-6 py-4 text-right">
            <div th:if="${!prod.isDeleted}" class="flex justify-end gap-2">
              <form th:action="@{|/dashboard/${slug}/products/${prod.id}/toggle|}" method="POST" class="m-0">
                <button type="submit" class="p-2 bg-slate-800 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700 transition shadow-sm" title="Activar/Desactivar"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg></button>
              </form>
              <a th:href="@{|/dashboard/${slug}/products/${prod.id}/edit|}" class="p-2 bg-slate-800 rounded-lg text-blue-400 hover:text-blue-300 hover:bg-slate-700 transition shadow-sm" title="Editar"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></a>
              <form th:action="@{|/dashboard/${slug}/products/${prod.id}/delete|}" method="POST" class="m-0" data-confirm="¿Mover este producto a la papelera? Podrás restaurarlo más adelante.">
                <button type="submit" class="p-2 bg-slate-800 rounded-lg text-orange-400 hover:text-orange-300 hover:bg-slate-700 transition shadow-sm" title="Mover a papelera">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
              </form>
            </div>

            <div th:if="${prod.isDeleted}" class="flex justify-end gap-2">
              <form th:action="@{|/dashboard/${slug}/products/${prod.id}/restore|}" method="POST" class="m-0" data-confirm="¿Restaurar producto?">
                <button type="submit" class="bg-slate-800 text-blue-400 hover:bg-slate-700 px-3 py-2 rounded-lg flex items-center gap-2 text-xs font-bold transition shadow-sm" title="Restaurar"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg> Restaurar</button>
              </form>
              <form th:action="@{|/dashboard/${slug}/products/${prod.id}/hard-delete|}" method="POST" class="m-0" data-confirm="¿Borrar definitivamente? Esta acción no se puede deshacer.">
                <button type="submit" class="bg-red-500/10 border border-red-500/20 text-red-500 hover:bg-red-500 hover:text-white px-3 py-2 rounded-lg flex items-center gap-2 text-xs font-bold transition shadow-sm" title="Destruir para siempre"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
              </form>
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <div class="px-6 pb-6">
      <div th:replace="~{components/ui/listing :: pagination(${products})}"></div>
    </div>
  </div>

  <div th:replace="~{components/ui/listing :: scripts}"></div>

</div>
</body>
</html>
