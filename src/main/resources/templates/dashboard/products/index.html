<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/dashboard-layout}">
<head>
  <title>Productos</title>
</head>
<body>
<div layout:fragment="content" class="space-y-6">

  <div class="flex justify-between items-center">
    <div>
      <h2 class="text-2xl font-bold text-white">Tu Inventario</h2>
      <p class="text-sm text-slate-400 mt-1">Gestiona los productos, precios y stock de tu tienda.</p>
    </div>
    <a th:href="@{|/dashboard/${slug}/products/new|}" class="bg-storevo-500 hover:bg-storevo-600 text-white font-medium py-2 px-4 rounded-lg flex items-center gap-2 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      Agregar Producto
    </a>
  </div>

  <div th:if="${param.success}" class="bg-green-500/10 border border-green-500/50 text-green-400 px-4 py-3 rounded-lg">Producto guardado correctamente.</div>
  <div th:if="${param.deleted}" class="bg-red-500/10 border border-red-500/50 text-red-400 px-4 py-3 rounded-lg">Producto eliminado del inventario.</div>

  <form id="listing-form" method="GET" class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3 shadow-sm"
        th:with="clearFiltersUrl=@{|/dashboard/${slug}/products|},
                 hasActiveFilters=${(param.q != null and not #strings.isEmpty(param.q[0]))
                   or (param.categoryId != null and not #strings.isEmpty(param.categoryId[0]))
                   or (param.isActive != null and not #strings.isEmpty(param.isActive[0]))}">
    <div class="flex flex-col md:flex-row justify-between gap-4">

      <div class="flex flex-col sm:flex-row sm:flex-wrap gap-3 flex-1">
        <div th:replace="~{components/ui/listing :: search('Buscar por nombre o SKU...')}"></div>

        <div th:replace="~{components/ui/listing :: category-combobox('categoryId', 'Todas las categorías', ${categoryTreeJson})}"></div>
        <div th:replace="~{components/ui/listing :: filter-select('isActive', 'Cualquier estado', ${ {'true':'Activos', 'false':'Inactivos'} }, 'key', 'value')}"></div>

        <div th:replace="~{components/ui/listing :: clear-filters(${clearFiltersUrl}, ${hasActiveFilters})}"></div>
      </div>

      <div class="flex items-center gap-3 self-end md:self-auto">
        <div th:replace="~{components/ui/listing :: sort(${ {
                'newest': 'Más recientes',
                'price_asc': 'Precio: Menor a Mayor',
                'price_desc': 'Precio: Mayor a Menor',
                'stock_asc': 'Menor Stock'
            } })}"></div>

        <div th:replace="~{components/ui/listing :: page-size()}"></div>
      </div>
    </div>

    <div th:replace="~{components/ui/listing :: active-filters-chips}"></div>
  </form>

  <div th:if="${products.empty}">
    <div th:replace="~{components/ui/listing :: empty-state(
        'Aún no hay productos',
        'No se encontraron productos con los filtros actuales o aún no has agregado ninguno a tu tienda.',
        'M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4',
        @{|/dashboard/${slug}/products|}
    )}"></div>
  </div>

  <div th:unless="${products.empty}" class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-sm">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm text-slate-400">
        <thead class="text-xs uppercase bg-slate-800 text-slate-300">
        <tr>
          <th scope="col" class="px-6 py-4 font-medium">Producto</th>
          <th scope="col" class="px-6 py-4 font-medium">Categoría</th>
          <th scope="col" class="px-6 py-4 font-medium">Precio</th>
          <th scope="col" class="px-6 py-4 font-medium text-center">Stock</th>
          <th scope="col" class="px-6 py-4 font-medium text-center">Estado</th>
          <th scope="col" class="px-6 py-4 font-medium text-right">Acciones</th>
        </tr>
        </thead>
        <tbody class="divide-y divide-slate-800">
        <tr th:each="prod : ${products}" class="hover:bg-slate-800/50 transition">
          <td class="px-6 py-4 flex items-center gap-3">
            <div class="w-10 h-10 bg-slate-800 rounded flex-shrink-0 border border-slate-700 overflow-hidden">
              <img th:if="${prod.images != null && !prod.images.isEmpty()}" th:src="${prod.images[0]}" class="w-full h-full object-cover">
            </div>
            <div>
              <p class="font-bold text-white" th:text="${prod.name}">Nombre</p>
              <p class="text-xs text-slate-500" th:text="${'SKU: ' + (prod.sku != null ? prod.sku : 'N/A')}">SKU</p>
            </div>
          </td>
          <td class="px-6 py-4" th:text="${prod.category != null ? prod.category.name : 'Sin categoría'}">Categoría</td>
          <td class="px-6 py-4 font-medium text-storevo-400" th:text="${prod.price != null ? '$ ' + #numbers.formatDecimal(prod.price, 1, 'POINT', 0, 'COMMA') : '$ 0'}">$0</td>
          <td class="px-6 py-4 text-center">
            <span th:text="${prod.stock}" th:class="${prod.stock <= 5 ? 'text-red-400 font-bold' : 'text-slate-300'}">0</span>
          </td>
          <td class="px-6 py-4 text-center">
            <span th:if="${prod.isActive}" class="bg-green-500/10 text-green-400 text-xs font-medium px-2 py-1 rounded-full border border-green-500/20">Activo</span>
            <span th:unless="${prod.isActive}" class="bg-slate-500/10 text-slate-400 text-xs font-medium px-2 py-1 rounded-full border border-green-500/20">Inactivo</span>
          </td>
          <td class="px-6 py-4 text-right">
            <div class="flex justify-end gap-3">
              <form th:action="@{|/dashboard/${slug}/products/${prod.id}/toggle|}" method="POST" class="m-0">
                <button type="submit" class="text-slate-400 hover:text-white transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg></button>
              </form>

              <a th:href="@{|/dashboard/${slug}/products/${prod.id}/edit|}" class="text-blue-400 hover:text-blue-300 transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></a>

              <form th:action="@{|/dashboard/${slug}/products/${prod.id}/delete|}" method="POST" class="m-0" onsubmit="return confirm('¿Eliminar producto?');">
                <button type="submit" class="text-red-400 hover:text-red-300 transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
              </form>
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <div class="px-6 pb-6">
      <div th:replace="~{components/ui/listing :: pagination(${products})}"></div>
    </div>
  </div>

  <div th:replace="~{components/ui/listing :: scripts}"></div>

</div>
</body>
</html>
