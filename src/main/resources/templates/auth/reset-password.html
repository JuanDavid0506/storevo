<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/public-layout}">
<head>
    <title>Crear Nueva Contraseña</title>
</head>
<body>
<div layout:fragment="content" class="min-h-[80vh] flex items-center justify-center px-4 py-16">
    <div class="w-full max-w-md bg-slate-800/80 border border-slate-700/80 rounded-2xl shadow-2xl p-8 space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-white">Define tu nueva contraseña</h1>
            <p class="text-sm text-slate-400 mt-1">
                Tu nueva contraseña debe tener al menos 8 caracteres.
            </p>
        </div>

        <div th:if="${errorMessage}"
             class="bg-red-500/10 border border-red-500/40 text-red-300 px-4 py-3.5 rounded-xl text-xs font-medium"
             th:text="${errorMessage}"></div>

        <form th:action="@{/reset-password}" method="POST" class="space-y-4">
            <input type="hidden" name="token" th:value="${token}">

            <div>
                <label for="password" class="block text-sm font-medium text-slate-300 mb-1">Nueva contraseña</label>
                <input type="password" id="password" name="password" required minlength="8" autofocus
                       placeholder="Mínimo 8 caracteres"
                       class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label for="confirmPassword" class="block text-sm font-medium text-slate-300 mb-1">Confirmar nueva contraseña</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8"
                       placeholder="Repite tu nueva contraseña"
                       class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 px-4 rounded-xl shadow-lg shadow-indigo-600/25 transition text-sm cursor-pointer">
                Guardar nueva contraseña
            </button>
        </form>
    </div>
</div>
</body>
</html>
