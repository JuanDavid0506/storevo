<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Storevo</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-white font-sans antialiased h-screen flex flex-col justify-center items-center">

<div class="w-full max-w-md p-8 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl">
    <div class="text-center mb-8">
        <a href="/" class="text-3xl font-bold tracking-tight text-white hover:text-slate-300 transition">Storevo<span class="text-storevo-500">.</span></a>
        <h2 class="text-xl font-medium mt-4 text-slate-300">Bienvenido de vuelta</h2>
    </div>

    <!-- Alerta de Error (Se muestra solo si la URL tiene ?error=true) -->
    <div th:if="${param.error}" class="bg-red-500/10 border border-red-500/50 text-red-500 px-4 py-3 rounded-lg mb-6 text-sm text-center">
        Correo o contraseña incorrectos.
    </div>

    <form th:action="@{/auth/login}" method="POST" class="space-y-6">
        <div>
            <label for="email" class="block text-sm font-medium text-slate-400 mb-2">Correo electrónico</label>
            <input type="email" id="email" name="email" required
                   class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-storevo-500 focus:border-transparent transition">
        </div>

        <div>
            <div class="flex justify-between items-center mb-2">
                <label for="password" class="block text-sm font-medium text-slate-400">Contraseña</label>
                <a href="#" class="text-xs text-storevo-500 hover:text-storevo-400 transition">¿Olvidaste tu contraseña?</a>
            </div>
            <input type="password" id="password" name="password" required
                   class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-storevo-500 focus:border-transparent transition">
        </div>

        <button type="submit" class="w-full bg-storevo-500 hover:bg-storevo-600 text-white font-bold py-3 px-4 rounded-lg transition duration-300">
            Entrar al Dashboard
        </button>
    </form>

    <p class="mt-8 text-center text-sm text-slate-400">
        ¿No tienes una cuenta?
        <a href="/register" class="text-storevo-500 hover:text-storevo-400 font-medium transition">Crea tu tienda gratis</a>
    </p>
</div>

</body>
</html>
