<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Tienda | Storevo</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Oculta los radio buttons originales para estilizar tarjetas */
        .radio-card input[type="radio"] { display: none; }
        .radio-card input[type="radio"]:checked + div {
            border-color: #3b82f6; /* Color Storevo (Ajusta según tu tailwind.config) */
            background-color: rgba(59, 130, 246, 0.1);
        }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans antialiased min-h-screen flex flex-col justify-center items-center py-12">

<div class="w-full max-w-2xl p-8 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl">

    <div class="text-center mb-8">
        <a href="/" class="text-3xl font-bold tracking-tight text-white hover:text-slate-300 transition">Storevo<span class="text-storevo-500">.</span></a>

        <div class="flex items-center justify-center gap-2 mt-6">
            <div id="dot-1" class="w-3 h-3 rounded-full bg-storevo-500 transition-colors"></div>
            <div class="w-8 h-0.5 bg-slate-800"></div>
            <div id="dot-2" class="w-3 h-3 rounded-full bg-slate-700 transition-colors"></div>
            <div class="w-8 h-0.5 bg-slate-800"></div>
            <div id="dot-3" class="w-3 h-3 rounded-full bg-slate-700 transition-colors"></div>
        </div>
    </div>

    <div th:if="${param.error}" class="bg-red-500/10 border border-red-500/50 text-red-500 px-4 py-3 rounded-lg mb-6 text-sm text-center">
        Hubo un error. Verifica que el correo o nombre de tienda no existan ya.
    </div>

    <form th:action="@{/auth/register}" method="POST" id="wizardForm">

        <div id="step-1" class="space-y-5 block">
            <h2 class="text-xl font-medium text-slate-300 text-center mb-6">Empecemos con lo básico</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Nombre de la Tienda</label>
                    <input type="text" name="storeName" id="storeName" placeholder="Ej: Ropa Urbana" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:ring-2 focus:ring-storevo-500 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Enlace de tu tienda</label>
                    <div class="flex">
                        <input type="text" name="slug" id="slug" placeholder="ropaurbana" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-l-lg text-white placeholder-slate-500 focus:ring-2 focus:ring-storevo-500 transition">
                        <span class="inline-flex items-center px-3 rounded-r-lg border border-l-0 border-slate-700 bg-slate-800 text-slate-400 text-xs font-medium">.storevo.com</span>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Tu Nombre</label>
                <input type="text" name="ownerName" id="ownerName" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-storevo-500 transition">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Correo electrónico</label>
                    <input type="email" name="email" id="email" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-storevo-500 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Contraseña</label>
                    <input type="password" name="password" id="password" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-storevo-500 transition">
                </div>
            </div>

            <button type="button" onclick="nextStep(2)" class="w-full mt-6 bg-storevo-500 hover:bg-storevo-600 text-white font-bold py-3 px-4 rounded-lg transition duration-300">
                Siguiente: Tipo de Negocio
            </button>
        </div>

        <div id="step-2" class="space-y-5 hidden">
            <h2 class="text-xl font-medium text-slate-300 text-center mb-6">¿Qué vas a vender?</h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <label class="radio-card cursor-pointer">
                    <input type="radio" name="businessType" value="single" checked>
                    <div class="p-5 border-2 border-slate-700 bg-slate-800 rounded-xl hover:border-slate-500 transition text-center h-full">
                        <span class="text-3xl block mb-2">🧢</span>
                        <h3 class="font-bold text-white">Una sola línea</h3>
                        <p class="text-xs text-slate-400 mt-2">Gorras, perfumes, bolsos, etc.</p>
                    </div>
                </label>

                <label class="radio-card cursor-pointer">
                    <input type="radio" name="businessType" value="general">
                    <div class="p-5 border-2 border-slate-700 bg-slate-800 rounded-xl hover:border-slate-500 transition text-center h-full">
                        <span class="text-3xl block mb-2">👕</span>
                        <h3 class="font-bold text-white">Moda General</h3>
                        <p class="text-xs text-slate-400 mt-2">Camisetas, jeans, suéteres, etc.</p>
                    </div>
                </label>

                <label class="radio-card cursor-pointer">
                    <input type="radio" name="businessType" value="mixed">
                    <div class="p-5 border-2 border-slate-700 bg-slate-800 rounded-xl hover:border-slate-500 transition text-center h-full">
                        <span class="text-3xl block mb-2">🛍️</span>
                        <h3 class="font-bold text-white">Moda + Accesorios</h3>
                        <p class="text-xs text-slate-400 mt-2">Inventario amplio y variado.</p>
                    </div>
                </label>
            </div>

            <div class="flex gap-4 mt-6">
                <button type="button" onclick="prevStep(1)" class="w-1/3 bg-slate-800 hover:bg-slate-700 text-white font-medium py-3 px-4 rounded-lg transition">Atrás</button>
                <button type="button" onclick="nextStep(3)" class="w-2/3 bg-storevo-500 hover:bg-storevo-600 text-white font-bold py-3 px-4 rounded-lg transition duration-300">Siguiente: Elegir Plantilla</button>
            </div>
        </div>

        <div id="step-3" class="space-y-5 hidden">
            <h2 class="text-xl font-medium text-slate-300 text-center mb-2">Elige el diseño de tu tienda</h2>
            <p class="text-sm text-slate-500 text-center mb-6">No te preocupes, puedes cambiar los colores después.</p>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <label class="radio-card cursor-pointer">
                    <input type="radio" name="themeName" value="minimalista" checked>
                    <div class="p-4 border-2 border-slate-700 bg-slate-800 rounded-xl hover:border-slate-500 transition">
                        <div class="w-full h-24 bg-slate-900 rounded-lg mb-3 flex flex-col items-center justify-center border border-slate-700">
                            <div class="w-12 h-1 bg-white mb-2 rounded"></div>
                            <div class="w-8 h-1 bg-slate-500 rounded"></div>
                        </div>
                        <h3 class="font-bold text-white text-center">Minimalista</h3>
                    </div>
                </label>

                <label class="radio-card cursor-pointer">
                    <input type="radio" name="themeName" value="urbano">
                    <div class="p-4 border-2 border-slate-700 bg-slate-800 rounded-xl hover:border-slate-500 transition">
                        <div class="w-full h-24 bg-indigo-900 rounded-lg mb-3 flex flex-col items-center justify-center border border-indigo-700">
                            <h4 class="text-indigo-400 font-black italic">URBAN</h4>
                        </div>
                        <h3 class="font-bold text-white text-center">Urbano</h3>
                    </div>
                </label>

                <label class="radio-card cursor-pointer">
                    <input type="radio" name="themeName" value="elegante">
                    <div class="p-4 border-2 border-slate-700 bg-slate-800 rounded-xl hover:border-slate-500 transition">
                        <div class="w-full h-24 bg-stone-900 rounded-lg mb-3 flex flex-col items-center justify-center border border-stone-700">
                            <div class="w-10 h-10 border border-stone-500 rounded-full"></div>
                        </div>
                        <h3 class="font-bold text-white text-center">Elegante</h3>
                    </div>
                </label>
            </div>

            <div class="flex gap-4 mt-8">
                <button type="button" onclick="prevStep(2)" class="w-1/3 bg-slate-800 hover:bg-slate-700 text-white font-medium py-3 px-4 rounded-lg transition">Atrás</button>
                <button type="submit" class="w-2/3 bg-gradient-to-r from-storevo-600 to-storevo-400 hover:from-storevo-500 hover:to-storevo-300 text-white font-bold py-3 px-4 rounded-lg transition duration-300 shadow-lg shadow-storevo-500/30">
                    ¡Crear mi tienda ahora!
                </button>
            </div>
        </div>

    </form>

    <p class="mt-8 text-center text-sm text-slate-400">
        ¿Ya tienes una tienda? <a href="/login" class="text-storevo-500 hover:text-storevo-400 font-medium transition">Inicia sesión</a>
    </p>
</div>

<script>
    function validateStep1() {
        const storeName = document.getElementById('storeName').value;
        const slug = document.getElementById('slug').value;
        const owner = document.getElementById('ownerName').value;
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;

        if(!storeName || !slug || !owner || !email || !pass) {
            alert("Por favor, completa todos los datos para continuar.");
            return false;
        }
        return true;
    }

    function nextStep(step) {
        if(step === 2 && !validateStep1()) return;

        // Ocultar todos
        document.getElementById('step-1').classList.add('hidden');
        document.getElementById('step-2').classList.add('hidden');
        document.getElementById('step-3').classList.add('hidden');

        // Mostrar el actual
        document.getElementById('step-' + step).classList.remove('hidden');

        // Actualizar dots
        document.getElementById('dot-1').className = step >= 1 ? 'w-3 h-3 rounded-full bg-storevo-500 transition-colors' : 'w-3 h-3 rounded-full bg-slate-700 transition-colors';
        document.getElementById('dot-2').className = step >= 2 ? 'w-3 h-3 rounded-full bg-storevo-500 transition-colors' : 'w-3 h-3 rounded-full bg-slate-700 transition-colors';
        document.getElementById('dot-3').className = step >= 3 ? 'w-3 h-3 rounded-full bg-storevo-500 transition-colors' : 'w-3 h-3 rounded-full bg-slate-700 transition-colors';
    }

    function prevStep(step) {
        // Ocultar todos
        document.getElementById('step-1').classList.add('hidden');
        document.getElementById('step-2').classList.add('hidden');
        document.getElementById('step-3').classList.add('hidden');

        // Mostrar el anterior
        document.getElementById('step-' + step).classList.remove('hidden');

        // Actualizar dots
        document.getElementById('dot-1').className = step >= 1 ? 'w-3 h-3 rounded-full bg-storevo-500 transition-colors' : 'w-3 h-3 rounded-full bg-slate-700 transition-colors';
        document.getElementById('dot-2').className = step >= 2 ? 'w-3 h-3 rounded-full bg-storevo-500 transition-colors' : 'w-3 h-3 rounded-full bg-slate-700 transition-colors';
        document.getElementById('dot-3').className = step >= 3 ? 'w-3 h-3 rounded-full bg-storevo-500 transition-colors' : 'w-3 h-3 rounded-full bg-slate-700 transition-colors';
    }
</script>

</body>
</html>
