<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Tienda | Storevo</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-white font-sans antialiased min-h-screen flex flex-col justify-center items-center py-12">

<div class="w-full max-w-2xl p-8 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl">

    <div class="text-center mb-8">
        <a href="/" class="text-3xl font-bold tracking-tight text-white hover:text-slate-300 transition">Storevo<span class="text-storevo-500">.</span></a>
        <p class="text-slate-400 mt-2">Crea tu tienda profesional en segundos.</p>
    </div>

    <div th:if="${param.error}" class="bg-red-500/10 border border-red-500/50 text-red-500 px-4 py-3 rounded-lg mb-6 text-sm text-center">
        Hubo un error. Verifica que el correo o el enlace de la tienda no existan ya.
    </div>

    <form th:action="@{/auth/register}" method="POST" class="space-y-5">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
                <label for="storeName" class="block text-sm font-medium text-slate-400 mb-1">Nombre de la Tienda</label>
                <input type="text" name="storeName" id="storeName" required placeholder="Ej: Moda Urbana" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:ring-2 focus:ring-storevo-500 transition">
            </div>
            <div>
                <label for="slug" class="block text-sm font-medium text-slate-400 mb-1">Enlace de tu tienda</label>
                <div class="flex">
                    <input type="text" name="slug" id="slug" required placeholder="modaurbana" pattern="[a-z0-9-]+" title="Solo letras minúsculas, números y guiones" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-l-lg text-white placeholder-slate-500 focus:ring-2 focus:ring-storevo-500 transition">
                    <span class="inline-flex items-center px-3 rounded-r-lg border border-l-0 border-slate-700 bg-slate-800 text-slate-400 text-xs font-medium">.storevo.com</span>
                </div>
            </div>
        </div>

        <div>
            <label for="ownerName" class="block text-sm font-medium text-slate-400 mb-1">Tu Nombre Completo</label>
            <input type="text" name="ownerName" id="ownerName" required class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-storevo-500 transition">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
                <label for="email" class="block text-sm font-medium text-slate-400 mb-1">Correo electrónico</label>
                <input type="email" name="email" id="email" required class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-storevo-500 transition">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-slate-400 mb-1">Contraseña</label>
                <input type="password" name="password" id="password" required class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-storevo-500 transition">
            </div>
        </div>

        <button type="submit" class="w-full mt-6 bg-gradient-to-r from-storevo-600 to-storevo-400 hover:from-storevo-500 hover:to-storevo-300 text-white font-bold py-3 px-4 rounded-lg transition duration-300 shadow-lg shadow-storevo-500/30">
            Crear mi tienda ahora
        </button>

    </form>

    <p class="mt-8 text-center text-sm text-slate-400">
        ¿Ya tienes una cuenta? <a href="/login" class="text-storevo-500 hover:text-storevo-400 font-medium transition">Inicia sesión aquí</a>
    </p>
</div>

</body>
</html>
