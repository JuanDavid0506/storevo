<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Tienda | Storevo</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-white font-sans antialiased min-h-screen flex flex-col justify-center items-center py-12">

<div class="w-full max-w-md p-8 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl">
    <div class="text-center mb-8">
        <a href="/" class="text-3xl font-bold tracking-tight text-white hover:text-slate-300 transition">Storevo<span class="text-storevo-500">.</span></a>
        <h2 class="text-xl font-medium mt-4 text-slate-300">Crea tu tienda en segundos</h2>
    </div>

    <!-- Alerta de Error -->
    <div th:if="${param.error}" class="bg-red-500/10 border border-red-500/50 text-red-500 px-4 py-3 rounded-lg mb-6 text-sm text-center">
        Hubo un error. El subdominio o correo ya existen.
    </div>

    <form th:action="@{/auth/register}" method="POST" class="space-y-5">
        <div>
            <label for="storeName" class="block text-sm font-medium text-slate-400 mb-1">Nombre de la Tienda</label>
            <input type="text" id="storeName" name="storeName" placeholder="Ej: Ropa Urbana" required
                   class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:ring-2 focus:ring-storevo-500 transition">
        </div>

        <div>
            <label for="slug" class="block text-sm font-medium text-slate-400 mb-1">Enlace de tu tienda</label>
            <div class="flex">
                <input type="text" id="slug" name="slug" placeholder="ropaurbana" required
                       class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-l-lg text-white placeholder-slate-500 focus:ring-2 focus:ring-storevo-500 transition">
                <span class="inline-flex items-center px-3 rounded-r-lg border border-l-0 border-slate-700 bg-slate-800 text-slate-400 text-sm">
                        .storevo.com
                    </span>
            </div>
        </div>

        <div>
            <label for="ownerName" class="block text-sm font-medium text-slate-400 mb-1">Tu Nombre</label>
            <input type="text" id="ownerName" name="ownerName" required
                   class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-storevo-500 transition">
        </div>

        <div>
            <label for="email" class="block text-sm font-medium text-slate-400 mb-1">Correo electrónico</label>
            <input type="email" id="email" name="email" required
                   class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-storevo-500 transition">
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-slate-400 mb-1">Contraseña</label>
            <input type="password" id="password" name="password" required
                   class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-storevo-500 transition">
        </div>

        <button type="submit" class="w-full mt-2 bg-storevo-500 hover:bg-storevo-600 text-white font-bold py-3 px-4 rounded-lg transition duration-300">
            Construir mi tienda
        </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-400">
        ¿Ya tienes una tienda?
        <a href="/login" class="text-storevo-500 hover:text-storevo-400 font-medium transition">Inicia sesión</a>
    </p>
</div>

</body>
</html>
