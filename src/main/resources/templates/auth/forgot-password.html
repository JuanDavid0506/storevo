<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/public-layout}">
<head>
    <title>Recuperar Contraseña</title>
</head>
<body>
<div layout:fragment="content" class="min-h-[80vh] flex items-center justify-center px-4 py-16">
    <div class="w-full max-w-md bg-slate-800/80 border border-slate-700/80 rounded-2xl shadow-2xl p-8 space-y-6">
        <div class="text-center">
            <div class="w-12 h-12 rounded-xl bg-indigo-500/15 border border-indigo-500/30 text-indigo-400 flex items-center justify-center mx-auto mb-4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-white">¿Olvidaste tu contraseña?</h1>
            <p class="text-sm text-slate-400 mt-1">
                Ingresa el correo electrónico de tu cuenta y te enviaremos un enlace seguro para restablecerla.
            </p>
        </div>

        <div th:if="${successMessage != null or param.sent != null}"
             class="bg-emerald-500/10 border border-emerald-500/40 text-emerald-300 px-4 py-3.5 rounded-xl text-xs leading-relaxed font-medium">
            <span th:text="${successMessage != null ? successMessage : 'Si el correo ingresado está registrado en Storevo, recibirás un enlace para restablecer tu contraseña en los próximos minutos.'}"></span>
        </div>

        <div th:if="${errorMessage}"
             class="bg-red-500/10 border border-red-500/40 text-red-300 px-4 py-3.5 rounded-xl text-xs font-medium"
             th:text="${errorMessage}"></div>

        <form th:action="@{/forgot-password}" method="POST" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-slate-300 mb-1">Correo electrónico</label>
                <input type="email" id="email" name="email" required autofocus
                       placeholder="tu@correo.com"
                       class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 px-4 rounded-xl shadow-lg shadow-indigo-600/25 transition text-sm cursor-pointer">
                Enviar enlace de recuperación
            </button>
        </form>

        <div class="pt-4 border-t border-slate-700/70 text-center">
            <a th:href="@{/login}" class="text-xs font-medium text-slate-400 hover:text-white transition">
                ← Volver a Iniciar Sesión
            </a>
        </div>
    </div>
</div>
</body>
</html>
