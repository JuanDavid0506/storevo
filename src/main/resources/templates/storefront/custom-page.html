<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/store-layout}">
<head>
    <title th:text="${pageTitle}">Página</title>
</head>
<body>
<div layout:fragment="content" class="min-h-[70vh]">
    <th:block th:if="${theme != null}"
              th:with="activeKey=${editorPageKey != null ? editorPageKey : ('page:' + customPage.slug)},
                       customSections=${theme.getPageSections(activeKey)}">
        <th:block th:each="sec : ${customSections}" th:if="${sec.enabled}">
            <div th:replace="~{storefront/sections/theme-sections :: render-section(${sec})}"></div>
        </th:block>

        <div th:if="${#lists.isEmpty(customSections) and (isDraftPreview == true)}"
             class="max-w-3xl mx-auto px-4 py-16 text-center">
            <div class="bg-white text-slate-800 p-8 store-radius border border-dashed border-slate-300 shadow-sm">
                <p class="font-bold text-base">Esta página aún no tiene secciones activas</p>
                <p class="text-xs text-slate-500 mt-1">Usa el botón "+ Agregar nueva sección" en el panel izquierdo para construir el contenido de esta página.</p>
            </div>
        </div>
    </th:block>
</div>
<th:block layout:fragment="scripts">
    <script th:src="@{/js/modules/storeCatalog.js}"></script>
</th:block>
</body>
</html>
