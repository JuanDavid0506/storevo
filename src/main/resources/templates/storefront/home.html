<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/store-layout}">
<head>
    <title>Inicio</title>
</head>
<body>
<div layout:fragment="content">

    <div class="bg-brand text-white py-20 px-4 text-center">
        <h1 class="text-4xl md:text-6xl font-bold mb-4">Bienvenido a <span th:text="${settings.storeName}">Tienda</span></h1>
        <p class="text-lg md:text-xl opacity-90 max-w-2xl mx-auto">Explora nuestro catálogo y descubre los mejores productos diseñados para ti.</p>
        <a th:href="@{/s/{slug}/catalog(slug=${slug})}" class="inline-block mt-8 bg-white text-brand font-bold py-3 px-8 rounded-lg shadow-lg hover:bg-slate-50 transition">
            Ver Catálogo
        </a>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <h2 class="text-3xl font-bold text-slate-900 mb-8 text-center">Novedades</h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
            <div th:each="prod : ${products}" th:if="${prod.isActive}" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden group hover:shadow-md transition">
                <div class="aspect-square bg-slate-100 overflow-hidden relative">
                    <div th:if="${prod.images == null || prod.images.isEmpty()}" class="w-full h-full flex items-center justify-center text-slate-300">
                        <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    </div>
                    <img th:if="${prod.images != null && !prod.images.isEmpty()}" th:src="${prod.images[0]}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                </div>
                <div class="p-4">
                    <p class="text-xs text-slate-500 mb-1" th:text="${prod.category != null ? prod.category.name : 'Varios'}">Categoría</p>
                    <h3 class="font-bold text-slate-900 truncate" th:text="${prod.name}">Nombre Producto</h3>
                    <p class="text-brand font-bold mt-2" th:text="${prod.price != null ? '$ ' + #numbers.formatDecimal(prod.price, 1, 'POINT', 0, 'COMMA') : '$ 0'}">$0</p>
                    <a th:href="@{/s/{slug}/p/{id}(slug=${slug}, id=${prod.id})}" class="block w-full text-center bg-secondary text-slate-900 border border-slate-200 hover-bg-brand hover:text-white font-medium py-2 rounded-lg mt-4 transition">
                        Ver Detalles
                    </a>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(products)}" class="text-center text-slate-500 py-12">
            Aún no hay productos disponibles.
        </div>
    </div>

</div>
</body>
</html>
