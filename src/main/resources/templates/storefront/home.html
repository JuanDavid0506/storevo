<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/store-layout}">
<head>
    <title>Inicio</title>
</head>
<body>
<div layout:fragment="content">
    <th:block th:if="${theme != null}" th:with="homeSections=${theme.getPageSections('home')}">
        <th:block th:each="sec : ${homeSections}" th:if="${sec.enabled}">
            <div th:replace="~{storefront/sections/theme-sections :: render-section(${sec})}"></div>
        </th:block>
    </th:block>
</div>
<th:block layout:fragment="scripts">
    <script th:src="@{/js/modules/storeCatalog.js}"></script>
</th:block>
</body>
</html>
