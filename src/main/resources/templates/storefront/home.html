<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/store-layout}">
<head>
    <title>Inicio</title>
</head>
<body>
<div layout:fragment="content">

    <!-- Si existe configuración de plantilla (siempre provista por StoreThemeService), renderiza las secciones activas en orden -->
    <th:block th:if="${theme != null and theme.sections != null}">
        <th:block th:each="sec : ${theme.sections}" th:if="${sec.enabled}">
            <div th:replace="~{storefront/sections/theme-sections :: render-section(${sec})}"></div>
        </th:block>
    </th:block>

</div>
</body>
</html>
