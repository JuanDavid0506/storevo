<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/store-layout}">
<head>
    <title>Inicio</title>
</head>
<body>
<div layout:fragment="content">

    <div class="bg-brand text-white py-20 px-4 text-center">
        <h1 class="text-4xl md:text-6xl font-bold mb-4">Bienvenido a <span th:text="${settings.storeName}">Tienda</span></h1>
        <p class="text-lg md:text-xl opacity-90 max-w-2xl mx-auto">Explora nuestro catálogo y descubre los mejores productos diseñados para ti.</p>
        <a th:href="@{/s/{slug}/catalog(slug=${slug})}" class="inline-block mt-8 bg-white text-brand font-bold py-3 px-8 rounded-lg shadow-lg hover:bg-slate-50 transition">
            Ver Catálogo
        </a>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <h2 class="text-3xl font-bold text-slate-900 mb-8 text-center">Novedades</h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
            <div th:each="p : ${products}" class="group relative bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 border border-slate-100 flex flex-col h-full">

                <div class="relative aspect-[4/5] overflow-hidden bg-slate-50 flex-shrink-0">
                    <a th:href="@{/s/{slug}/p/{id}(slug=${slug}, id=${p.id})}">
                        <img th:src="${p.images != null and !p.images.isEmpty() ? p.images[0] : '/img/placeholder.jpg'}" th:alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    </a>

                    <div th:if="${p.discountPrice != null and p.discountPrice > 0}" class="absolute top-3 left-3 bg-red-500 text-white text-[10px] sm:text-xs font-black uppercase px-2.5 py-1 rounded-full shadow-md z-10 pointer-events-none">
                        Oferta
                    </div>

                    <div class="absolute top-3 right-3 flex flex-col gap-2 z-10">
                        <button type="button" th:data-slug="${slug}" th:data-id="${p.id}" onclick="toggleCartItem(this, this.getAttribute('data-slug'), this.getAttribute('data-id'))" class="p-2.5 bg-white/90 backdrop-blur text-slate-400 hover:text-brand rounded-full shadow-lg transition-all duration-300" title="Agregar al carrito">
                            <svg class="w-5 h-5 icon-empty" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                            <svg class="w-5 h-5 icon-filled hidden text-brand" fill="currentColor" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path><path fill="white" d="M10.5 15.5l-3-3 1.4-1.4 1.6 1.6 4.6-4.6 1.4 1.4-6 6z"></path></svg>
                        </button>

                        <button type="button" th:data-slug="${slug}" th:data-id="${p.id}" onclick="toggleWishlistItem(this, this.getAttribute('data-slug'), this.getAttribute('data-id'))"
                                class="p-2.5 backdrop-blur rounded-full shadow-lg transition-all duration-300"
                                th:classappend="${wishlistProductIds != null and wishlistProductIds.contains(p.id) ? 'bg-white border border-red-500 text-red-500' : 'bg-white/90 text-slate-400 hover:text-red-500'}" title="Agregar a favoritos">
                            <svg class="w-5 h-5 icon-heart-empty" th:classappend="${wishlistProductIds != null and wishlistProductIds.contains(p.id) ? 'hidden' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                            <svg class="w-5 h-5 icon-heart-filled" th:classappend="${wishlistProductIds != null and wishlistProductIds.contains(p.id) ? '' : 'hidden'}" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L12 8.343l3.172-3.171a4 4 0 115.656 5.656L12 21.414l-8.828-8.828a4 4 0 010-5.656z" clip-rule="evenodd"></path></svg>
                        </button>
                    </div>
                </div>

                <div class="p-4 flex flex-col flex-grow">
                    <div class="mb-2">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider" th:text="${p.category != null ? p.category.name : 'General'}">Categoría</p>
                        <a th:href="@{/s/{slug}/p/{id}(slug=${slug}, id=${p.id})}">
                            <h3 class="text-sm sm:text-base font-bold text-slate-800 leading-tight mt-1 line-clamp-2 group-hover:text-brand transition-colors" th:text="${p.name}">Producto</h3>
                        </a>
                    </div>

                    <div class="mt-auto pt-3 border-t border-slate-50">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="text-lg font-black text-slate-900" th:text="${'$ ' + #numbers.formatDecimal((p.discountPrice != null and p.discountPrice > 0 ? p.discountPrice : p.price), 1, 'POINT', 0, 'COMMA')}">$0</span>
                            <span th:if="${p.discountPrice != null and p.discountPrice > 0}" class="text-xs text-slate-400 line-through font-medium" th:text="${'$ ' + #numbers.formatDecimal(p.price, 1, 'POINT', 0, 'COMMA')}">$0</span>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <a th:href="@{/s/{slug}/p/{id}(slug=${slug}, id=${p.id})}" class="flex items-center justify-center px-2 py-2 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors text-center">
                                Ver detalles
                            </a>
                            <button type="button" th:data-slug="${slug}" th:data-id="${p.id}" onclick="buyNowFast(this.getAttribute('data-slug'), this.getAttribute('data-id'))" class="flex items-center justify-center px-2 py-2 text-xs font-bold text-white bg-brand hover:bg-brand/90 rounded-lg transition-colors shadow-md shadow-brand/20 text-center">
                                Comprar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(products)}" class="text-center text-slate-500 py-12">
            Aún no hay productos disponibles.
        </div>
    </div>

</div>
</body>
</html>
