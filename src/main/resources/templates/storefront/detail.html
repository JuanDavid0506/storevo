<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/store-layout}">
<head>
  <title th:text="${product.name} + ' - ' + ${settings != null and settings.storeName != null ? settings.storeName : 'Tienda'}">Detalle</title>
</head>
<body>
<div layout:fragment="content">
  <!-- Puente de datos limpio para productDetail.js -->
  <div id="product-detail-bridge" class="hidden"
       th:attr="data-has-variants=${product.hasVariants},
                  data-main-image=${product.mainImageUrl != null ? product.mainImageUrl : '/img/placeholder.jpg'},
                  data-made-to-order=${product.isMadeToOrder},
                  data-base-price=${product.discountPrice != null and product.discountPrice > 0 ? product.discountPrice : product.price},
                  data-original-price=${product.price != null ? product.price : 0},
                  data-has-discount=${product.discountPrice != null and product.discountPrice > 0}">
    <div th:if="${variantsData != null}" th:each="v : ${variantsData}" class="variant-data-node"
         th:attr="data-id=${v['id']},
                      data-signature=${v['signature']},
                      data-price=${v['price']},
                      data-stock=${v['stock']},
                      data-sku=${v['sku']},
                      data-image-ref=${v['imageRef']}"></div>
  </div>

  <th:block th:if="${theme != null}" th:with="productSections=${theme.getPageSections('product')}">
    <th:block th:each="sec : ${productSections}" th:if="${sec.enabled}">
      <div th:replace="~{storefront/sections/theme-sections :: render-section(${sec})}"></div>
    </th:block>
  </th:block>
</div>
<th:block layout:fragment="scripts">
  <script th:src="@{/js/modules/productDetail.js}"></script>
</th:block>
</body>
</html>
