<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layouts/store-layout}"
      xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
    <title>Finalizar Compra</title>
</head>
<body>
<div layout:fragment="content" class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <h1 class="text-3xl font-bold text-slate-900 mb-8 text-center">Datos de Envío</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <form th:action="@{/s/{slug}/cart/checkout/process(slug=${slug})}" method="POST" class="bg-white p-6 md:p-8 rounded-xl shadow-sm border border-slate-200 space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nombre Completo</label>
                <input type="text" name="customerName" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-brand focus:border-brand">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Teléfono / WhatsApp</label>
                <input type="text" name="customerPhone" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-brand focus:border-brand">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Cédula / NIT</label>
                <input type="text" name="customerDocument" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-brand focus:border-brand" placeholder="Necesario para generar tu guía de envío">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Dirección de Entrega</label>
                <input type="text" name="address" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-brand focus:border-brand">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Ciudad</label>
                <input type="text" name="city" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-brand focus:border-brand">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Notas adicionales (Opcional)</label>
                <textarea name="notes" rows="2" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-brand focus:border-brand"></textarea>
            </div>
            <button type="submit" th:formaction="@{/s/{slug}/cart/checkout/process(slug=${slug})}" class="w-full bg-brand text-white font-bold py-3 rounded-lg shadow-md hover-bg-brand transition mt-4">
                Confirmar Pedido
            </button>

            <button th:if="${settings != null and settings.whatsapp != null and !#strings.isEmpty(settings.whatsapp)}"
                    type="submit" th:formaction="@{/s/{slug}/cart/checkout/whatsapp(slug=${slug})}"
                    class="w-full flex items-center justify-center gap-2 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-lg shadow-md transition mt-3">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 004.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm5.83 14.16c-.25.7-1.45 1.33-2 1.42-.53.08-1.03.11-1.78-.11-.41-.12-.93-.29-1.6-.57-2.82-1.22-4.66-4.06-4.8-4.25-.14-.19-1.15-1.53-1.15-2.92s.72-2.07.98-2.35c.25-.28.54-.35.72-.35.18 0 .36 0 .52.01.17.01.39-.06.61.46.25.6.85 2.07.92 2.22.07.15.12.32.02.52-.09.19-.14.32-.28.49-.14.17-.29.37-.42.5-.14.14-.28.29-.12.57.16.28.71 1.17 1.53 1.9 1.05.94 1.94 1.23 2.22 1.37.28.14.45.12.61-.07.17-.19.7-.82.89-1.1.19-.28.37-.23.62-.14.25.09 1.6.75 1.87.89.28.14.46.21.53.32.07.12.07.68-.18 1.38z"></path></svg>
                Enviar pedido por WhatsApp
            </button>
        </form>

        <div class="bg-slate-50 p-6 rounded-xl border border-slate-200 h-fit">
            <h3 class="font-bold text-lg mb-4">Resumen</h3>
            <div class="space-y-3 mb-6">
                <div th:each="item : ${cartItems}" class="flex justify-between text-sm">
                    <span class="text-slate-600 truncate pr-4"><span th:text="${item.quantity}"></span>x <span th:text="${item.name}"></span></span>
                    <span class="font-medium" th:text="${item.subtotal != null ? '$ ' + #numbers.formatDecimal(item.subtotal, 1, 'POINT', 0, 'COMMA') : '$ 0'}"></span>
                </div>
            </div>
            <div class="border-t border-slate-200 pt-4 flex justify-between">
                <span class="font-bold">Total a Pagar</span>
                <span class="font-bold text-xl text-brand" th:text="${cartTotal != null ? '$ ' + #numbers.formatDecimal(cartTotal, 1, 'POINT', 0, 'COMMA') : '$ 0'}"></span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
