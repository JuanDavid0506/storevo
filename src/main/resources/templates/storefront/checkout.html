<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layouts/store-layout}"
      xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
    <title>Finalizar Compra</title>
</head>
<body>
<div layout:fragment="content" class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <h1 class="text-3xl font-bold text-slate-900 mb-8 text-center">Datos de Envío</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <form method="POST" class="bg-white p-6 md:p-8 rounded-xl shadow-sm border border-slate-200 space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nombre Completo</label>
                <input type="text" name="customerName" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-brand focus:border-brand">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Teléfono / WhatsApp</label>
                <input type="text" name="customerPhone" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-brand focus:border-brand">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Cédula / NIT</label>
                <input type="text" name="customerDocument" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-brand focus:border-brand" placeholder="Necesario para generar tu guía de envío">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Dirección de Entrega</label>
                <input type="text" name="address" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-brand focus:border-brand">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Ciudad</label>
                <input type="text" name="city" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-brand focus:border-brand">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Notas adicionales (Opcional)</label>
                <textarea name="notes" rows="2" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-brand focus:border-brand"></textarea>
            </div>

            <!-- Aviso visual si es un producto bajo pedido -->
            <div th:if="${hasMadeToOrderItem}" class="flex items-start gap-3 bg-amber-50 border border-amber-200 text-amber-800 text-sm font-medium p-4 rounded-xl mt-2">
                <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"></path></svg>
                <span>Este pedido contiene productos bajo pedido. Para continuar, coordina tu pedido por WhatsApp.</span>
            </div>

            <!-- LOGICA CONDICIONAL DE RUTEO -->
            <th:block th:with="requiresWhatsapp=${hasMadeToOrderItem or !wompiEnabled}">

                <!-- BOTÓN 1: PAGAR AHORA (Solo si Wompi está habilitado Y no hay productos bajo pedido) -->
                <button th:if="${!requiresWhatsapp}" type="submit" th:formaction="@{/s/{slug}/cart/checkout/process(slug=${slug})}" class="w-full bg-slate-900 text-white font-bold py-3 rounded-lg shadow-md hover:bg-slate-800 transition mt-4">
                    Pagar ahora
                </button>

                <!-- BOTÓN 2: WHATSAPP (Si Wompi NO está habilitado O si hay productos bajo pedido) -->
                <button th:if="${requiresWhatsapp and settings != null and settings.whatsapp != null and !#strings.isEmpty(settings.whatsapp)}"
                        type="submit" th:formaction="@{/s/{slug}/cart/checkout/whatsapp(slug=${slug})}"
                        class="w-full flex items-center justify-center gap-2 bg-[#25D366] hover:bg-[#1ebd5c] text-white font-bold py-3 rounded-lg shadow-md transition mt-4">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.305-.88-.653-1.473-1.46-1.646-1.757-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                    Enviar pedido por WhatsApp
                </button>

                <!-- AVISO DE ERROR: (Si el flujo requiere WhatsApp pero la tienda no lo configuró) -->
                <p th:if="${requiresWhatsapp and (settings == null or settings.whatsapp == null or #strings.isEmpty(settings.whatsapp))}" class="text-xs text-red-500 text-center mt-3 font-bold">
                    Esta tienda no ha configurado su WhatsApp para recibir pedidos. Contáctala directamente.
                </p>

            </th:block>
        </form>

        <div class="bg-slate-50 p-6 rounded-xl border border-slate-200 h-fit">
            <h3 class="font-bold text-lg mb-4">Resumen</h3>
            <div class="space-y-3 mb-6">
                <div th:each="item : ${cartItems}" class="flex justify-between text-sm">
                    <span class="text-slate-600 truncate pr-4"><span th:text="${item.quantity}"></span>x <span th:text="${item.name}"></span></span>
                    <span class="font-medium" th:text="${item.subtotal != null ? '$ ' + #numbers.formatDecimal(item.subtotal, 1, 'POINT', 0, 'COMMA') : '$ 0'}"></span>
                </div>
            </div>
            <div class="border-t border-slate-200 pt-4 flex justify-between">
                <span class="font-bold">Total a Pagar</span>
                <span class="font-bold text-xl text-brand" th:text="${cartTotal != null ? '$ ' + #numbers.formatDecimal(cartTotal, 1, 'POINT', 0, 'COMMA') : '$ 0'}"></span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
