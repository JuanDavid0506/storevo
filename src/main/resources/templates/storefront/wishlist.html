<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layouts/store-layout}">
<head>
  <title th:text="'Mis Favoritos - ' + ${settings.storeName}">Mis Favoritos</title>
</head>
<body>
<div layout:fragment="content" class="min-h-[70vh]">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="mb-10 text-center">
      <h1 class="text-3xl font-black store-heading tracking-tight">Lista de Deseos</h1>
      <p class="store-muted mt-2">Los productos que más te gustaron, guardados para ti.</p>
    </div>

    <div th:if="${#lists.isEmpty(products)}" class="text-center py-20 bg-white text-slate-900 store-radius border border-slate-200/80 shadow-sm px-4">
      <svg class="w-20 h-20 mx-auto text-slate-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
      <h2 class="text-2xl font-bold text-slate-800 mb-2">Tu lista de deseos está vacía</h2>
      <p class="text-slate-500 mb-8">Explora nuestro catálogo y guarda tus favoritos.</p>
      <a th:href="@{/s/{slug}/catalog(slug=${slug})}" class="inline-block bg-brand text-white font-bold py-3 px-8 rounded-xl shadow-md hover-bg-brand transition">Explorar Catálogo</a>
    </div>

    <div th:unless="${#lists.isEmpty(products)}" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
      <th:block th:each="p, pStat : ${products}"
                th:with="isDeleted=${deletedProductIds != null and deletedProductIds.contains(p.id)}">
        <div th:replace="~{components/storefront/product-card :: productCard(${p}, 'wish', ${pStat.index}, ${isDeleted}, '', true)}"></div>
      </th:block>
    </div>
  </div>
</div>
</body>
</html>
