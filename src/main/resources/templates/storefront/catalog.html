<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/store-layout}">
<head>
    <title th:text="${pageTitle} + ' - ' + ${settings.storeName}">Catálogo</title>
</head>
<body>
<div layout:fragment="content" class="min-h-[70vh]">
    <script id="storevo-filter-data-json" type="application/json"
            th:if="${catalogFilterDataJson != null}"
            th:utext="${catalogFilterDataJson}"></script>
    <th:block th:if="${theme != null}"
              th:with="activeKey=${editorPageKey != null ? editorPageKey : 'catalog'},
                       catalogSections=${theme.getPageSections(activeKey)}">
        <th:block th:each="sec : ${catalogSections}" th:if="${sec.enabled}">
            <div th:replace="~{storefront/sections/theme-sections :: render-section(${sec})}"></div>
        </th:block>
    </th:block>
</div>
</body>
</html>
