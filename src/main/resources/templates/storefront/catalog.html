<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layouts/store-layout}">
<head>
    <title th:text="${pageTitle} + ' - ' + ${settings.storeName}">Catálogo</title>
</head>
<body>
<div layout:fragment="content" class="bg-white min-h-[70vh]">
    <div class="bg-slate-50 border-b border-slate-100 py-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-3xl font-black text-slate-900 tracking-tight" th:text="${currentCategory != null ? currentCategory.name : 'Todo el Catálogo'}">Catálogo</h1>
            <p class="text-slate-500 mt-2" th:text="${currentCategory != null ? currentCategory.description : 'Explora todos nuestros productos disponibles.'}">Descripción</p>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div th:if="${#lists.isEmpty(products)}" class="text-center py-20">
            <svg class="w-16 h-16 mx-auto text-slate-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
            <h2 class="text-xl font-bold text-slate-700 mb-2">No se encontraron productos</h2>
            <p class="text-slate-500">Intenta navegar por otra categoría.</p>
        </div>

        <div th:unless="${#lists.isEmpty(products)}" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
            <div th:each="p : ${products}" class="group relative bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 border border-slate-100 flex flex-col h-full">

                <div class="relative aspect-[4/5] overflow-hidden bg-slate-50 flex-shrink-0 group/gallery" th:with="hasMultiple=${p.images != null and p.images.size() > 1}">

                    <a th:href="@{/s/{slug}/p/{id}(slug=${slug}, id=${p.id})}" class="block w-full h-full">
                        <img th:id="'gallery-img-' + ${p.id}" th:src="${p.mainImageUrl != null ? p.mainImageUrl : '/img/placeholder.jpg'}" th:alt="${p.name}" class="w-full h-full object-cover group-hover/gallery:scale-105 transition-transform duration-500">
                    </a>

                    <div th:if="${hasMultiple}" class="absolute inset-0 flex items-center justify-between px-2 opacity-0 group-hover/gallery:opacity-100 transition-opacity duration-300 pointer-events-none z-20">
                        <button type="button" th:data-target="'gallery-img-' + ${p.id}" th:data-images="${#strings.listJoin(p.images.![filePath], ',')}" onclick="Storevo.Gallery.prev(event, this)" class="w-8 h-8 rounded-full bg-white/90 hover:bg-white text-slate-800 flex items-center justify-center shadow-lg pointer-events-auto transition-transform hover:scale-110">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <button type="button" th:data-target="'gallery-img-' + ${p.id}" th:data-images="${#strings.listJoin(p.images.![filePath], ',')}" onclick="Storevo.Gallery.next(event, this)" class="w-8 h-8 rounded-full bg-white/90 hover:bg-white text-slate-800 flex items-center justify-center shadow-lg pointer-events-auto transition-transform hover:scale-110">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>

                    <div th:if="${p.discountPrice != null and p.discountPrice > 0}" class="absolute top-3 left-3 bg-red-500 text-white text-[10px] sm:text-xs font-black uppercase px-2.5 py-1 rounded-full shadow-md z-30 pointer-events-none">
                        Oferta
                    </div>

                    <div class="absolute top-3 right-3 flex flex-col gap-2 z-30">
                        <button type="button" th:data-slug="${slug}" th:data-id="${p.id}" onclick="toggleCartItem(this, this.getAttribute('data-slug'), this.getAttribute('data-id'))" class="p-2.5 bg-white/90 backdrop-blur text-slate-400 hover:text-brand rounded-full shadow-lg transition-all duration-300" title="Agregar al carrito">
                            <svg class="w-5 h-5 icon-empty" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                            <svg class="w-5 h-5 icon-filled hidden text-brand" fill="currentColor" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path><path fill="white" d="M10.5 15.5l-3-3 1.4-1.4 1.6 1.6 4.6-4.6 1.4 1.4-6 6z"></path></svg>
                        </button>

                        <button type="button" th:data-slug="${slug}" th:data-id="${p.id}" onclick="toggleWishlistItem(this, this.getAttribute('data-slug'), this.getAttribute('data-id'))"
                                th:class="${wishlistProductIds != null and wishlistProductIds.contains(p.id)} ? 'p-2.5 backdrop-blur rounded-full shadow-lg transition-all duration-300 bg-white border border-red-500 text-red-500' : 'p-2.5 bg-white/90 backdrop-blur text-slate-400 hover:text-red-500 rounded-full shadow-lg transition-all duration-300'" title="Agregar a favoritos">
                            <svg class="w-5 h-5 icon-heart-empty" th:classappend="${wishlistProductIds != null and wishlistProductIds.contains(p.id)} ? 'hidden' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                            <svg class="w-5 h-5 icon-heart-filled" th:classappend="${wishlistProductIds == null or !wishlistProductIds.contains(p.id)} ? 'hidden' : ''" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L12 8.343l3.172-3.171a4 4 0 115.656 5.656L12 21.414l-8.828-8.828a4 4 0 010-5.656z" clip-rule="evenodd"></path></svg>
                        </button>
                    </div>
                </div>

                <div class="p-4 flex flex-col flex-grow">
                    <div class="mb-2">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider" th:text="${p.category != null ? p.category.name : 'General'}">Categoría</p>
                        <a th:href="@{/s/{slug}/p/{id}(slug=${slug}, id=${p.id})}">
                            <h3 class="text-sm sm:text-base font-bold text-slate-800 leading-tight mt-1 line-clamp-2 group-hover:text-brand transition-colors" th:text="${p.name}">Producto</h3>
                        </a>
                    </div>

                    <div class="mt-auto pt-3 border-t border-slate-50">
                        <div class="flex items-center gap-1.5 mb-3">
                            <span th:if="${p.hasVariants}" class="text-[10px] font-black uppercase tracking-widest text-slate-400 mt-1">Desde</span>
                            <span class="text-lg font-black text-slate-900" th:text="${'$ ' + #numbers.formatDecimal((p.discountPrice != null and p.discountPrice > 0 ? p.discountPrice : p.price), 1, 'POINT', 0, 'COMMA')}">$0</span>
                            <span th:if="${p.discountPrice != null and p.discountPrice > 0}" class="text-xs text-slate-400 line-through font-medium" th:text="${'$ ' + #numbers.formatDecimal(p.price, 1, 'POINT', 0, 'COMMA')}">$0</span>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <a th:href="@{/s/{slug}/p/{id}(slug=${slug}, id=${p.id})}" class="flex items-center justify-center px-2 py-2 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors text-center">
                                Ver detalles
                            </a>

                            <button th:if="${!p.hasVariants}" type="button" th:data-slug="${slug}" th:data-id="${p.id}" onclick="buyNowFast(this.getAttribute('data-slug'), this.getAttribute('data-id'))" class="flex items-center justify-center px-2 py-2 text-xs font-bold text-white bg-brand hover:bg-brand/90 rounded-lg transition-colors shadow-md shadow-brand/20 text-center">
                                Comprar
                            </button>

                            <a th:if="${p.hasVariants}" th:href="@{/s/{slug}/p/{id}(slug=${slug}, id=${p.id})}" class="flex items-center justify-center px-2 py-2 text-xs font-bold text-white bg-slate-800 hover:bg-slate-900 rounded-lg transition-colors shadow-md shadow-slate-900/20 text-center">
                                Ver opciones
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
