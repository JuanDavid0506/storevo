<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/store-layout}">
<head>
    <title>Crear Nueva Contraseña</title>
</head>
<body>
<div layout:fragment="content" class="sv-acct-auth">
    <div class="sv-acct-surface">
        <div class="sv-acct-auth__icon" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
        </div>
        <h1 class="sv-acct-auth__title">Crear nueva contraseña</h1>
        <p class="sv-acct-auth__lead">
            Escribe una contraseña segura para tu cuenta.
        </p>

        <th:block th:replace="~{storefront/account/fragments :: alert('error', ${authError})}"></th:block>

        <form th:action="@{/s/{slug}/account/reset-password(slug=${slug})}" method="POST"
              data-no-spa="true" data-sv-loading class="sv-acct-form">
            <input type="hidden" name="token" th:value="${token}">

            <div>
                <label class="sv-acct-label" for="reset-password">Nueva contraseña <span class="sv-acct-req">*</span></label>
                <div class="sv-acct-pwd">
                    <input id="reset-password" type="password" name="password" required data-pw-new
                           autocomplete="new-password" placeholder="Crea tu nueva contraseña" class="sv-acct-input">
                    <button type="button" class="sv-acct-pwd__toggle" aria-label="Mostrar contraseña" aria-pressed="false" onclick="svAcctTogglePwd(this)">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    </button>
                </div>
            </div>

            <th:block th:replace="~{storefront/account/fragments :: pw-rules}"></th:block>

            <div>
                <label class="sv-acct-label" for="reset-confirm">Confirmar nueva contraseña <span class="sv-acct-req">*</span></label>
                <div class="sv-acct-pwd">
                    <input id="reset-confirm" type="password" name="confirmPassword" required data-pw-confirm
                           autocomplete="new-password" placeholder="Repite la contraseña" class="sv-acct-input">
                    <button type="button" class="sv-acct-pwd__toggle" aria-label="Mostrar contraseña" aria-pressed="false" onclick="svAcctTogglePwd(this)">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    </button>
                </div>
            </div>

            <th:block th:replace="~{storefront/account/fragments :: pw-match}"></th:block>

            <button type="submit" class="sv-acct-btn sv-acct-btn--primary sv-acct-btn--block font-bold rounded-xl">
                Guardar nueva contraseña
            </button>
        </form>
    </div>
</div>
<th:block layout:fragment="scripts">
    <th:block th:replace="~{storefront/account/fragments :: account-js}"></th:block>
</th:block>
</body>
</html>
