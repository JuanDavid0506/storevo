<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/store-layout}">
<head>
    <title>Crear Nueva Contraseña</title>
</head>
<body>
<div layout:fragment="content" class="max-w-md mx-auto px-4 sm:px-6 py-14 sm:py-20 min-h-[70vh]">
    <div class="bg-white text-slate-900 p-6 sm:p-8 store-radius shadow-sm border border-slate-200/80">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">Crear Nueva Contraseña</h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-1.5">
                Escribe una nueva contraseña segura de al menos 8 caracteres para tu cuenta.
            </p>
        </div>

        <div th:if="${authError}" class="mb-5 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-xs sm:text-sm font-bold" th:text="${authError}"></div>

        <form th:action="@{/s/{slug}/account/reset-password(slug=${slug})}" method="POST" data-no-spa="true" class="space-y-4">
            <input type="hidden" name="token" th:value="${token}">

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">
                    Nueva Contraseña <span class="text-red-500">*</span>
                </label>
                <input type="password" name="password" required minlength="8"
                       placeholder="Mínimo 8 caracteres"
                       class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-brand focus:border-brand text-sm text-slate-900">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">
                    Confirmar Nueva Contraseña <span class="text-red-500">*</span>
                </label>
                <input type="password" name="confirmPassword" required minlength="8"
                       placeholder="Repite la contraseña"
                       class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-brand focus:border-brand text-sm text-slate-900">
            </div>

            <button type="submit"
                    class="w-full bg-brand hover-bg-brand text-white font-bold py-3.5 rounded-xl shadow-md transition text-sm cursor-pointer">
                Guardar nueva contraseña
            </button>
        </form>
    </div>
</div>
</body>
</html>
