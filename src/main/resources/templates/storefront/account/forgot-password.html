<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/store-layout}">
<head>
    <title>Recuperar Contraseña</title>
</head>
<body>
<div layout:fragment="content" class="sv-acct-auth">
    <div class="sv-acct-surface">
        <div class="sv-acct-auth__icon" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
        </div>
        <h1 class="sv-acct-auth__title">Recuperar contraseña</h1>
        <p class="sv-acct-auth__lead">
            Ingresa tu correo electrónico o el teléfono de tu cuenta y te enviaremos un enlace para crear una nueva clave.
        </p>

        <th:block th:replace="~{storefront/account/fragments :: alert('error', ${authError})}"></th:block>
        <th:block th:replace="~{storefront/account/fragments :: alert('success', ${authSuccess})}"></th:block>

        <form th:action="@{/s/{slug}/account/forgot-password(slug=${slug})}" method="POST"
              data-no-spa="true" data-sv-loading class="sv-acct-form">
            <div>
                <label class="sv-acct-label" for="forgot-id">Correo electrónico o teléfono <span class="sv-acct-req">*</span></label>
                <input id="forgot-id" type="text" name="emailOrPhone" required autocomplete="username"
                       placeholder="cliente@correo.com o 3001234567" class="sv-acct-input">
            </div>

            <button type="submit" class="sv-acct-btn sv-acct-btn--primary sv-acct-btn--block font-bold rounded-xl">
                Enviar enlace de recuperación
            </button>
        </form>

        <div class="sv-acct-auth__foot">
            <a th:href="@{/s/{slug}/account/login(slug=${slug})}" data-no-spa="true" class="sv-acct-link">← Volver a iniciar sesión</a>
        </div>
    </div>
</div>
<th:block layout:fragment="scripts">
    <th:block th:replace="~{storefront/account/fragments :: account-js}"></th:block>
</th:block>
</body>
</html>
