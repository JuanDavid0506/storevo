<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/store-layout}">
<head>
    <title>Recuperar Contraseña</title>
</head>
<body>
<div layout:fragment="content" class="max-w-md mx-auto px-4 sm:px-6 py-14 sm:py-20 min-h-[70vh]">
    <div class="bg-white text-slate-900 p-6 sm:p-8 store-radius shadow-sm border border-slate-200/80">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">Recuperar Contraseña</h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-1.5">
                Ingresa tu correo electrónico o el número de teléfono de tu cuenta y te enviaremos un enlace para restablecer tu clave.
            </p>
        </div>

        <div th:if="${authError}" class="mb-5 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-xs sm:text-sm font-bold" th:text="${authError}"></div>
        <div th:if="${authSuccess}" class="mb-5 bg-emerald-50 border border-emerald-200 text-emerald-800 px-4 py-3 rounded-xl text-xs sm:text-sm font-bold" th:text="${authSuccess}"></div>

        <form th:action="@{/s/{slug}/account/forgot-password(slug=${slug})}" method="POST" data-no-spa="true" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">
                    Correo Electrónico o Teléfono <span class="text-red-500">*</span>
                </label>
                <input type="text" name="emailOrPhone" required
                       placeholder="Ej: cliente@correo.com o 3001234567"
                       class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-brand focus:border-brand text-sm text-slate-900">
            </div>

            <button type="submit"
                    class="w-full bg-brand hover-bg-brand text-white font-bold py-3.5 rounded-xl shadow-md transition text-sm cursor-pointer">
                Enviar enlace de recuperación
            </button>
        </form>

        <div class="mt-6 pt-5 border-t border-slate-100 text-center">
            <a th:href="@{/s/{slug}/account/login(slug=${slug})}" data-no-spa="true" class="text-xs font-bold text-slate-500 hover:text-brand transition">
                ← Volver a Iniciar Sesión
            </a>
        </div>
    </div>
</div>
</body>
</html>
