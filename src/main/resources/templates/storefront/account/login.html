<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/store-layout}">
<head>
    <title>Mi Cuenta</title>
</head>
<body>
<div layout:fragment="content" class="max-w-md mx-auto px-4 sm:px-6 py-12 sm:py-16 min-h-[75vh]">
    <div class="bg-white text-slate-900 p-6 sm:p-8 store-radius shadow-sm border border-slate-200/80">

        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-brand/10 text-brand rounded-2xl flex items-center justify-center mx-auto mb-3">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-black text-slate-900 tracking-tight"
                th:text="${settings != null and settings.storeName != null ? 'Tu Cuenta en ' + settings.storeName : 'Mi Cuenta'}">
                Mi Cuenta
            </h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">
                Guarda tu bolsa, sigue tus pedidos en tiempo real y compra más rápido.
            </p>
        </div>

        <!-- Alertas -->
        <div th:if="${authError}" class="mb-5 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-xs sm:text-sm font-bold">
            <span th:text="${authError}"></span>
        </div>
        <div th:if="${authSuccess}" class="mb-5 bg-emerald-50 border border-emerald-200 text-emerald-800 px-4 py-3 rounded-xl text-xs sm:text-sm font-bold">
            <span th:text="${authSuccess}"></span>
        </div>

        <!-- Selector de Pestañas (Iniciar Sesión vs Crear Cuenta) -->
        <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-100 rounded-xl mb-6">
            <button type="button" id="tab-btn-login"
                    onclick="switchAuthTab('login')"
                    th:classappend="${activeTab != 'register' ? 'bg-white text-slate-900 shadow-2xs' : 'text-slate-500 hover:text-slate-800'}"
                    class="py-2.5 text-xs sm:text-sm font-bold rounded-lg transition cursor-pointer">
                Iniciar Sesión
            </button>
            <button type="button" id="tab-btn-register"
                    onclick="switchAuthTab('register')"
                    th:classappend="${activeTab == 'register' ? 'bg-white text-slate-900 shadow-2xs' : 'text-slate-500 hover:text-slate-800'}"
                    class="py-2.5 text-xs sm:text-sm font-bold rounded-lg transition cursor-pointer">
                Crear Cuenta
            </button>
        </div>

        <!-- FORMULARIO 1: INICIAR SESIÓN -->
        <form id="panel-auth-login"
              th:action="@{/s/{slug}/account/login(slug=${slug})}"
              method="POST"
              data-no-spa="true"
              th:classappend="${activeTab == 'register' ? 'hidden' : ''}"
              class="space-y-4">
            <input type="hidden" name="redirect" th:if="${redirectUrl != null}" th:value="${redirectUrl}">

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">
                    Correo Electrónico o Teléfono / WhatsApp <span class="text-red-500">*</span>
                </label>
                <input type="text" name="identifier" required
                       th:value="${lastIdentifier != null ? lastIdentifier : ''}"
                       placeholder="Ej: cliente@correo.com o 3001234567"
                       class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-brand focus:border-brand text-sm text-slate-900">
            </div>

            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">
                        Contraseña <span class="text-red-500">*</span>
                    </label>
                    <a th:href="@{/s/{slug}/account/forgot-password(slug=${slug})}"
                       data-no-spa="true"
                       class="text-xs font-bold text-brand hover:underline">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>
                <input type="password" name="password" required
                       placeholder="Ingresa tu contraseña"
                       class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-brand focus:border-brand text-sm text-slate-900">
            </div>

            <label class="flex items-center gap-2 cursor-pointer select-none pt-1">
                <input type="checkbox" name="rememberMe" value="true" checked
                       class="w-4 h-4 rounded border-slate-300 text-brand focus:ring-brand">
                <span class="text-xs font-semibold text-slate-600">Mantener mi sesión iniciada en este dispositivo</span>
            </label>

            <button type="submit"
                    class="w-full bg-brand hover-bg-brand text-white font-bold py-3.5 rounded-xl shadow-md transition text-sm cursor-pointer">
                Ingresar a mi cuenta
            </button>
        </form>

        <!-- FORMULARIO 2: CREAR CUENTA -->
        <form id="panel-auth-register"
              th:action="@{/s/{slug}/account/register(slug=${slug})}"
              method="POST"
              data-no-spa="true"
              th:classappend="${activeTab != 'register' ? 'hidden' : ''}"
              class="space-y-4">
            <input type="hidden" name="redirect" th:if="${redirectUrl != null}" th:value="${redirectUrl}">

            <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-600 leading-relaxed">
                💡 Si ya habías comprado antes en esta tienda como invitado, vincularemos automáticamente tus pedidos anteriores con tu teléfono o correo.
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">
                    Nombre Completo <span class="text-red-500">*</span>
                </label>
                <input type="text" name="name" required
                       th:value="${regName != null ? regName : ''}"
                       placeholder="Nombre y apellidos"
                       class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-brand focus:border-brand text-sm text-slate-900">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">
                    Correo Electrónico <span class="text-red-500">*</span>
                </label>
                <input type="email" name="email" required
                       th:value="${regEmail != null ? regEmail : ''}"
                       placeholder="tu@correo.com"
                       class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-brand focus:border-brand text-sm text-slate-900">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">
                    Teléfono / WhatsApp <span class="text-red-500">*</span>
                </label>
                <input type="tel" name="phone" required
                       th:value="${regPhone != null ? regPhone : ''}"
                       placeholder="Ej: 3001234567"
                       class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-brand focus:border-brand text-sm text-slate-900">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">
                        Contraseña <span class="text-red-500">*</span>
                    </label>
                    <input type="password" name="password" required minlength="8"
                           placeholder="Mín. 8 caracteres"
                           class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-brand focus:border-brand text-sm text-slate-900">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">
                        Confirmar <span class="text-red-500">*</span>
                    </label>
                    <input type="password" name="confirmPassword" required minlength="8"
                           placeholder="Repite tu clave"
                           class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-brand focus:border-brand text-sm text-slate-900">
                </div>
            </div>

            <input type="hidden" name="rememberMe" value="true">

            <button type="submit"
                    class="w-full bg-brand hover-bg-brand text-white font-bold py-3.5 rounded-xl shadow-md transition text-sm cursor-pointer">
                Crear mi cuenta
            </button>
        </form>

        <div class="mt-6 pt-5 border-t border-slate-100 text-center">
            <a th:href="@{/s/{slug}/catalog(slug=${slug})}" class="text-xs font-bold text-slate-500 hover:text-brand transition">
                ← Seguir comprando en la tienda
            </a>
        </div>
    </div>
</div>
<th:block layout:fragment="scripts">
    <script>
        function switchAuthTab(tab) {
            const loginForm = document.getElementById('panel-auth-login');
            const regForm = document.getElementById('panel-auth-register');
            const loginBtn = document.getElementById('tab-btn-login');
            const regBtn = document.getElementById('tab-btn-register');
            if (!loginForm || !regForm) return;
            const isReg = tab === 'register';
            loginForm.classList.toggle('hidden', isReg);
            regForm.classList.toggle('hidden', !isReg);
            if (loginBtn && regBtn) {
                loginBtn.className = 'py-2.5 text-xs sm:text-sm font-bold rounded-lg transition cursor-pointer ' +
                    (!isReg ? 'bg-white text-slate-900 shadow-2xs' : 'text-slate-500 hover:text-slate-800');
                regBtn.className = 'py-2.5 text-xs sm:text-sm font-bold rounded-lg transition cursor-pointer ' +
                    (isReg ? 'bg-white text-slate-900 shadow-2xs' : 'text-slate-500 hover:text-slate-800');
            }
        }
    </script>
</th:block>
</body>
</html>
