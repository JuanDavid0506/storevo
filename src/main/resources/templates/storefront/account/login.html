<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/store-layout}">
<head>
    <title>Mi Cuenta</title>
</head>
<body>
<div layout:fragment="content" class="sv-acct-auth">
    <div class="sv-acct-surface">

        <div class="sv-acct-auth__icon" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </div>
        <h1 class="sv-acct-auth__title"
            th:text="${settings != null and settings.storeName != null ? 'Tu cuenta en ' + settings.storeName : 'Mi Cuenta'}">
            Mi Cuenta
        </h1>
        <p class="sv-acct-auth__lead">
            Guarda tu bolsa, sigue tus pedidos en tiempo real y compra más rápido.
        </p>

        <!-- Avisos -->
        <th:block th:replace="~{storefront/account/fragments :: alert('error', ${authError})}"></th:block>
        <th:block th:replace="~{storefront/account/fragments :: alert('success', ${authSuccess})}"></th:block>

        <!-- Pestañas: Iniciar sesión / Crear cuenta -->
        <div class="sv-acct-seg" role="tablist" aria-label="Acceso a tu cuenta">
            <button type="button" role="tab" id="tab-btn-login" aria-controls="panel-auth-login"
                    class="sv-acct-seg__btn" onclick="switchAuthTab('login')"
                    th:attr="aria-selected=${activeTab != 'register'}">
                Iniciar sesión
            </button>
            <button type="button" role="tab" id="tab-btn-register" aria-controls="panel-auth-register"
                    class="sv-acct-seg__btn" onclick="switchAuthTab('register')"
                    th:attr="aria-selected=${activeTab == 'register'}">
                Crear cuenta
            </button>
        </div>

        <!-- FORMULARIO 1: INICIAR SESIÓN -->
        <form id="panel-auth-login" role="tabpanel" aria-labelledby="tab-btn-login"
              th:action="@{/s/{slug}/account/login(slug=${slug})}"
              method="POST" data-no-spa="true" data-sv-loading
              th:hidden="${activeTab == 'register'}"
              class="sv-acct-form">
            <input type="hidden" name="redirect" th:if="${redirectUrl != null}" th:value="${redirectUrl}">

            <div>
                <label class="sv-acct-label" for="login-identifier">Correo electrónico o teléfono <span class="sv-acct-req">*</span></label>
                <input id="login-identifier" type="text" name="identifier" required autocomplete="username"
                       th:value="${lastIdentifier != null ? lastIdentifier : ''}"
                       placeholder="cliente@correo.com o 3001234567"
                       class="sv-acct-input">
            </div>

            <div>
                <div class="sv-acct-between">
                    <label class="sv-acct-label" for="login-password">Contraseña <span class="sv-acct-req">*</span></label>
                    <a th:href="@{/s/{slug}/account/forgot-password(slug=${slug})}" data-no-spa="true"
                       class="sv-acct-link sv-acct-link--sm">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>
                <div class="sv-acct-pwd">
                    <input id="login-password" type="password" name="password" required
                           autocomplete="current-password" placeholder="Ingresa tu contraseña"
                           class="sv-acct-input">
                    <button type="button" class="sv-acct-pwd__toggle" aria-label="Mostrar contraseña" aria-pressed="false" onclick="svAcctTogglePwd(this)">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    </button>
                </div>
            </div>

            <label class="sv-acct-check">
                <input type="checkbox" name="rememberMe" value="true" checked>
                <span>Mantener mi sesión iniciada en este dispositivo</span>
            </label>

            <button type="submit" class="sv-acct-btn sv-acct-btn--primary sv-acct-btn--block font-bold rounded-xl">
                Ingresar a mi cuenta
            </button>
        </form>

        <!-- FORMULARIO 2: CREAR CUENTA -->
        <form id="panel-auth-register" role="tabpanel" aria-labelledby="tab-btn-register"
              th:action="@{/s/{slug}/account/register(slug=${slug})}"
              method="POST" data-no-spa="true" data-sv-loading
              th:hidden="${activeTab != 'register'}"
              class="sv-acct-form">
            <input type="hidden" name="redirect" th:if="${redirectUrl != null}" th:value="${redirectUrl}">

            <div class="sv-acct-note">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span>Con tu cuenta verás tus pedidos nuevos, guardarás tu dirección y comprarás más rápido. Te enviaremos un enlace para verificar tu correo.</span>
            </div>

            <div>
                <label class="sv-acct-label" for="reg-name">Nombre completo <span class="sv-acct-req">*</span></label>
                <input id="reg-name" type="text" name="name" required autocomplete="name"
                       th:value="${regName != null ? regName : ''}"
                       placeholder="Nombre y apellidos" class="sv-acct-input">
            </div>

            <div>
                <label class="sv-acct-label" for="reg-email">Correo electrónico <span class="sv-acct-req">*</span></label>
                <input id="reg-email" type="email" name="email" required autocomplete="email" inputmode="email"
                       th:value="${regEmail != null ? regEmail : ''}"
                       placeholder="tu@correo.com" class="sv-acct-input">
            </div>

            <div>
                <label class="sv-acct-label" for="reg-phone">Teléfono / WhatsApp <span class="sv-acct-req">*</span></label>
                <input id="reg-phone" type="tel" name="phone" required autocomplete="tel" inputmode="tel"
                       th:value="${regPhone != null ? regPhone : ''}"
                       placeholder="Ej: 3001234567" class="sv-acct-input">
            </div>

            <div class="sv-acct-grid sv-acct-grid--2">
                <div>
                    <label class="sv-acct-label" for="reg-password">Contraseña <span class="sv-acct-req">*</span></label>
                    <div class="sv-acct-pwd">
                        <input id="reg-password" type="password" name="password" required data-pw-new
                               autocomplete="new-password" placeholder="Crea tu contraseña" class="sv-acct-input">
                        <button type="button" class="sv-acct-pwd__toggle" aria-label="Mostrar contraseña" aria-pressed="false" onclick="svAcctTogglePwd(this)">
                            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="sv-acct-label" for="reg-confirm">Confirmar <span class="sv-acct-req">*</span></label>
                    <div class="sv-acct-pwd">
                        <input id="reg-confirm" type="password" name="confirmPassword" required data-pw-confirm
                               autocomplete="new-password" placeholder="Repite tu clave" class="sv-acct-input">
                        <button type="button" class="sv-acct-pwd__toggle" aria-label="Mostrar contraseña" aria-pressed="false" onclick="svAcctTogglePwd(this)">
                            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <th:block th:replace="~{storefront/account/fragments :: pw-rules}"></th:block>
            <th:block th:replace="~{storefront/account/fragments :: pw-match}"></th:block>

            <input type="hidden" name="rememberMe" value="true">

            <button type="submit" class="sv-acct-btn sv-acct-btn--primary sv-acct-btn--block font-bold rounded-xl">
                Crear mi cuenta
            </button>
        </form>

        <div class="sv-acct-auth__foot">
            <a th:href="@{/s/{slug}/catalog(slug=${slug})}" class="sv-acct-link">← Seguir comprando en la tienda</a>
        </div>
    </div>
</div>
<th:block layout:fragment="scripts">
    <th:block th:replace="~{storefront/account/fragments :: account-js}"></th:block>
    <script>
        function switchAuthTab(tab) {
            var loginForm = document.getElementById('panel-auth-login');
            var regForm = document.getElementById('panel-auth-register');
            var loginBtn = document.getElementById('tab-btn-login');
            var regBtn = document.getElementById('tab-btn-register');
            if (!loginForm || !regForm) return;
            var isReg = tab === 'register';
            loginForm.hidden = isReg;
            regForm.hidden = !isReg;
            if (loginBtn) loginBtn.setAttribute('aria-selected', isReg ? 'false' : 'true');
            if (regBtn) regBtn.setAttribute('aria-selected', isReg ? 'true' : 'false');
        }
    </script>
</th:block>
</body>
</html>
