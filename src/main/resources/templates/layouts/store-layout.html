            const statusBadgeHtml = p.isMadeToOrder
                ? `<span class="sv-card__status-badge bg-amber-500 text-white text-[10px] font-black uppercase tracking-wider px-2.5 py-1 rounded-full shadow-sm">Bajo pedido</span>`
                : (p.outOfStock ? `<span class="sv-card__status-badge bg-slate-900/85 text-white text-[10px] font-black uppercase tracking-wider px-2.5 py-1 rounded-full shadow-sm">Agotado</span>` : '');

            const actionHtml = p.outOfStock
                ? `<button type="button" disabled class="sv-card__cta-btn w-full py-2.5 px-4 rounded-xl text-xs font-bold bg-slate-200 text-slate-400 cursor-not-allowed">Agotado</button>`
                : (p.hasVariants
                    ? `<a href="${detailUrl}" class="sv-card__cta-btn block w-full text-center py-2.5 px-4 rounded-xl text-xs font-bold bg-brand text-white hover-bg-brand transition">Ver opciones</a>`
                    : `<button type="button" data-slug="${escHtml(storeSlug)}" data-id="${p.id}" onclick="buyNowFast(this.getAttribute('data-slug'), this.getAttribute('data-id'))" class="sv-card__cta-btn w-full py-2.5 px-4 rounded-xl text-xs font-bold bg-brand text-white hover-bg-brand transition">Comprar ahora</button>`);

            return `
                <article class="product-card catalog-product-card sv-card group bg-white text-slate-900 flex flex-col overflow-hidden relative"
                         data-product-id="${p.id}"
                         data-name="${escHtml(p.name.toLowerCase())}"
                         data-brand="${escHtml((p.brand || '').toLowerCase())}"
                         data-category-id="${p.categoryId || ''}"
                         data-price="${p.effectivePrice || 0}"
                         data-has-discount="${Boolean(p.hasDiscount)}"
                         data-in-stock="${!p.outOfStock}"
                         data-original-index="${index}">
                    <div class="sv-card__media relative overflow-hidden bg-slate-100">
                        <a href="${detailUrl}" class="sv-card__track block w-full h-full">
                            ${slidesHtml}
                        </a>
                        ${arrowsHtml}
                        <div class="sv-card__badges absolute top-2.5 left-2.5 z-10 flex flex-col gap-1 pointer-events-none">
                            ${discountBadgesHtml}
                            ${statusBadgeHtml}
                        </div>
                        <button type="button"
                                data-slug="${escHtml(storeSlug)}"
                                data-id="${p.id}"
                                onclick="toggleWishlistItem(this, this.getAttribute('data-slug'), this.getAttribute('data-id'))"
                                class="sv-card__wishlist absolute top-2.5 right-2.5 z-10 w-8 h-8 rounded-full bg-white/90 backdrop-blur-sm shadow-sm flex items-center justify-center text-slate-600 hover:text-red-500 transition"
                                aria-label="Favoritos">
                            <svg class="w-4 h-4 icon-heart-empty ${p.inWishlist ? 'hidden' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                            <svg class="w-4 h-4 icon-heart-filled ${p.inWishlist ? 'text-red-500' : 'hidden'}" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L12 8.343l3.172-3.171a4 4 0 115.656 5.656L12 21.414l-8.828-8.828a4 4 0 010-5.656z" clip-rule="evenodd"></path></svg>
                        </button>
                    </div>
                    <div class="sv-card__body p-3.5 sm:p-4 flex flex-col flex-1 justify-between gap-2.5">
                        <div>
                            <div class="sv-card__meta text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 flex items-center gap-1.5 truncate">
                                <span class="sv-meta-cat">${escHtml(p.categoryName || 'Catálogo')}</span>
                                ${p.brand ? `<span class="sv-meta-sep">·</span><span class="sv-meta-brand">${escHtml(p.brand)}</span>` : ''}
                            </div>
                            <a href="${detailUrl}">
                                <h3 class="sv-card__title font-bold text-slate-900 text-sm leading-snug line-clamp-2 hover:text-brand transition-colors">${escHtml(p.name)}</h3>
                            </a>
                        </div>
                        <div class="space-y-2.5 mt-auto pt-1">
                            <div class="sv-card__prices flex items-baseline gap-2 flex-wrap">
                                ${p.hasVariants ? `<span class="text-[10px] font-bold uppercase text-slate-400">Desde</span>` : ''}
                                <span class="sv-card__price font-black text-slate-900 text-base sm:text-lg">${formatCOP(p.effectivePrice)}</span>
                                ${p.hasDiscount ? `<span class="sv-card__old-price text-xs text-slate-400 line-through">${formatCOP(p.price)}</span>` : ''}
                            </div>
                            <div class="sv-card__actions">
                                ${actionHtml}
                            </div>
                        </div>
                    </div>
                </article>
            `;
        }

        const StorevoPagination = {
            observers: new Map(),
            inFlightControllers: new Map(),
            loadedRequestKeys: new Map(),
            lastConfiguredSize: null,

            getConfig: function() {
                const ds = document.body.dataset;
                return {
                    mode: ds.svPagMode || 'numbered',
                    pageSize: Math.max(4, Math.min(parseInt(ds.svPagSize || '12', 10) || 12, 48)),
                    shape: ds.svPagShape || 'rounded',
                    btnSize: ds.svPagBtnSize || 'md',
                    align: ds.svPagAlign || 'center',
                    spacing: ds.svPagSpacing || 'md',
                    borderWidth: ds.svPagBorderW || '1px',
                    showCounter: ds.svPagCounter !== 'false',
                    showPrevNext: ds.svPagPrevNext !== 'false'
                };
            },

            initAll: function() {
                this.cleanupObservers();
                const cfg = this.getConfig();
                this.lastConfiguredSize = cfg.pageSize;

                document.querySelectorAll('.sv-pagination-host').forEach(host => {
                    this.loadedRequestKeys.set(host, new Set());
                    this.renderHost(host);
                    this.bindToolbarEventsForHost(host);
                });
            },

            cleanupObservers: function() {
                this.observers.forEach(obs => {
                    try { obs.disconnect(); } catch (e) {}
                });
                this.observers.clear();
            },

            bindToolbarEventsForHost: function(host) {
                if (host.dataset.toolbarBound === 'true') return;
                host.dataset.toolbarBound = 'true';

                const scope = host.getAttribute('data-pagination-scope');
                const sectionEl = host.closest('.storevo-theme-section') || document;
                const searchInput = scope === 'catalog'
                    ? document.getElementById('catalog-search-input')
                    : sectionEl.querySelector('.sv-search-input');
                const sortSelect = scope === 'catalog'
                    ? document.getElementById('catalog-sort-select')
                    : sectionEl.querySelector('.sv-sort-select');

                let debounceTimer = null;
                if (searchInput) {
                    searchInput.addEventListener('input', () => {
                        clearTimeout(debounceTimer);
                        debounceTimer = setTimeout(() => {
                            host.setAttribute('data-q', searchInput.value.trim());
                            host.setAttribute('data-next-cursor', '');
                            this.loadedRequestKeys.set(host, new Set());
                            this.loadPage(host, 1, false, true);
                        }, 320);
                    });
                }
                if (sortSelect) {
                    sortSelect.addEventListener('change', () => {
                        host.setAttribute('data-sort', sortSelect.value || 'default');
                        host.setAttribute('data-next-cursor', '');
                        this.loadedRequestKeys.set(host, new Set());
                        this.loadPage(host, 1, false, true);
                    });
                }
            },

            getHostState: function(host) {
                const cfg = this.getConfig();
                const gridId = host.getAttribute('data-target-grid');
                const gridEl = gridId ? document.getElementById(gridId) : null;
                const domCardsCount = gridEl ? gridEl.querySelectorAll('.product-card').length : 0;

                const currentPage = Math.max(1, parseInt(host.getAttribute('data-current-page') || '1', 10));
                const pageSize = Math.max(4, parseInt(host.getAttribute('data-page-size') || String(cfg.pageSize), 10));
                const totalItems = Math.max(domCardsCount, parseInt(host.getAttribute('data-total-items') || String(domCardsCount), 10));
                const totalPages = Math.max(1, parseInt(host.getAttribute('data-total-pages') || String(Math.ceil(totalItems / pageSize) || 1), 10));
                const hasNext = host.getAttribute('data-has-next') === 'true' || currentPage < totalPages;
                const nextCursor = host.getAttribute('data-next-cursor') || '';

                return {
                    cfg,
                    gridEl,
                    domCardsCount,
                    currentPage,
                    pageSize,
                    totalItems,
                    totalPages,
                    hasNext,
                    nextCursor
                };
            },

            buildPageNumbers: function(current, total) {
                if (total <= 7) {
                    return Array.from({ length: total }, (_, i) => i + 1);
                }
                const pages = [1];
                if (current > 3) pages.push('...');
                const start = Math.max(2, current - 1);
                const end = Math.min(total - 1, current + 1);
                for (let i = start; i <= end; i++) pages.push(i);
                if (current < total - 2) pages.push('...');
                pages.push(total);
                return pages;
            },

            renderHost: function(host) {
                if (!host) return;
                const prevObs = this.observers.get(host);
                if (prevObs) {
                    try { prevObs.disconnect(); } catch (e) {}
                    this.observers.delete(host);
                }

                const st = this.getHostState(host);
                const { cfg, domCardsCount, currentPage, pageSize, totalItems, totalPages, hasNext } = st;

                // En tienda pública, si todo cabe en una sola página y no hay más páginas, ocultar controles innecesarios
                if (!isPreviewDraft && totalPages <= 1 && !hasNext && totalItems <= pageSize) {
                    if (cfg.showCounter && totalItems > 0) {
                        host.innerHTML = `<div class="sv-pag-wrap"><span class="sv-pag-counter">Mostrando ${totalItems} de ${totalItems} producto${totalItems === 1 ? '' : 's'}</span></div>`;
                    } else {
                        host.innerHTML = '';
                    }
                    return;
                }

                // En la vista previa del editor visual, si el catálogo tiene pocos productos (totalPages == 1),
                // mostramos al menos 3 páginas de demostración visual para que el comerciante vea el estilo de página activa e inactiva en vivo.
                const displayTotalPages = (isPreviewDraft && totalPages <= 1) ? 3 : totalPages;
                const displayTotalItems = (isPreviewDraft && totalItems <= pageSize) ? Math.max(totalItems, pageSize * 2) : totalItems;
                const displayHasNext = (isPreviewDraft && totalPages <= 1) ? (currentPage < displayTotalPages) : hasNext;

                const startItem = totalItems === 0 ? 0 : ((currentPage - 1) * pageSize) + 1;
                const endItem = (cfg.mode === 'load_more' || cfg.mode === 'infinite' || cfg.mode === 'counter_more')
                    ? Math.min(domCardsCount || pageSize, displayTotalItems)
                    : Math.min(currentPage * pageSize, displayTotalItems);

                const counterHtml = cfg.showCounter
                    ? `<span class="sv-pag-counter" aria-live="polite">Mostrando <strong>${startItem}–${endItem}</strong> de <strong>${displayTotalItems}</strong> productos</span>`
                    : '';

                if (cfg.mode === 'numbered') {
                    const pages = this.buildPageNumbers(currentPage, displayTotalPages);
                    const prevBtn = cfg.showPrevNext
                        ? `<button type="button" class="sv-pag-btn" data-pag-action="page" data-page="${currentPage - 1}" ${currentPage <= 1 ? 'disabled' : ''} aria-label="Página anterior">‹ <span class="hidden sm:inline">Anterior</span></button>`
                        : '';
                    const nextBtn = cfg.showPrevNext
                        ? `<button type="button" class="sv-pag-btn" data-pag-action="page" data-page="${currentPage + 1}" ${!displayHasNext && currentPage >= displayTotalPages ? 'disabled' : ''} aria-label="Página siguiente"><span class="hidden sm:inline">Siguiente</span> ›</button>`
                        : '';
                    const numsHtml = pages.map(p => {
                        if (p === '...') return `<span class="px-2 text-xs font-bold opacity-50 select-none">…</span>`;
                        const isActive = p === currentPage;
                        return `<button type="button" class="sv-pag-btn ${isActive ? 'is-active' : ''}" data-pag-action="page" data-page="${p}" ${isActive ? 'aria-current="page"' : ''}>${p}</button>`;
                    }).join('');

                    host.innerHTML = `
                        <nav class="sv-pag-wrap" aria-label="Paginación de productos">
                            ${counterHtml}
                            <div class="sv-pag-controls">
                                ${prevBtn}
                                ${numsHtml}
                                ${nextBtn}
                            </div>
                        </nav>
                    `;
                } else if (cfg.mode === 'compact') {
                    const prevBtn = cfg.showPrevNext
                        ? `<button type="button" class="sv-pag-btn" data-pag-action="page" data-page="${currentPage - 1}" ${currentPage <= 1 ? 'disabled' : ''} aria-label="Página anterior">‹ Anterior</button>`
                        : '';
                    const nextBtn = cfg.showPrevNext
                        ? `<button type="button" class="sv-pag-btn" data-pag-action="page" data-page="${currentPage + 1}" ${!displayHasNext && currentPage >= displayTotalPages ? 'disabled' : ''} aria-label="Página siguiente">Siguiente ›</button>`
                        : '';

                    host.innerHTML = `
                        <nav class="sv-pag-wrap" aria-label="Paginación compacta">
                            ${counterHtml}
                            <div class="sv-pag-controls">
                                ${prevBtn}
                                <span class="sv-pag-btn is-active pointer-events-none">Página ${currentPage} de ${displayTotalPages}</span>
                                ${nextBtn}
                            </div>
                        </nav>
                    `;
                } else if (cfg.mode === 'arrows') {
                    host.innerHTML = `
                        <nav class="sv-pag-wrap" aria-label="Navegación por flechas">
                            ${counterHtml}
                            <div class="sv-pag-controls">
                                <button type="button" class="sv-pag-btn" data-pag-action="page" data-page="${currentPage - 1}" ${currentPage <= 1 ? 'disabled' : ''} aria-label="Anterior">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 19l-7-7 7-7"></path></svg>
                                    <span>Anterior</span>
                                </button>
                                <button type="button" class="sv-pag-btn is-active" data-pag-action="page" data-page="${currentPage + 1}" ${!displayHasNext && currentPage >= displayTotalPages ? 'disabled' : ''} aria-label="Siguiente">
                                    <span>Siguiente</span>
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M9 5l7 7-7 7"></path></svg>
                                </button>
                            </div>
                        </nav>
                    `;
                } else if (cfg.mode === 'load_more') {
                    host.innerHTML = `
                        <div class="sv-pag-wrap flex-col">
                            ${counterHtml}
                            ${displayHasNext
                        ? `<button type="button" class="sv-pag-btn sv-pag-btn--cta" data-pag-action="append" data-page="${currentPage + 1}">
                                       <span>Cargar más productos</span>
                                   </button>`
                        : `<span class="text-xs font-semibold opacity-60">Has visto todos los productos disponibles</span>`}
                        </div>
                    `;
                } else if (cfg.mode === 'counter_more') {
                    const pct = Math.min(100, Math.round((endItem / Math.max(1, displayTotalItems)) * 100));
                    host.innerHTML = `
                        <div class="sv-pag-wrap flex-col">
                            <span class="sv-pag-counter" aria-live="polite">Has visto <strong>${endItem}</strong> de <strong>${displayTotalItems}</strong> productos</span>
                            <div class="sv-pag-progress-track">
                                <div class="sv-pag-progress-bar" style="width: ${pct}%;"></div>
                            </div>
                            ${displayHasNext
                        ? `<button type="button" class="sv-pag-btn sv-pag-btn--cta mt-1" data-pag-action="append" data-page="${currentPage + 1}">
                                       <span>Mostrar más productos</span>
                                   </button>`
                        : `<span class="text-xs font-semibold opacity-60">Catálogo completo</span>`}
                        </div>
                    `;
                } else if (cfg.mode === 'infinite') {
                    host.innerHTML = `
                        <div class="sv-pag-wrap flex-col">
                            ${counterHtml}
                            ${displayHasNext
                        ? `<div class="sv-infinite-sentinel py-3 flex items-center justify-center gap-2 text-xs font-bold opacity-75">
                                       <span class="w-4 h-4 rounded-full border-2 border-current border-t-transparent animate-spin" style="color: var(--sv-pag-active-bg, var(--brand-color));"></span>
                                       <span>Cargando más productos al desplazar...</span>
                                   </div>`
                        : `<span class="text-xs font-semibold opacity-60">Fin del catálogo</span>`}
                        </div>
                    `;

                    const sentinel = host.querySelector('.sv-infinite-sentinel');
                    if (sentinel && displayHasNext && (!isPreviewDraft || totalPages > 1)) {
                        const obs = new IntersectionObserver((entries) => {
                            entries.forEach(entry => {
                                if (entry.isIntersecting) {
                                    this.loadPage(host, currentPage + 1, true, false);
                                }
                            });
                        }, { rootMargin: '220px' });
                        obs.observe(sentinel);
                        this.observers.set(host, obs);
                    }
                }

                host.querySelectorAll('[data-pag-action]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        const targetPage = parseInt(btn.getAttribute('data-page') || '1', 10);
                        const action = btn.getAttribute('data-pag-action');
                        if (isPreviewDraft && totalPages <= 1) {
                            host.setAttribute('data-current-page', String(Math.max(1, Math.min(targetPage, displayTotalPages))));
                            this.renderHost(host);
                            return;
                        }
                        this.loadPage(host, targetPage, action === 'append', true);
                    });
                });
            },

            loadPage: function(host, targetPage, append, updateHistory) {
                if (!host || !storeSlug) return;
                if (host.dataset.isLoading === 'true') return;

                const st = this.getHostState(host);
                const cfg = st.cfg;
                const scope = host.getAttribute('data-pagination-scope') || 'catalog';
                const sectionId = host.getAttribute('data-section-id') || '';
                const source = host.getAttribute('data-source') || '';
                const categoryId = host.getAttribute('data-category-id') || new URLSearchParams(window.location.search).get('category') || '';
                const brandId = host.getAttribute('data-brand-id') || '';
                const brandName = host.getAttribute('data-brand-name') || new URLSearchParams(window.location.search).get('brand') || '';

                const sectionEl = host.closest('.storevo-theme-section') || document;
                const searchInput = scope === 'catalog'
                    ? document.getElementById('catalog-search-input')
                    : sectionEl.querySelector('.sv-search-input');
                const sortSelect = scope === 'catalog'
                    ? document.getElementById('catalog-sort-select')
                    : sectionEl.querySelector('.sv-sort-select');

                const qVal = searchInput ? searchInput.value.trim() : (host.getAttribute('data-q') || new URLSearchParams(window.location.search).get('q') || '');
                const sortVal = sortSelect ? sortSelect.value : (host.getAttribute('data-sort') || new URLSearchParams(window.location.search).get('sort') || 'default');

                const params = new URLSearchParams();
                params.set('page', String(Math.max(1, targetPage)));
                params.set('size', String(cfg.pageSize));
                if (scope === 'grid' && sectionId) {
                    params.set('sectionId', sectionId);
                    params.set('pageKey', document.body.getAttribute('data-editor-page-key') || 'home');
                }
                if (source) params.set('source', source);
                if (categoryId) params.set('category', categoryId);
                if (brandId) params.set('brandId', brandId);
                if (brandName) params.set('brand', brandName);
                if (qVal) params.set('q', qVal);
                if (sortVal && sortVal !== 'default') params.set('sort', sortVal);
                if (isPreviewDraft) params.set('preview', 'draft');

                // Paginación por cursor para carga progresiva cuando el orden es por defecto (más recientes)
                if (append && (!sortVal || sortVal === 'default') && st.nextCursor && source !== 'MANUAL') {
                    params.set('cursor', st.nextCursor);
                }

                const requestSignature = params.toString();
                const loadedSet = this.loadedRequestKeys.get(host) || new Set();
                if (append && loadedSet.has(requestSignature)) {
                    return; // Evita solicitudes repetidas en Cargar más e Infinite Scroll
                }

                host.dataset.isLoading = 'true';
                const activeBtn = host.querySelector('[data-pag-action="append"]');
                if (activeBtn) {
                    activeBtn.disabled = true;
                    activeBtn.innerHTML = `<span>Cargando...</span>`;
                }

                const prevController = this.inFlightControllers.get(host);
                if (prevController && !append) {
                    try { prevController.abort(); } catch (e) {}
                }
                const controller = new AbortController();
                this.inFlightControllers.set(host, controller);

                fetch(`/s/${storeSlug}/api/catalog-page?${params.toString()}`, {
                    headers: { 'Accept': 'application/json' },
                    signal: controller.signal
                })
                    .then(r => {
                        if (!r.ok) throw new Error('Error al cargar página');
                        return r.json();
                    })
                    .then(data => {
                        if (!data || !Array.isArray(data.items)) return;
                        loadedSet.add(requestSignature);
                        this.loadedRequestKeys.set(host, loadedSet);

                        const gridEl = st.gridEl;
                        if (gridEl) {
                            const existingIds = new Set(
                                append
                                    ? Array.from(gridEl.querySelectorAll('.product-card[data-product-id]')).map(el => Number(el.getAttribute('data-product-id')))
                                    : []
                            );
                            const newCardsHtml = data.items
                                .filter(item => !append || !existingIds.has(Number(item.id)))
                                .map((item, idx) => buildCardHtml(item, scope, idx))
                                .join('');

                            if (append) {
                                gridEl.insertAdjacentHTML('beforeend', newCardsHtml);
                            } else {
                                gridEl.innerHTML = newCardsHtml;
                                const scrollTarget = host.closest('.storevo-theme-section') || gridEl;
                                if (scrollTarget && updateHistory) {
                                    scrollTarget.scrollIntoView({ behavior: 'smooth', block: 'start' });
                                }
                            }
                        }

                        host.setAttribute('data-current-page', String(data.page || targetPage));
                        host.setAttribute('data-page-size', String(data.size || cfg.pageSize));
                        host.setAttribute('data-total-items', String(data.totalElements != null ? data.totalElements : 0));
                        host.setAttribute('data-total-pages', String(data.totalPages || 1));
                        host.setAttribute('data-has-next', String(Boolean(data.hasNext)));
                        host.setAttribute('data-next-cursor', data.nextCursor ? String(data.nextCursor) : '');

                        const visibleCounter = (scope === 'catalog')
                            ? document.getElementById('catalog-visible-count')
                            : (host.closest('.storevo-theme-section')?.querySelector('.sv-visible-count'));
                        if (visibleCounter && data.totalElements != null) {
                            visibleCounter.textContent = String(data.totalElements);
                        }

                        if (scope === 'catalog' && updateHistory && !append) {
                            const url = new URL(window.location.href);
                            if (targetPage > 1) url.searchParams.set('page', String(targetPage));
                            else url.searchParams.delete('page');
                            if (qVal) url.searchParams.set('q', qVal);
                            else url.searchParams.delete('q');
                            if (sortVal && sortVal !== 'default') url.searchParams.set('sort', sortVal);
                            else url.searchParams.delete('sort');
                            window.history.pushState({ storevoPagination: true, page: targetPage }, '', url.pathname + url.search);
                        }
                    })
                    .catch(err => {
                        if (err && err.name === 'AbortError') return;
                        console.error('[StorevoPagination] Error cargando productos:', err);
                    })
                    .finally(() => {
                        host.dataset.isLoading = 'false';
                        this.renderHost(host);
                    });
            }
        };

        window.StorevoPagination = StorevoPagination;

        document.addEventListener('DOMContentLoaded', () => StorevoPagination.initAll());
        document.addEventListener('storevo:page-load', () => StorevoPagination.initAll());

        window.addEventListener('popstate', () => {
            const catHost = document.getElementById('catalog-pagination-host');
            if (!catHost) return;
            const urlParams = new URLSearchParams(window.location.search);
            const p = parseInt(urlParams.get('page') || '1', 10) || 1;
            StorevoPagination.loadPage(catHost, p, false, false);
        });

        document.addEventListener('storevo:pagination-config-updated', (e) => {
            const cfg = StorevoPagination.getConfig();
            const sizeChanged = StorevoPagination.lastConfiguredSize !== null && StorevoPagination.lastConfiguredSize !== cfg.pageSize;
            StorevoPagination.lastConfiguredSize = cfg.pageSize;

            document.querySelectorAll('.sv-pagination-host').forEach(host => {
                host.setAttribute('data-page-size', String(cfg.pageSize));
                if (sizeChanged) {
                    StorevoPagination.loadedRequestKeys.set(host, new Set());
                    host.setAttribute('data-next-cursor', '');
                    StorevoPagination.loadPage(host, 1, false, false);
                } else {
                    StorevoPagination.renderHost(host);
                }
            });
        });
    })();
</script>
<div id="storevo-page-scripts">
    <th:block layout:fragment="scripts"></th:block>
</div>
</body>
</html>
