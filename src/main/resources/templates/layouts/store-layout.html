                        <h4 class="sv-mega-spot-title text-lg font-black text-white leading-tight">${esc(firstWithImg ? firstWithImg.name : 'Todo el Catálogo')}</h4>
                        <p class="sv-mega-spot-desc text-xs text-white/80 mt-1 line-clamp-2">${esc(firstWithImg && firstWithImg.desc ? firstWithImg.desc : 'Descubre nuestras referencias disponibles')}</p>
                        <span class="inline-flex items-center gap-1 text-xs font-bold text-white mt-3 underline">Explorar ahora →</span>
                    </div>
                </a>
            `;

            const spotEl = panelEl.querySelector('.sv-mega-spotlight');
            const spotImg = panelEl.querySelector('.sv-mega-spot-img');
            const spotTitle = panelEl.querySelector('.sv-mega-spot-title');
            const spotDesc = panelEl.querySelector('.sv-mega-spot-desc');

            panelEl.querySelectorAll('.sv-mega-cat-group').forEach(grp => {
                grp.addEventListener('mouseenter', () => {
                    const cName = grp.getAttribute('data-cat-name');
                    const cDesc = grp.getAttribute('data-cat-desc');
                    const cImg = grp.getAttribute('data-cat-img');
                    const cUrl = grp.getAttribute('data-cat-url');
                    if (spotEl && cUrl) spotEl.setAttribute('href', cUrl);
                    if (spotTitle && cName) spotTitle.textContent = cName;
                    if (spotDesc && cDesc) spotDesc.textContent = cDesc;
                    if (spotImg) {
                        if (cImg) {
                            spotImg.src = cImg;
                            spotImg.classList.remove('hidden');
                        } else {
                            spotImg.classList.add('hidden');
                        }
                    }
                });
            });
        }

        // 7. Reutilizar estructura SSR de "Todo el Catálogo" sin re-envolver ni duplicar íconos
        const desktopCatalogLink = navLinks.find(a => {
            const href = a.getAttribute('href') || '';
            return href.includes('/catalog') && !href.includes('category=') && !a.closest('.sv-nav-double-strip');
        });

        let menuWrap = null;
        let dropdownPanel = null;

        if (desktopCatalogLink && rootCats.length > 0) {
            const existingWrap = desktopCatalogLink.closest('.sv-catalog-menu-trigger-wrap');
            if (existingWrap) {
                menuWrap = existingWrap;
                dropdownPanel = existingWrap.querySelector(':scope > .sv-dropdown-panel');
                if (!dropdownPanel) {
                    dropdownPanel = document.createElement('div');
                    dropdownPanel.className = 'sv-dropdown-panel is-mega';
                    existingWrap.appendChild(dropdownPanel);
                }
                menuWrap._customPanel = dropdownPanel;
            } else {
                menuWrap = document.createElement('div');
                menuWrap.className = 'nav-parent sv-catalog-menu-trigger-wrap';
                desktopCatalogLink.parentNode.insertBefore(menuWrap, desktopCatalogLink);
                menuWrap.appendChild(desktopCatalogLink);

                if (!desktopCatalogLink.querySelector('.sv-catalog-chevron')) {
                    const chevronSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    chevronSvg.setAttribute('class', 'nav-arrow sv-catalog-chevron w-4 h-4 transition-transform duration-300');
                    chevronSvg.setAttribute('fill', 'none');
                    chevronSvg.setAttribute('stroke', 'currentColor');
                    chevronSvg.setAttribute('viewBox', '0 0 24 24');
                    chevronSvg.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>`;
                    desktopCatalogLink.appendChild(chevronSvg);
                }

                dropdownPanel = document.createElement('div');
                dropdownPanel.className = 'sv-dropdown-panel is-mega';
                menuWrap._customPanel = dropdownPanel;
                menuWrap.appendChild(dropdownPanel);
            }
        }

        domNavParents.forEach(parentEl => {
            const catId = parentEl.getAttribute('data-cat-id');
            const catObj = catMap.get(catId);
            if (!catObj || !catObj.children || catObj.children.length === 0) return;

            let customPanel = parentEl._customPanel || parentEl.querySelector(':scope > .sv-cat-custom-panel');
            if (!customPanel) {
                customPanel = document.createElement('div');
                customPanel.className = 'sv-dropdown-panel sv-cat-custom-panel';
                customPanel.dataset.isCatPanel = 'true';
                parentEl._customPanel = customPanel;
                parentEl.appendChild(customPanel);
            }
        });

        // Asegurar que el logo o nombre de la tienda siempre lleve al Inicio de la tienda
        const logoLink = navRoot.querySelector('a.sv-nav__logo');
        if (logoLink) {
            logoLink.setAttribute('href', `/s/${slug}${previewSuffix}`);
            logoLink.setAttribute('title', 'Ir al Inicio');
        }

        // Construir Panel Lateral Doble Interactivo por Clic (dual_drawer) solo con datos reales de la tienda
        const customPagesFooterHtml = customPages.length > 0
            ? `<div class="sv-dual-footer">
                   ${customPages.map(cp => `<a href="${esc(cp.href)}" class="sv-dual-item"><span>${esc(cp.title)}</span></a>`).join('')}
               </div>`
            : '';

        const dualBackdrop = document.createElement('div');
        dualBackdrop.className = 'sv-dual-drawer-backdrop';
        dualBackdrop.innerHTML = `
            <div class="sv-dual-drawer" role="dialog" aria-label="Menú de categoría">
                <div class="sv-dual-col1">
                    <div class="sv-dual-col1-top space-y-0.5"></div>
                    ${customPagesFooterHtml}
                </div>
                <div class="sv-dual-col2"></div>
            </div>
        `;
        document.body.appendChild(dualBackdrop);

        const dualCol1Top = dualBackdrop.querySelector('.sv-dual-col1-top');
        const dualCol2 = dualBackdrop.querySelector('.sv-dual-col2');
        let activeDualRootId = null;
        let activeDualSubName = '';

        function updateDualDrawerTopOffset() {
            const rect = navRoot.getBoundingClientRect();
            const bottomPx = Math.max(0, Math.round(rect.bottom));
            dualBackdrop.style.setProperty('--sv-dual-top', bottomPx + 'px');
        }

        function closeDualDrawer() {
            activeDualRootId = null;
            dualBackdrop.classList.remove('is-open');
            domNavParents.forEach(p => p.classList.remove('is-dual-active'));
            if (menuWrap) menuWrap.classList.remove('is-dual-active');
        }

        dualBackdrop.addEventListener('click', (e) => {
            if (e.target === dualBackdrop) closeDualDrawer();
        });

        function renderDualCol2ForSub(subCat) {
            if (!subCat || !subCat.children || subCat.children.length === 0) {
                dualCol2.classList.remove('is-visible');
                dualCol2.innerHTML = '';
                return;
            }
            dualCol2.classList.add('is-visible');
            dualCol2.innerHTML = `
                <a href="${esc(subCat.url)}" class="sv-dual-subitem sv-dual-subitem--all">Ver todo ${esc(subCat.name)}</a>
                ${subCat.children.map(l3 => `<a href="${esc(l3.url)}" class="sv-dual-subitem">${esc(l3.name)}</a>`).join('')}
            `;
        }

        function openDualDrawerForRoot(rootCatObj, parentDomEl) {
            if (!rootCatObj) return;
            updateDualDrawerTopOffset();
            activeDualRootId = String(rootCatObj.id);

            domNavParents.forEach(p => p.classList.toggle('is-dual-active', p === parentDomEl));
            if (menuWrap) menuWrap.classList.toggle('is-dual-active', parentDomEl === menuWrap);

            const subItems = (rootCatObj.children && rootCatObj.children.length > 0) ? rootCatObj.children : [];
            const rootUrl = rootCatObj.url || `/s/${slug}/catalog${previewSuffix}`;

            // Si al cambiar de Mujer a Hombre existe una subcategoría con el mismo nombre (ej. Jeans o Camisas), mantenerla abierta
            let matchedSub = null;
            if (activeDualSubName && subItems.length > 0) {
                matchedSub = subItems.find(s => s.name.trim().toLowerCase() === activeDualSubName.trim().toLowerCase()) || null;
            }
            // Si no había ninguna seleccionada aún y la primera subcategoría tiene Nivel 3, preseleccionar la primera para mostrar su árbol
            if (!matchedSub && subItems.length > 0 && subItems[0].children && subItems[0].children.length > 0) {
                matchedSub = subItems[0];
                activeDualSubName = matchedSub.name || '';
            }

            const verTodoRootHtml = `
                <a href="${esc(rootUrl)}" class="sv-dual-item font-bold border-b border-slate-100 pb-2 mb-1">
                    <span>Ver todo ${esc(rootCatObj.name)}</span>
                </a>
            `;

            const subsHtml = subItems.map(sub => {
                const hasL3 = sub.children && sub.children.length > 0;
                const isSel = matchedSub && String(matchedSub.id) === String(sub.id);
                if (hasL3) {
                    return `
                        <button type="button" data-dual-sub-id="${esc(sub.id)}" data-dual-sub-name="${esc(sub.name)}"
                                class="sv-dual-item ${isSel ? 'is-selected' : ''}">
                            <span>${esc(sub.name)}</span>
                            <span class="text-xs opacity-60">›</span>
                        </button>
                    `;
                }
                return `
                    <a href="${esc(sub.url)}" data-dual-sub-name="${esc(sub.name)}" class="sv-dual-item ${isSel ? 'is-selected' : ''}">
                        <span>${esc(sub.name)}</span>
                    </a>
                `;
            }).join('');

            dualCol1Top.innerHTML = verTodoRootHtml + subsHtml;

            if (matchedSub && matchedSub.children && matchedSub.children.length > 0) {
                renderDualCol2ForSub(matchedSub);
            } else {
                dualCol2.classList.remove('is-visible');
                dualCol2.innerHTML = '';
            }

            dualCol1Top.querySelectorAll('button[data-dual-sub-id]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const subId = btn.getAttribute('data-dual-sub-id');
                    const subObj = subItems.find(s => String(s.id) === String(subId));
                    if (!subObj) return;
                    activeDualSubName = subObj.name || '';
                    dualCol1Top.querySelectorAll('.sv-dual-item').forEach(el => el.classList.toggle('is-selected', el === btn));
                    renderDualCol2ForSub(subObj);
                });
            });

            dualBackdrop.classList.add('is-open');
        }

        function renderDropdownContent(styleMode) {
            const effectiveStyle = styleMode || 'mega';
            if (effectiveStyle !== 'dual_drawer') {
                closeDualDrawer();
            }
            if (dropdownPanel && menuWrap) {
                if (effectiveStyle === 'none' || effectiveStyle === 'drawer' || effectiveStyle === 'dual_drawer') {
                    dropdownPanel.innerHTML = '';
                    menuWrap.classList.remove('sv-catalog-menu-open', 'is-open');
                } else {
                    buildPanelMarkup(dropdownPanel, rootCats, effectiveStyle, rootCats[0]);
                }
            }
            domNavParents.forEach(parentEl => {
                const catId = parentEl.getAttribute('data-cat-id');
                const catObj = catMap.get(catId);
                const customPanel = parentEl._customPanel || parentEl.querySelector(':scope > .sv-cat-custom-panel');
                if (!catObj || !catObj.children || catObj.children.length === 0 || !customPanel) return;
                if (effectiveStyle === 'none' || effectiveStyle === 'drawer' || effectiveStyle === 'dual_drawer') {
                    customPanel.innerHTML = '';
                    parentEl.classList.remove('is-open');
                    return;
                }
                buildPanelMarkup(customPanel, catObj.children, effectiveStyle, catObj);
            });

            if (window.Storevo && Storevo.UI && Storevo.UI.Navbar) {
                if (typeof Storevo.UI.Navbar.bindFlyoutIntent === 'function') {
                    Storevo.UI.Navbar.bindFlyoutIntent(navRoot);
                }
                if (menuWrap && menuWrap.classList.contains('is-open')) {
                    Storevo.UI.Navbar.placeDropdown(menuWrap);
                }
                domNavParents.forEach(p => {
                    if (p.classList.contains('is-open')) {
                        Storevo.UI.Navbar.placeDropdown(p);
                    }
                });
            }
        }

        const allMenuParents = (menuWrap ? [menuWrap] : []).concat(domNavParents);

        function closeAllCategoryMenus(exceptEl) {
            allMenuParents.forEach(p => {
                if (p !== exceptEl) {
                    p.classList.remove('is-open', 'sv-catalog-menu-open');
                }
            });
        }

        function setParentMenuOpen(parentEl, open) {
            if (!parentEl || !parentEl._customPanel) return;
            if (open) {
                closeAllCategoryMenus(parentEl);
                if (window.Storevo && Storevo.UI && Storevo.UI.Navbar) {
                    Storevo.UI.Navbar.placeDropdown(parentEl);
                }
            }
            parentEl.classList.toggle('is-open', open);
            if (parentEl === menuWrap) {
                parentEl.classList.toggle('sv-catalog-menu-open', open);
            }
        }

        window.addEventListener('resize', () => {
            allMenuParents.forEach(p => {
                if (p.classList.contains('is-open') && window.Storevo && Storevo.UI && Storevo.UI.Navbar) {
                    Storevo.UI.Navbar.placeDropdown(p);
                }
            });
        });

        allMenuParents.forEach(parentEl => {
            let hoverTimer = null;
            const linkEl = parentEl.querySelector(':scope > a.sv-nav__link');
            if (!linkEl) return;

            parentEl.addEventListener('mouseenter', () => {
                const trigger = document.body.getAttribute('data-sv-nav-trigger') || 'hover';
                const dStyle = document.body.getAttribute('data-sv-dropdown-style') || 'mega';
                // En dual_drawer jamás se abre por hover (solo resalta dónde está el mouse)
                if (trigger === 'hover' && dStyle !== 'none' && dStyle !== 'drawer' && dStyle !== 'dual_drawer') {
                    clearTimeout(hoverTimer);
                    if (dStyle === 'full_columns' && parentEl._customPanel) {
                        const rect = navRoot.getBoundingClientRect();
                        parentEl._customPanel.style.top = Math.max(0, Math.round(rect.bottom)) + 'px';
                    }
                    setParentMenuOpen(parentEl, true);
                }
            });

            parentEl.addEventListener('mouseleave', () => {
                const trigger = document.body.getAttribute('data-sv-nav-trigger') || 'hover';
                const dStyle = document.body.getAttribute('data-sv-dropdown-style') || 'mega';
                if (trigger === 'hover' && dStyle !== 'dual_drawer') {
                    hoverTimer = setTimeout(() => {
                        setParentMenuOpen(parentEl, false);
                    }, 150);
                }
            });

            linkEl.addEventListener('click', (e) => {
                const dStyle = document.body.getAttribute('data-sv-dropdown-style') || 'mega';
                const trigger = document.body.getAttribute('data-sv-nav-trigger') || 'hover';
                const isTouch = window.matchMedia && window.matchMedia('(hover: none)').matches;
                const clickedArrow = Boolean(e.target && e.target.closest && e.target.closest('.nav-arrow'));

                if (dStyle === 'none') return;

                if (dStyle === 'dual_drawer') {
                    const catId = parentEl.getAttribute('data-cat-id');
                    const catObj = catId ? catMap.get(catId) : { id: 'catalog', name: 'Catálogo', url: `/s/${slug}/catalog${previewSuffix}`, children: rootCats };
                    if (catObj && catObj.children && catObj.children.length > 0) {
                        e.preventDefault();
                        e.stopPropagation();
                        if (dualBackdrop.classList.contains('is-open') && activeDualRootId === String(catObj.id)) {
                            closeDualDrawer();
                        } else {
                            openDualDrawerForRoot(catObj, parentEl);
                        }
                        return;
                    }
                    return;
                }

                if (dStyle === 'drawer') {
                    e.preventDefault();
                    e.stopPropagation();
                    drawerBackdrop.classList.add('is-open');
                    return;
                }

                if (dStyle === 'full_columns' && parentEl._customPanel) {
                    const rect = navRoot.getBoundingClientRect();
                    parentEl._customPanel.style.top = Math.max(0, Math.round(rect.bottom)) + 'px';
                }
                if (clickedArrow) {
                    e.preventDefault();
                    e.stopPropagation();
                    setParentMenuOpen(parentEl, !parentEl.classList.contains('is-open'));
                    return;
                }
                if (trigger === 'click' || isTouch) {
                    if (!parentEl.classList.contains('is-open')) {
                        e.preventDefault();
                        e.stopPropagation();
                        setParentMenuOpen(parentEl, true);
                    }
                }
            });
        });

        document.addEventListener('click', (e) => {
            allMenuParents.forEach(p => {
                if (!p.contains(e.target)) {
                    setParentMenuOpen(p, false);
                }
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeAllCategoryMenus(null);
                closeNavDrawer();
            }
        });

        // 8. Sincronizar ubicación de la Barra de Anuncio (Encima del menú vs Debajo del menú) y Transparente Hero
        let topAnnHost = document.getElementById('storevoTopAnnouncementHost');
        if (!topAnnHost && navRoot && navRoot.parentNode) {
            topAnnHost = document.createElement('div');
            topAnnHost.id = 'storevoTopAnnouncementHost';
            navRoot.parentNode.insertBefore(topAnnHost, navRoot);
        }

        function syncTopAnnouncementPlacement() {
            const mainEl = document.getElementById('storevoMainContent') || document.querySelector('main');
            if (!mainEl || !topAnnHost) return;

            // Si ya había un anuncio arriba del menú, verificar si el editor refrescó <main> o devolverlo a su orden original antes de evaluar
            const currentHoisted = topAnnHost.querySelector('.storevo-theme-section');
            if (currentHoisted) {
                const hoistedId = currentHoisted.getAttribute('data-section-id');
                const duplicateInMain = hoistedId ? mainEl.querySelector(`.storevo-theme-section[data-section-id="${hoistedId}"]`) : null;
                if (duplicateInMain) {
                    topAnnHost.innerHTML = '';
                } else {
                    mainEl.insertBefore(currentHoisted, mainEl.firstElementChild);
                }
            }

            // Limpiar clases previas
            Array.from(mainEl.querySelectorAll('.storevo-theme-section')).forEach(s => {
                s.classList.remove('sv-ann-below-hero-nav');
            });

            // Revisar únicamente la PRIMERA sección de la página
            const firstSec = mainEl.querySelector('.storevo-theme-section');
            if (firstSec && firstSec.getAttribute('data-section-type') === 'announcement_bar') {
                const annBarEl = firstSec.querySelector('.sv-ann-bar');
                const pos = annBarEl ? (annBarEl.getAttribute('data-header-pos') || 'below_menu') : 'below_menu';
                if (pos === 'above_menu') {
                    // Mover físicamente encima del menú de la tienda (funciona en TODOS los diseños de navbar)
                    topAnnHost.appendChild(firstSec);
                } else {
                    // Queda debajo del menú y arriba del Banner Principal
                    firstSec.classList.add('sv-ann-below-hero-nav');
                }
            }
        }

        function updateHeroNavTopOffset() {
            let aboveHeight = 0;
            if (topAnnHost && topAnnHost.children.length > 0) {
                const rect = topAnnHost.getBoundingClientRect();
                if (rect.bottom > 0) {
                    aboveHeight = Math.max(0, rect.bottom - Math.max(0, rect.top));
                }
            }
            document.documentElement.style.setProperty('--sv-hero-nav-top', Math.round(aboveHeight) + 'px');

            if (navRoot) {
                const navRect = navRoot.getBoundingClientRect();
                if (navRect.height > 0) {
                    document.documentElement.style.setProperty('--sv-nav-h', Math.round(navRect.height) + 'px');
                }
            }
        }

        function checkHeroOverlayEligibility() {
            syncTopAnnouncementPlacement();
            const mainSecs = Array.from(document.querySelectorAll('main .storevo-theme-section'));
            const firstMainSec = mainSecs[0] || null;
            const secondMainSec = mainSecs[1] || null;

            let heroSec = null;
            if (firstMainSec && firstMainSec.getAttribute('data-section-type') === 'hero_banner') {
                heroSec = firstMainSec;
            } else if (firstMainSec && firstMainSec.getAttribute('data-section-type') === 'announcement_bar'
                && secondMainSec && secondMainSec.getAttribute('data-section-type') === 'hero_banner') {
                heroSec = secondMainSec;
            }

            const isHeroFirst = Boolean(heroSec);
            mainSecs.forEach(sec => {
                sec.classList.toggle('sv-hero-overlay-target', isHeroFirst && sec === heroSec);
            });
            document.body.classList.toggle('sv-has-hero-first', isHeroFirst);
            updateHeroNavTopOffset();
        }

        let navScrolledState = false;
        function handleScrollState() {
            const scrollTop = window.scrollY;
            if (!navScrolledState && scrollTop > 96) {
                navScrolledState = true;
            } else if (navScrolledState && scrollTop < 12) {
                navScrolledState = false;
            }
            document.body.classList.toggle('sv-is-scrolled', navScrolledState);
            if (document.body.getAttribute('data-sv-nav-layout') === 'hero_overlay') {
                updateHeroNavTopOffset();
            }
        }
        window.addEventListener('scroll', handleScrollState, { passive: true });
        document.addEventListener('storevo:page-load', () => {
            checkHeroOverlayEligibility();
            handleScrollState();
        });
        handleScrollState();
        checkHeroOverlayEligibility();

        // 9. Aplicar configuración de Navbar (en carga inicial y en vivo desde el Editor Visual)
        function applyAdvancedNavbarSettings(s) {
            if (!s) return;
            const layout = s.navbarLayout || document.body.getAttribute('data-sv-nav-layout') || 'classic';
            const hover = s.navbarLinkHover || document.body.getAttribute('data-sv-nav-hover') || 'color';
            const dStyle = s.navbarDropdownStyle || document.body.getAttribute('data-sv-dropdown-style') || 'mega';
            const dAnim = s.navbarDropdownAnim || document.body.getAttribute('data-sv-dropdown-anim') || 'slide_up';
            const trigger = s.navbarTrigger || document.body.getAttribute('data-sv-nav-trigger') || 'hover';
            const speed = s.navbarSpeed || document.body.getAttribute('data-sv-nav-speed') || 'normal';
            const compact = s.navbarCompactOnScroll !== undefined
                ? String(s.navbarCompactOnScroll) === 'true'
                : document.body.getAttribute('data-sv-nav-compact') === 'true';

            const showHome = s.navbarShowHome !== undefined
                ? String(s.navbarShowHome) !== 'false'
                : document.body.getAttribute('data-sv-nav-show-home') !== 'false';
            const showCatalog = s.navbarShowCatalog !== undefined
                ? String(s.navbarShowCatalog) !== 'false'
                : document.body.getAttribute('data-sv-nav-show-catalog') !== 'false';

            document.body.setAttribute('data-sv-nav-layout', layout);
            document.body.setAttribute('data-sv-nav-hover', hover);
            document.body.setAttribute('data-sv-dropdown-style', dStyle);
            document.body.setAttribute('data-sv-dropdown-anim', dAnim);
            document.body.setAttribute('data-sv-nav-trigger', trigger);
            document.body.setAttribute('data-sv-nav-speed', speed);
            document.body.setAttribute('data-sv-nav-compact', compact ? 'true' : 'false');
            document.body.setAttribute('data-sv-nav-show-home', showHome ? 'true' : 'false');
            document.body.setAttribute('data-sv-nav-show-catalog', showCatalog ? 'true' : 'false');

            document.querySelectorAll('[data-sv-nav-item="home"]').forEach(el => {
                el.classList.toggle('hidden', !showHome);
            });
            document.querySelectorAll('[data-sv-nav-item="catalog"]').forEach(el => {
                el.classList.toggle('hidden', !showCatalog);
            });

            checkHeroOverlayEligibility();
            renderDropdownContent(dStyle);
        }

        applyAdvancedNavbarSettings({
            navbarLayout: bridge.getAttribute('data-nav-layout'),
            navbarStyle: bridge.getAttribute('data-nav-style'),
            navbarLinkFormat: bridge.getAttribute('data-nav-format'),
            navbarLinkHover: bridge.getAttribute('data-nav-hover'),
            navbarSticky: bridge.getAttribute('data-nav-sticky'),
            navbarDropdownStyle: bridge.getAttribute('data-dropdown-style'),
            navbarDropdownAnim: bridge.getAttribute('data-dropdown-anim'),
            navbarTrigger: bridge.getAttribute('data-nav-trigger'),
            navbarSpeed: bridge.getAttribute('data-nav-speed'),
            navbarCompactOnScroll: bridge.getAttribute('data-nav-compact')
        });

        window.Storevo = window.Storevo || {};
        Storevo.UI = Storevo.UI || {};
        const originalApply = (Storevo.UI.NavbarStyle && typeof Storevo.UI.NavbarStyle.apply === 'function')
            ? Storevo.UI.NavbarStyle.apply.bind(Storevo.UI.NavbarStyle)
            : null;
        Storevo.UI.NavbarStyle = Storevo.UI.NavbarStyle || {};
        Storevo.UI.NavbarStyle.apply = function(styles) {

<!-- Puente interactivo cuando la tienda está dentro del Editor Visual (preview=draft) -->
<script th:if="${isDraftPreview}" data-sv-persistent="true">
    (function() {
        function detectCurrentEditorPageKey() {
            const path = window.location.pathname || '';
            const params = new URLSearchParams(window.location.search);

            const pageMatch = path.match(/\/page\/([^/?#]+)/);
            if (pageMatch && pageMatch[1]) {
                return 'page:' + decodeURIComponent(pageMatch[1]);
            }
            if (path.includes('/catalog')) {
                const catParam = params.get('category');
                return (catParam && /^\d+$/.test(catParam.trim()))
                    ? ('category:' + catParam.trim())
                    : 'catalog';
            }
            if (path.includes('/p/') || path.includes('/product-preview')) {
                return 'product';
            }
            if (/\/s\/[^/]+\/?$/.test(path)) {
                return 'home';
            }
            const explicitKey = document.body.getAttribute('data-editor-page-key');
            return (explicitKey && explicitKey.trim()) ? explicitKey.trim() : 'home';
        }

        function ensureDraftPreviewLinks(rootNode) {
            const scope = rootNode && rootNode.querySelectorAll ? rootNode : document;
            scope.querySelectorAll('a[href^="/s/"]').forEach(link => {
                try {
                    const url = new URL(link.getAttribute('href'), window.location.origin);
                    url.searchParams.set('preview', 'draft');
                    link.setAttribute('href', url.pathname + url.search + url.hash);
                } catch (e) {}
            });
        }

        function notifyEditorPageLoaded() {
            const detectedPage = detectCurrentEditorPageKey();
            document.body.setAttribute('data-editor-page-key', detectedPage);
            ensureDraftPreviewLinks(document);
            if (window.__storevoLiveStyles) {
                window.__storevoApplyLiveStyles(window.__storevoLiveStyles);
            }
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'storevo:page-loaded',
                    pageKey: detectedPage,
                    url: window.location.pathname + window.location.search
                }, window.location.origin);
            }
        }

        function syncLiveFilterToolbarDOM() {
            const ds = document.body.dataset;
            const filterEnabled = ds.svFilterEnabled !== 'false';
            const showSearch = ds.svFilterSearch !== 'false';
            const showSort = ds.svFilterSort !== 'false';
            const showCount = ds.svFilterCount !== 'false';

            document.querySelectorAll('.sv-grid-toolbar').forEach(toolbar => {
                const secAttr = toolbar.getAttribute('data-section-show-filters');
                const sectionAllows = secAttr === null || secAttr === 'true';
                const shouldShowToolbar = filterEnabled && sectionAllows;
                toolbar.classList.toggle('hidden', !shouldShowToolbar);

                const searchWrap = toolbar.querySelector('.sv-filter-search-wrap')
                    || (toolbar.querySelector('.sv-search-input, #catalog-search-input')
                        ? toolbar.querySelector('.sv-search-input, #catalog-search-input').parentElement
                        : null);
                if (searchWrap) {
                    searchWrap.classList.toggle('hidden', !showSearch);
                }

                const sortWrap = toolbar.querySelector('.sv-filter-sort-wrap, .sv-sort-wrap')
                    || toolbar.querySelector('.sv-sort-select, #catalog-sort-select');
                if (sortWrap) {
                    sortWrap.classList.toggle('hidden', !showSort);
                }

                const countWrap = toolbar.querySelector('.sv-filter-count-wrap')
                    || (toolbar.querySelector('.sv-visible-count, #catalog-visible-count')
                        ? toolbar.querySelector('.sv-visible-count, #catalog-visible-count').parentElement
                        : null);
                if (countWrap) {
                    countWrap.classList.toggle('hidden', !showCount);
                }
            });

            if (!filterEnabled) {
                document.querySelectorAll('.sv-filter-open-btn, .sv-global-filters-host, .sv-active-filters-bar').forEach(el => {
                    el.classList.add('hidden');
                });
                document.querySelectorAll('.sv-filter-drawer-backdrop').forEach(el => {
                    el.classList.remove('is-open');
                    el.classList.add('hidden');
                });
                document.body.classList.remove('overflow-hidden');
            }
        }

        let pendingSingleClickTimer = null;

        function isPureFormOrFilterControl(target) {
            if (!target || !target.closest) return false;
            return Boolean(
                target.closest('input, select, textarea, [data-qty-step], .sv-pagination-host, .sv-pag-btn, .sv-card__arrow, .sv-card__dot, .sv-card__dots, .sv-detail-gallery-arrow, .sv-detail-share-btn, .product-thumbnail, .opt-btn, .sv-filter-open-btn, .sv-filter-drawer-backdrop, .sv-global-filters-host, .sv-catalog-sidebar, .sv-active-filters-bar, .sv-nav__search, .sv-nav__search-expand, .sv-nav__search-trigger, .sv-search-panel, .sv-search-modal-backdrop, .sv-toolbar-search-box, .sv-search-cat-pills')
            );
        }

        // Interceptar en fase de captura cualquier clic en enlaces internos para que jamás se pierda ?preview=draft
        // y desambiguar clic simple (navegación/prueba) frente a doble clic (abrir sección en el editor)
        document.addEventListener('click', function(e) {
            const anchor = e.target && e.target.closest ? e.target.closest('a[href^="/s/"]') : null;
            if (anchor) {
                try {
                    const url = new URL(anchor.getAttribute('href'), window.location.origin);
                    if (url.searchParams.get('preview') !== 'draft') {
                        url.searchParams.set('preview', 'draft');
                        anchor.setAttribute('href', url.pathname + url.search + url.hash);
                    }
                } catch (err) {}
            }

            const sectionEl = e.target && e.target.closest ? e.target.closest('.storevo-theme-section[data-section-id]') : null;
            if (!sectionEl || isPureFormOrFilterControl(e.target)) return;

            // Si es el 2do clic de un doble clic sobre un enlace, botón o acordeón dentro de una sección,
            // cancelar la navegación pendiente del 1er clic y evitar ejecuciones duplicadas
            if (e.detail >= 2) {
                if (pendingSingleClickTimer) {
                    clearTimeout(pendingSingleClickTimer);
                    pendingSingleClickTimer = null;
                }
                const interactiveEl = e.target.closest('a[href], button, summary, label, [role="button"]');
                if (interactiveEl) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                return;
            }

            // En el 1er clic sobre un enlace dentro de una sección editable, dar margen breve (220ms)
            // por si el usuario está haciendo doble clic para editar la sección; si es un solo clic, navegar normalmente
            const anyAnchor = e.target.closest('a[href]');
            if (anyAnchor && e.button === 0 && !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey) {
                const rawHref = anyAnchor.getAttribute('href') || '';
                if (rawHref && !rawHref.startsWith('#') && !rawHref.startsWith('javascript:')) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (pendingSingleClickTimer) clearTimeout(pendingSingleClickTimer);
                    pendingSingleClickTimer = setTimeout(function() {
                        pendingSingleClickTimer = null;
                        const targetAttr = anyAnchor.getAttribute('target');
                        if (targetAttr && targetAttr !== '_self') {
                            window.open(anyAnchor.href, targetAttr);
                        } else if (
                            !anyAnchor.hasAttribute('data-no-spa') &&
                            window.Storevo &&
                            Storevo.Router &&
                            typeof Storevo.Router.navigate === 'function'
                        ) {
                            Storevo.Router.navigate(anyAnchor.href);
                        } else {
                            window.location.href = anyAnchor.href;
                        }
                    }, 220);
                }
            }
        }, true);

        // Doble clic sobre cualquier sección en cualquier página del iframe para abrir su configuración
        document.addEventListener('dblclick', function(e) {
            if (pendingSingleClickTimer) {
                clearTimeout(pendingSingleClickTimer);
                pendingSingleClickTimer = null;
            }
            if (isPureFormOrFilterControl(e.target)) return;

            const sectionEl = e.target && e.target.closest ? e.target.closest('.storevo-theme-section[data-section-id]') : null;
            if (!sectionEl) return;

            e.preventDefault();
            e.stopPropagation();
            if (window.getSelection) {
                try { window.getSelection().removeAllRanges(); } catch (err) {}
            }

            if (window.parent && window.parent !== window) {
                const sectionId = sectionEl.getAttribute('data-section-id');
                const sectionType = sectionEl.getAttribute('data-section-type') || '';
                const allSections = Array.from(document.querySelectorAll('main .storevo-theme-section[data-section-id]'));
                const sectionIndex = allSections.indexOf(sectionEl);
                const detectedPageKey = detectCurrentEditorPageKey();

                document.querySelectorAll('.storevo-theme-section').forEach(el => el.classList.remove('editor-selected-section'));
                sectionEl.classList.add('editor-selected-section');

                window.parent.postMessage({
                    type: 'storevo:select-section',
                    sectionId: sectionId,
                    sectionType: sectionType,
                    sectionIndex: sectionIndex,
                    pageKey: detectedPageKey,
                    url: window.location.pathname + window.location.search
                }, window.location.origin);
            }
        }, true);

        window.__storevoApplyLiveStyles = function(s) {
            if (!s) return;
            window.__storevoLiveStyles = Object.assign({}, window.__storevoLiveStyles || {}, s);
            const root = document.documentElement;
            if (s.primaryColor) root.style.setProperty('--brand-color', s.primaryColor);
            if (s.secondaryColor) root.style.setProperty('--brand-secondary', s.secondaryColor);
            if (s.backgroundColor) root.style.setProperty('--store-bg', s.backgroundColor);
            if (s.textColor) root.style.setProperty('--store-text', s.textColor);

            const SERIF_FONTS = ['Playfair Display', 'Lora', 'Cormorant Garamond', 'Cinzel'];
            if (s.headingFont) root.style.setProperty('--font-heading', `'${s.headingFont}', ${SERIF_FONTS.includes(s.headingFont) ? 'serif' : 'sans-serif'}`);
            if (s.bodyFont) root.style.setProperty('--font-body', `'${s.bodyFont}', ${SERIF_FONTS.includes(s.bodyFont) ? 'serif' : 'sans-serif'}`);
            if (s.headingTransform) document.body.dataset.headingCase = s.headingTransform;
            if (s.fontScale) {
                const scales = { compact: '95%', standard: '100%', large: '106%' };
                root.style.setProperty('--store-font-scale', scales[s.fontScale] || '100%');
            }
            if (s.buttonRadius) document.body.dataset.buttonRadius = s.buttonRadius;
            if (s.cardStyle) document.body.dataset.cardStyle = s.cardStyle;
            if (s.borderRadius) {
                root.style.setProperty('--store-radius', s.borderRadius);
                const activeCardRadius = s.cardRadius || document.body.dataset.svCardRadius || 'sync';
                if (activeCardRadius === 'sync') {
                    root.style.setProperty('--sv-card-radius', s.borderRadius);
                }
            }
            if (s.cardRadius) {
                document.body.dataset.svCardRadius = s.cardRadius;
                const baseRadius = s.borderRadius || getComputedStyle(root).getPropertyValue('--store-radius').trim() || '1rem';
                root.style.setProperty('--sv-card-radius', s.cardRadius === 'sync' ? baseRadius : s.cardRadius);
            }
            const productAndDetailKeysMap = {
                cardPreset: 'svCardPreset',
                cardImageAspect: 'svCardImgAspect',
                cardImageFit: 'svCardImgFit',
                cardImagePadding: 'svCardImgPadding',
                cardRadius: 'svCardRadius',
                cardShadow: 'svCardShadow',
                cardContentAlign: 'svCardAlign',
                cardMetaMode: 'svCardMeta',
                cardDiscountBadge: 'svCardDiscountBadge',
                cardShowStatusBadges: 'svCardStatusBadges',
                cardShowOldPrice: 'svCardOldPrice',
                cardPriceSize: 'svCardPriceSize',
                cardActionMode: 'svCardActionMode',
                cardWishlistMode: 'svCardWishlistMode',
                cardButtonStyle: 'svCardBtnStyle',
                cardImageHover: 'svCardImgHover',
                cardHoverLift: 'svCardHoverLift',
                detailPreset: 'svDetailPreset',
                detailInfoStyle: 'svDetailInfoStyle',
                detailStickyMode: 'svDetailSticky',
                detailGalleryPosition: 'svDetailGalleryPos',
                detailLayoutRatio: 'svDetailLayoutRatio',
                detailGalleryLayout: 'svDetailGalleryLayout',
                detailGalleryArrows: 'svDetailGalleryArrows',
                detailImageAspect: 'svDetailImgAspect',
                detailImageFit: 'svDetailImgFit',
                detailImageZoom: 'svDetailImgZoom',
                detailBuyLayout: 'svDetailBuyLayout',
                detailVariantStyle: 'svDetailVariantStyle',
                detailShowBreadcrumbs: 'svDetailBreadcrumbs',
                detailShowMeta: 'svDetailMeta',
                detailShowSku: 'svDetailSku',
                detailShowSavingsBadge: 'svDetailSavings',
                detailShowStock: 'svDetailStock',
                detailShowTrustStrip: 'svDetailTrust',
                detailShowShare: 'svDetailShare',
                detailShowSpecs: 'svDetailSpecs',
                detailSpecsOpen: 'svDetailSpecsOpen',
                detailShowPolicies: 'svDetailPolicies',
                detailShowRelated: 'svDetailRelated',
                detailRelatedCols: 'svDetailRelatedCols'
            };
            Object.keys(productAndDetailKeysMap).forEach(key => {
                if (s[key] !== undefined && s[key] !== null) {
                    const dataKey = productAndDetailKeysMap[key];
                    document.body.dataset[dataKey] = String(s[key]);
                }
            });
            if (s.detailGalleryLayout) {
                document.querySelectorAll('.sv-product-gallery').forEach(gal => {
                    gal.setAttribute('data-gallery-layout', s.detailGalleryLayout);
                });
                if (window.StorevoDetailGallery && typeof window.StorevoDetailGallery.refreshThumbs === 'function') {
                    window.StorevoDetailGallery.isExpanded = false;
                    window.StorevoDetailGallery.refreshThumbs();
                }
            }
            if (s.detailRelatedCols) {
                const relGrid = document.getElementById('sv-detail-related-grid');
                if (relGrid) {
                    relGrid.setAttribute('data-cols', s.detailRelatedCols === '3' ? '3' : '4');
                }
            }
            if (s.detailSpecsOpen !== undefined) {
                const specsContent = document.getElementById('specs-content');
                const specsIcon = document.getElementById('specs-icon');
                if (specsContent) {
                    const expand = String(s.detailSpecsOpen) === 'expanded';
                    specsContent.classList.toggle('hidden', !expand);
                    if (specsIcon) specsIcon.classList.toggle('rotate-180', expand);
                }
            }
            if (window.Storevo && Storevo.UI && Storevo.UI.NavbarStyle) {
                Storevo.UI.NavbarStyle.apply(s);
            }

            const filterKeysMap = {
                filterEnabled: 'svFilterEnabled',
                filterLayout: 'svFilterLayout',
                filterShowSearch: 'svFilterSearch',
                filterShowSort: 'svFilterSort',
                filterShowCount: 'svFilterCount',
                filterShowCategory: 'svFilterCategory',
                filterShowPrice: 'svFilterPrice',
                filterShowOffers: 'svFilterOffers',
                filterShowAvailability: 'svFilterAvailability',
                filterShowBrand: 'svFilterBrand',
                filterShowVariants: 'svFilterVariants',
                filterShowSpecs: 'svFilterSpecs'
            };
            let hasFilterPayload = false;
            Object.keys(filterKeysMap).forEach(key => {
                if (s[key] !== undefined) {
                    const dataKey = filterKeysMap[key];
                    document.body.dataset[dataKey] = String(s[key]);
                    hasFilterPayload = true;
                }
            });

            const searchKeysMap = {
                searchEnabled: 'svSearchEnabled',
                searchMode: 'svSearchMode',
                searchNavbarVariant: 'svSearchNavbarVariant',
                searchMobileMode: 'svSearchMobileMode',
                searchInputStyle: 'svSearchInputStyle',
                searchInputSize: 'svSearchInputSize',
                searchButtonMode: 'svSearchButtonMode',
                searchAnim: 'svSearchAnim',
                searchPlaceholder: 'svSearchPlaceholder',
                searchButtonLabel: 'svSearchButtonLabel',
                searchEmptyMessage: 'svSearchEmptyMessage',
                searchMinChars: 'svSearchMinChars',
                searchDebounceMs: 'svSearchDebounceMs',
                searchMaxSuggestions: 'svSearchMaxSuggestions',
                searchShowProductImg: 'svSearchShowProductImg',
                searchShowProductPrice: 'svSearchShowProductPrice',
                searchShowProductDiscount: 'svSearchShowProductDiscount',
                searchShowProductCategory: 'svSearchShowProductCategory',
                searchShowProductBrand: 'svSearchShowProductBrand',
                searchSuggestCategories: 'svSearchSuggestCategories',
                searchSuggestBrands: 'svSearchSuggestBrands',
                searchShowRecent: 'svSearchShowRecent',
                searchPopularTerms: 'svSearchPopularTerms',
                searchCategoryScope: 'svSearchCategoryScope',
                searchAdvancedEnabled: 'svSearchAdvancedEnabled',
                searchMatchVariants: 'svSearchMatchVariants',
                searchMatchSpecs: 'svSearchMatchSpecs',
                searchAdvCategory: 'svSearchAdvCategory',
                searchAdvBrand: 'svSearchAdvBrand',
                searchAdvPrice: 'svSearchAdvPrice',
                searchAdvAvailability: 'svSearchAdvAvailability',
                searchAdvVariants: 'svSearchAdvVariants',
                searchAdvSpecs: 'svSearchAdvSpecs'
            };
            let hasSearchPayload = false;
            Object.keys(searchKeysMap).forEach(key => {
                if (s[key] !== undefined && s[key] !== null) {
                    const dataKey = searchKeysMap[key];
                    document.body.dataset[dataKey] = String(s[key]);
                    hasSearchPayload = true;
                }
            });

            syncLiveFilterToolbarDOM();

            if (hasFilterPayload) {
                document.dispatchEvent(new CustomEvent('storevo:filter-config-updated', { detail: s }));
            }
            if (hasSearchPayload || hasFilterPayload) {
                document.dispatchEvent(new CustomEvent('storevo:search-config-updated', { detail: s }));
            }

            const pagKeysMap = {
                paginationMode: 'svPagMode',
                paginationColorMode: 'svPagColorMode',
                paginationPageSize: 'svPagSize',
                paginationButtonShape: 'svPagShape',

                paginationActiveTextColor: 'svPagActiveText',
                paginationShowCounter: 'svPagCounter',
                paginationShowPrevNext: 'svPagPrevNext'
            };
            let hasPagPayload = false;
            Object.keys(pagKeysMap).forEach(key => {

            const activeColorMode = s.paginationColorMode || document.body.dataset.svPagColorMode || 'brand';

            if (s.paginationBorderWidth) {
                root.style.setProperty('--sv-pag-border-width', s.paginationBorderWidth);
            }
            if (activeColorMode === 'brand') {
                root.style.setProperty('--sv-pag-bg', '#ffffff');
                root.style.setProperty('--sv-pag-text', brandSecondary);
                root.style.setProperty('--sv-pag-border', '#e2e8f0');
                root.style.setProperty('--sv-pag-active-bg', brandPrimary);
                root.style.setProperty('--sv-pag-active-text', '#ffffff');
            } else {
                if (s.paginationBgColor) root.style.setProperty('--sv-pag-bg', s.paginationBgColor);
                if (s.paginationTextColor) root.style.setProperty('--sv-pag-text', s.paginationTextColor);
                if (s.paginationBorderColor) root.style.setProperty('--sv-pag-border', s.paginationBorderColor);
                if (s.paginationActiveBgColor) root.style.setProperty('--sv-pag-active-bg', s.paginationActiveBgColor);
                if (s.paginationActiveTextColor) root.style.setProperty('--sv-pag-active-text', s.paginationActiveTextColor);
            }

            if (hasPagPayload) {
                document.dispatchEvent(new CustomEvent('storevo:pagination-config-updated', { detail: s }));
            }
        };

        window.addEventListener('message', function(e) {
            if (e.origin !== window.location.origin || !e.data) return;

            if (e.data.type === 'storevo:live-styles' && e.data.styles) {
                window.__storevoApplyLiveStyles(e.data.styles);

            if (e.data.type === 'storevo:highlight-section') {
                const targetId = e.data.sectionId || '';
                document.querySelectorAll('.storevo-theme-section').forEach(el => {
                    const domId = el.getAttribute('data-section-id') || '';
                    const domType = el.getAttribute('data-section-type') || '';
                    const isMatch = Boolean(targetId) && (
                        domId === targetId ||
                        (targetId.startsWith('sec_catalog_results_') && domType === 'catalog_results') ||
                        (domId && targetId.startsWith(domId + '_cat_'))
                    );
                    el.classList.toggle('editor-selected-section', isMatch);
                    if (isMatch) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                });
            }
            if (e.data.type === 'storevo:live-custom-page' && e.data.page) {
                const p = e.data.page;
                document.querySelectorAll(`#storeNavbar a[data-page-slug="${p.slug}"]`).forEach(link => {
                    const label = link.querySelector('.sv-nav__label') || link;

                    link.classList.toggle('hidden', p.showInNavbar === false);
                });
            }
        });

        // Re-sincronizar con el editor en cada navegación SPA del iframe y en popstate
        document.addEventListener('storevo:page-load', notifyEditorPageLoaded);
        window.addEventListener('popstate', notifyEditorPageLoaded);
        notifyEditorPageLoaded();
    })();

<script data-sv-persistent="true">
