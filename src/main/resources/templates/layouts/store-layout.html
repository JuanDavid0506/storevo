<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE | [[${settings.storeName}]]">Tienda</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style th:inline="text">
        :root {
            --brand-color: [[${settings.primaryColor != null ? settings.primaryColor : '#000000'}]];
            --brand-secondary: [[${settings.secondaryColor != null ? settings.secondaryColor : '#ffffff'}]];
        }
        /* Clases de Color Primario */
        .bg-brand { background-color: var(--brand-color) !important; }
        .text-brand { color: var(--brand-color) !important; }
        .border-brand { border-color: var(--brand-color) !important; }
        .hover-bg-brand:hover { filter: brightness(0.9); background-color: var(--brand-color) !important; }

        /* Clases de Color Secundario */
        .bg-secondary { background-color: var(--brand-secondary) !important; }
        .text-secondary { color: var(--brand-secondary) !important; }
        .border-secondary { border-color: var(--brand-secondary) !important; }
        .hover-bg-secondary:hover { filter: brightness(0.9); background-color: var(--brand-secondary) !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col">

<nav class="bg-white shadow-sm sticky top-0 z-50">
    <style>
        .nav-parent:hover .nav-dropdown {
            opacity: 1 !important;
            visibility: visible !important;
            transform: translateY(0) !important;
        }
        .nav-parent:hover .nav-arrow {
            transform: rotate(-180deg) !important;
        }
    </style>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">

            <a th:href="@{/s/{slug}(slug=${slug})}" class="text-2xl font-black text-brand tracking-tight" th:text="${settings.storeName}">Mi Tienda</a>

            <div class="hidden md:flex space-x-6 items-center z-50">
                <a th:href="@{/s/{slug}(slug=${slug})}" class="text-slate-600 hover:text-brand font-medium transition py-4 cursor-pointer">Inicio</a>
                <a th:href="@{/s/{slug}/catalog(slug=${slug})}" class="text-slate-600 hover:text-brand font-medium transition py-4 cursor-pointer">Todo el Catálogo</a>

                <div th:each="cat : ${navCategories}" class="relative nav-parent">

                    <a th:href="@{/s/{slug}/catalog(slug=${slug}, category=${cat.id})}"
                       class="flex items-center gap-1 text-slate-600 hover:text-brand font-medium transition py-5 cursor-pointer">
                        <span th:text="${cat.name}"></span>
                        <svg th:if="${not #lists.isEmpty(cat.subCategories)}" class="nav-arrow w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </a>

                    <div th:if="${not #lists.isEmpty(cat.subCategories)}"
                         class="nav-dropdown absolute top-[100%] left-0 w-56 bg-white border border-slate-100 shadow-xl rounded-xl opacity-0 invisible transform -translate-y-3 transition-all duration-300 z-50">
                        <div class="py-2 flex flex-col">

                            <a th:each="sub : ${cat.subCategories}"
                               th:if="${sub.isActive}"
                               th:href="@{/s/{slug}/catalog(slug=${slug}, category=${sub.id})}"
                               class="px-5 py-2.5 text-sm font-medium text-slate-600 hover:text-brand hover:bg-slate-50 transition"
                               th:text="${sub.name}">Subcategoría</a>

                        </div>
                    </div>
                </div>
            </div>

            <div>
                <a th:href="@{/s/{slug}/cart(slug=${slug})}" class="flex items-center gap-2 text-slate-600 hover:text-brand transition relative">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    <span id="navCartCounter" class="absolute -top-2 -right-2 bg-brand text-white text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full" th:text="${cartCount != null ? cartCount : 0}">0</span>
                </a>
            </div>

        </div>
    </div>
</nav>
<main class="flex-1 flex flex-col">
    <div class="flex-1 w-full">
        <div layout:fragment="content"></div>
    </div>
</main>

<footer class="bg-brand text-white py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-3 gap-8">
        <div>
            <h3 class="text-xl font-bold mb-4" th:text="${settings.storeName}">Tienda</h3>
            <p class="text-sm opacity-90">Bienvenido a nuestra tienda online. Descubre nuestro catálogo con los mejores productos.</p>
        </div>
        <div>
            <h4 class="font-bold mb-4 uppercase text-sm tracking-wider">Contacto</h4>
            <ul class="space-y-2 text-sm opacity-90">
                <li th:if="${settings.whatsapp != null && !settings.whatsapp.isBlank()}" th:text="'WhatsApp: ' + ${settings.whatsapp}"></li>
                <li th:if="${settings.emailContact != null && !settings.emailContact.isBlank()}" th:text="'Email: ' + ${settings.emailContact}"></li>
            </ul>
        </div>
        <div>
            <h4 class="font-bold mb-4 uppercase text-sm tracking-wider">Desarrollado por</h4>
            <p class="text-sm opacity-90 font-medium tracking-tight">Storevo SaaS</p>
        </div>
    </div>
</footer>
<div th:if="${cartSuccess}" id="server-toast"
     class="fixed top-20 right-6 bg-brand text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3 !z-[99999] opacity-100"
     style="z-index: 99999 !important; pointer-events: none;">

    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
    </svg>

    <span class="font-bold text-sm" th:text="${cartSuccess}"></span>
</div>

<script>
    // 1. Notificaciones Premium (Toasts)
    function showToast(message, type = 'success') {
        const toast = document.createElement('div');

        // Definir colores según el tipo de alerta (éxito, error, advertencia)
        let bgColor = 'bg-slate-900';
        let icon = `<svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;

        if (type === 'error') {
            bgColor = 'bg-red-500';
            icon = `<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
        } else if (type === 'warning') {
            bgColor = 'bg-orange-500';
            icon = `<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>`;
        }

        toast.className = `fixed bottom-6 right-6 ${bgColor} text-white px-5 py-4 rounded-xl shadow-2xl z-[100] transform transition-all duration-300 translate-y-full opacity-0 flex items-center gap-3 text-sm font-bold`;
        toast.innerHTML = `${icon} <span>${message}</span>`;

        document.body.appendChild(toast);

        // Animación de entrada
        setTimeout(() => toast.classList.remove('translate-y-full', 'opacity-0'), 10);

        // Animación de salida (Desaparece a los 3 segundos)
        setTimeout(() => {
            toast.classList.add('translate-y-full', 'opacity-0');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    // 2. Tarjetas de Producto: Icono de Carrito Toggle
    function toggleCartItem(btn, slug, productId) {
        const emptyIcon = btn.querySelector('.icon-empty');
        const filledIcon = btn.querySelector('.icon-filled');
        const isAdded = !filledIcon.classList.contains('hidden');

        const formData = new FormData();
        formData.append('productId', productId);

        // Bloquear doble clic rápido
        if(btn.classList.contains('pointer-events-none')) return;
        btn.classList.add('pointer-events-none');

        if (isAdded) {
            // Eliminar del carrito
            fetch(`/s/${slug}/cart/remove-ajax`, { method: 'POST', body: formData })
                .then(r => r.json())
                .then(data => {
                    if(data.success) {
                        filledIcon.classList.add('hidden');
                        emptyIcon.classList.remove('hidden');
                        btn.classList.remove('bg-white', 'border-brand');
                        btn.classList.add('bg-white/90');
                        updateCartGlobalCounter(data.cartCount, true);
                        showToast(data.message, 'success');
                    }
                }).finally(() => btn.classList.remove('pointer-events-none'));
        } else {
            // Agregar al carrito
            formData.append('quantity', 1);
            fetch(`/s/${slug}/cart/add-ajax`, { method: 'POST', body: formData })
                .then(r => r.json())
                .then(data => {
                    if(data.success) {
                        emptyIcon.classList.add('hidden');
                        filledIcon.classList.remove('hidden');
                        btn.classList.remove('bg-white/90');
                        btn.classList.add('bg-white', 'border-brand');
                        updateCartGlobalCounter(data.cartCount, true);
                        showToast(data.message, data.isWarning ? 'warning' : 'success');
                    } else {
                        showToast(data.message, 'error');
                    }
                }).finally(() => btn.classList.remove('pointer-events-none'));
        }
    }

    // 3. Comprar Directamente (Desde Catálogo)
    function buyNowFast(slug, productId) {
        const formData = new FormData();
        formData.append('productId', productId);
        formData.append('quantity', 1);

        fetch(`/s/${slug}/cart/add-ajax`, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if(data.success) window.location.href = `/s/${slug}/cart/checkout`;
                else showToast(data.message, 'error');
            });
    }

    // 4. Actualizar el Número de la Bolsa en el Navbar
    function updateCartGlobalCounter(value, isAbsolute = false) {
        const badge = document.getElementById('navCartCounter');
        if (badge) {
            if (isAbsolute) {
                badge.textContent = value;
            } else {
                let current = parseInt(badge.textContent) || 0;
                let newVal = current + value;
                badge.textContent = newVal < 0 ? 0 : newVal;
            }
        }
    }
</script>
</body>
</html>
