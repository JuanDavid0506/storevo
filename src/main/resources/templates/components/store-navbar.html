<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="storeNavbar" id="storeNavbar" class="sv-nav sv-nav-root"
     th:with="gs=${theme != null ? theme.globalStyles : null},
              navLayout=${gs != null and gs.navbarLayout != null ? gs.navbarLayout : 'classic'},
              navStyle=${gs != null and gs.navbarStyle != null ? gs.navbarStyle : 'page'},
              navLinkFormat=${gs != null and gs.navbarLinkFormat != null ? gs.navbarLinkFormat : 'normal'},
              navLinkHover=${gs != null and gs.navbarLinkHover != null ? gs.navbarLinkHover : 'color'},
              navSticky=${gs == null or gs.navbarSticky},
              previewParam=${isDraftPreview == true ? 'draft' : null},
              waRaw=${settings != null and settings.whatsapp != null ? #strings.replace(#strings.replace(#strings.replace(settings.whatsapp, ' ', ''), '+', ''), '-', '') : ''},
              waPhone=${#strings.length(waRaw) == 10 ? '57' + waRaw : waRaw}"
     th:attr="data-nav-layout=${navLayout},
              data-nav-style=${navStyle},
              data-nav-link-format=${navLinkFormat},
              data-nav-link-hover=${navLinkHover},
              data-nav-sticky=${navSticky}">

    <!-- Doble Barra Comercial renderizada en SSR (visible cuando data-sv-nav-layout="double_bar") -->
    <div class="sv-nav-double-strip" data-ssr-mounted="true">
        <div class="sv-nav-double-strip__inner">
            <div class="sv-nav-double-strip__links">
                <a th:href="@{/s/{slug}/catalog(slug=${slug}, preview=${previewParam})}">Todo el Catálogo</a>
                <th:block th:if="${navCategories != null}">
                    <a th:each="rc, iterStat : ${navCategories}"
                       th:if="${iterStat.index < 5}"
                       th:href="@{/s/{slug}/catalog(slug=${slug}, category=${rc.id}, preview=${previewParam})}"
                       th:text="${rc.name}">Categoría</a>
                </th:block>
                <th:block th:if="${theme != null and not #lists.isEmpty(theme.navbarCustomPages)}">
                    <a th:each="cp : ${theme.navbarCustomPages}"
                       th:href="@{/s/{slug}/page/{pageSlug}(slug=${slug}, pageSlug=${cp.slug}, preview=${previewParam})}"
                       th:attr="data-page-slug=${cp.slug}"
                       th:text="${cp.title}">Página</a>
                </th:block>
            </div>
            <div class="hidden sm:flex items-center gap-4 flex-shrink-0">
                <a th:if="${waPhone != ''}"
                   th:href="'https://wa.me/' + ${waPhone}"
                   target="_blank" rel="noopener"
                   data-no-spa="true"
                   class="inline-flex items-center gap-1.5 font-bold text-emerald-300 hover:text-white transition">
                    <span>💬 Atención WhatsApp</span>
                </a>
                <span th:if="${waPhone == ''}"
                      class="opacity-80 font-semibold"
                      th:text="'🔒 Compra 100% segura en ' + ${settings != null ? settings.storeName : 'Tienda'}">🔒 Compra 100% segura</span>
                <a th:href="@{/s/{slug}/wishlist(slug=${slug}, preview=${previewParam})}"
                   class="text-white/85 hover:text-white font-semibold">Favoritos</a>
            </div>
        </div>
    </div>

    <div class="sv-nav__bar">
        <div class="sv-nav__grid">

            <!-- Botón de menú (móvil, y en PC solo en el diseño Minimalista) -->
            <button type="button" id="mobile-menu-btn" class="sv-nav__burger" aria-label="Abrir menú">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                <span class="sv-nav__burger-label">Categorías</span>
            </button>

            <!-- Logo -->
            <a th:href="@{/s/{slug}(slug=${slug}, preview=${previewParam})}" class="sv-nav__logo flex items-center">
                <img th:if="${settings != null and not #strings.isEmpty(settings.logoUrl)}"
                     th:src="${settings.logoUrl}"
                     th:alt="${settings != null and settings.storeName != null ? settings.storeName : 'Tienda'}"
                     class="h-8 w-auto max-h-8 object-contain">
                <span th:if="${settings == null or #strings.isEmpty(settings.logoUrl)}"
                      class="truncate"
                      th:text="${settings != null and settings.storeName != null ? settings.storeName : 'Mi Tienda'}">Mi Tienda</span>
            </a>

            <!-- Navegación Desktop (SSR completo: Inicio + Catálogo + Categorías + Páginas Personalizadas) -->
            <div class="sv-nav__menu sv-nav-links-group" data-custom-pages-mounted="true">
                <a th:href="@{/s/{slug}(slug=${slug}, preview=${previewParam})}"
                   class="sv-nav__link sv-interactive-link"
                   th:classappend="${editorPageKey == 'home'} ? ' is-active' : ''"
                   th:attr="data-sv-nav-link='home', aria-current=${editorPageKey == 'home' ? 'page' : null}">
                    <span class="sv-nav__label">Inicio</span>
                </a>

                <!-- Todo el Catálogo con wrapper y flecha pre-renderizados si existen categorías -->
                <div th:if="${not #lists.isEmpty(navCategories)}" class="nav-parent sv-catalog-menu-trigger-wrap sv-nav-links-group">
                    <a th:href="@{/s/{slug}/catalog(slug=${slug}, preview=${previewParam})}"
                       class="sv-nav__link sv-interactive-link"
                       th:classappend="${editorPageKey == 'catalog'} ? ' is-active' : ''"
                       th:attr="data-sv-nav-link='catalog', aria-current=${editorPageKey == 'catalog' ? 'page' : null}">
                        <span class="sv-nav__label">Todo el Catálogo</span>
                        <svg class="nav-arrow sv-catalog-chevron w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </a>
                    <div class="sv-dropdown-panel is-mega"></div>
                </div>
                <a th:if="${#lists.isEmpty(navCategories)}"
                   th:href="@{/s/{slug}/catalog(slug=${slug}, preview=${previewParam})}"
                   class="sv-nav__link sv-interactive-link"
                   th:classappend="${editorPageKey == 'catalog'} ? ' is-active' : ''"
                   th:attr="data-sv-nav-link='catalog', aria-current=${editorPageKey == 'catalog' ? 'page' : null}">
                    <span class="sv-nav__label">Todo el Catálogo</span>
                </a>

                <!-- Categorías Raíz y Subcategorías -->
                <div th:each="cat : ${navCategories}" class="nav-parent sv-nav-links-group" th:attr="data-cat-id=${cat.id}">
                    <a th:href="@{/s/{slug}/catalog(slug=${slug}, category=${cat.id}, preview=${previewParam})}"
                       class="sv-nav__link sv-interactive-link"
                       th:classappend="${editorPageKey == 'category:' + cat.id} ? ' is-active' : ''"
                       th:attr="data-sv-cat-id=${cat.id}, aria-current=${editorPageKey == 'category:' + cat.id ? 'page' : null}">
                        <span class="sv-nav__label" th:text="${cat.name}"></span>
                        <svg th:if="${not #lists.isEmpty(cat.subCategories)}" class="nav-arrow w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </a>

                    <div th:if="${not #lists.isEmpty(cat.subCategories)}" class="sv-nav__dropdown">
                        <div class="py-2 flex flex-col">
                            <div th:each="sub : ${cat.subCategories}" th:if="${sub.isActive}" class="relative nav-flyout-parent group/item">
                                <a th:href="@{/s/{slug}/catalog(slug=${slug}, category=${sub.id}, preview=${previewParam})}" class="sv-nav__dropdown-link px-5 py-2.5 text-sm font-medium transition flex justify-between items-center w-full">
                                    <span th:text="${sub.name}">Subcategoría</span>
                                    <svg th:if="${not #lists.isEmpty(sub.subCategories)}" class="w-4 h-4 opacity-60 group-hover/item:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                </a>

                                <div th:if="${not #lists.isEmpty(sub.subCategories)}" class="sv-nav__flyout">
                                    <div class="py-2 flex flex-col">
                                        <a th:each="subsub : ${sub.subCategories}" th:if="${subsub.isActive}" th:href="@{/s/{slug}/catalog(slug=${slug}, category=${subsub.id}, preview=${previewParam})}" class="sv-nav__dropdown-link px-5 py-2.5 text-sm font-medium transition block" th:text="${subsub.name}">Sub-sub</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Páginas Personalizadas renderizadas directamente en SSR -->
                <th:block th:if="${theme != null and not #lists.isEmpty(theme.navbarCustomPages)}">
                    <a th:each="cp : ${theme.navbarCustomPages}"
                       th:href="@{/s/{slug}/page/{pageSlug}(slug=${slug}, pageSlug=${cp.slug}, preview=${previewParam})}"
                       class="sv-nav__link sv-interactive-link"
                       th:classappend="${(pageSlug != null and pageSlug == cp.slug) or (editorPageKey != null and editorPageKey == 'page:' + cp.slug)} ? ' is-active' : ''"
                       th:attr="data-page-slug=${cp.slug}, aria-current=${((pageSlug != null and pageSlug == cp.slug) or (editorPageKey != null and editorPageKey == 'page:' + cp.slug)) ? 'page' : null}">
                        <span class="sv-nav__label" th:text="${cp.title}">Página</span>
                    </a>
                </th:block>
            </div>

            <!-- Buscador -->
            <form th:action="@{/s/{slug}/catalog(slug=${slug})}" method="GET" class="sv-nav__search">
                <input th:if="${isDraftPreview == true}" type="hidden" name="preview" value="draft">
                <input type="search" name="q" th:value="${param.q != null ? param.q[0] : ''}" placeholder="Buscar productos...">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </form>

            <!-- Acciones: Favoritos + Bolsa -->
            <div class="sv-nav__actions">
                <a th:href="@{/s/{slug}/wishlist(slug=${slug}, preview=${previewParam})}" class="sv-nav__icon sv-nav__icon--wish" title="Mis Favoritos" aria-label="Mis Favoritos">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                    <span id="navWishlistCounter" class="sv-nav__badge sv-nav__badge--wish bg-brand text-white" th:text="${wishlistCount != null ? wishlistCount : 0}">0</span>
                </a>

                <a th:href="@{/s/{slug}/cart(slug=${slug}, preview=${previewParam})}" class="sv-nav__icon" title="Mi Bolsa" aria-label="Mi Bolsa">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    <span id="navCartCounter" class="sv-nav__badge sv-nav__badge--cart bg-brand text-white" th:text="${cartCount != null ? cartCount : 0}">0</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Menú Lateral (móvil y diseño Minimalista) sincronizado con el tema de la tienda -->
    <div id="mobile-menu-backdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[60] hidden opacity-0 transition-opacity duration-300"></div>

    <div id="mobile-menu" class="sv-drawer fixed top-0 left-0 h-full w-4/5 max-w-sm shadow-2xl z-[70] transform -translate-x-full transition-transform duration-300 flex flex-col overflow-y-auto">
        <div class="sv-drawer__header p-4 flex justify-between items-center">
            <div class="flex items-center min-w-0 pr-2">
                <img th:if="${settings != null and not #strings.isEmpty(settings.logoUrl)}"
                     th:src="${settings.logoUrl}"
                     th:alt="${settings != null and settings.storeName != null ? settings.storeName : 'Tienda'}"
                     class="h-7 w-auto max-h-7 object-contain max-w-[180px]">
                <span th:if="${settings == null or #strings.isEmpty(settings.logoUrl)}"
                      class="font-black text-brand text-lg truncate"
                      th:text="${settings != null and settings.storeName != null ? settings.storeName : 'Mi Tienda'}">Mi Tienda</span>
            </div>
            <button type="button" id="mobile-menu-close" class="sv-drawer__close p-2" aria-label="Cerrar menú">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <!-- Buscador del menú lateral -->
        <div class="sv-drawer__search-wrap p-4">
            <form th:action="@{/s/{slug}/catalog(slug=${slug})}" method="GET" class="relative">
                <input th:if="${isDraftPreview == true}" type="hidden" name="preview" value="draft">
                <input type="search" name="q" th:value="${param.q != null ? param.q[0] : ''}"
                       placeholder="Buscar producto..."
                       class="sv-drawer__search-input w-full pl-9 pr-4 py-2.5 rounded-xl text-sm focus:outline-none">
                <svg class="w-4 h-4 opacity-60 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </form>
        </div>

        <!-- Árbol de Categorías (hasta 3 niveles) + Páginas Personalizadas en SSR -->
        <div id="mobile-menu-links" class="p-4 flex flex-col gap-1 flex-1" data-custom-pages-mounted="true">
            <a th:href="@{/s/{slug}(slug=${slug}, preview=${previewParam})}" class="sv-drawer__link font-bold py-3">Inicio</a>
            <a th:href="@{/s/{slug}/catalog(slug=${slug}, preview=${previewParam})}" class="sv-drawer__link font-bold py-3">Todo el Catálogo</a>

            <div th:each="cat : ${navCategories}" class="sv-drawer__group">
                <a th:if="${#lists.isEmpty(cat.subCategories)}"
                   th:href="@{/s/{slug}/catalog(slug=${slug}, category=${cat.id}, preview=${previewParam})}"
                   class="sv-drawer__link font-bold py-3 block"
                   th:text="${cat.name}">Categoría</a>

                <details th:if="${not #lists.isEmpty(cat.subCategories)}" class="group/mobcat">
                    <summary class="flex items-center justify-between py-3 cursor-pointer list-none [&::-webkit-details-marker]:hidden">
                        <a th:href="@{/s/{slug}/catalog(slug=${slug}, category=${cat.id}, preview=${previewParam})}"
                           onclick="event.stopPropagation();"
                           class="sv-drawer__link font-bold"
                           th:text="${cat.name}">Categoría</a>
                        <span class="p-1.5 opacity-70 group-open/mobcat:rotate-180 transition-transform">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </span>
                    </summary>

                    <div class="sv-drawer__sublist pl-4 pb-3 flex flex-col gap-1 ml-1">
                        <div th:each="sub : ${cat.subCategories}" th:if="${sub.isActive}">
                            <a th:if="${#lists.isEmpty(sub.subCategories)}"
                               th:href="@{/s/{slug}/catalog(slug=${slug}, category=${sub.id}, preview=${previewParam})}"
                               class="sv-drawer__sublink text-sm font-medium py-2 block"
                               th:text="${sub.name}">Subcategoría</a>

                            <details th:if="${not #lists.isEmpty(sub.subCategories)}" class="group/mobsub">
                                <summary class="flex items-center justify-between py-2 cursor-pointer list-none [&::-webkit-details-marker]:hidden">
                                    <a th:href="@{/s/{slug}/catalog(slug=${slug}, category=${sub.id}, preview=${previewParam})}"
                                       onclick="event.stopPropagation();"
                                       class="sv-drawer__sublink text-sm font-medium"
                                       th:text="${sub.name}">Subcategoría</a>
                                    <span class="p-1 opacity-70 group-open/mobsub:rotate-180 transition-transform">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                    </span>
                                </summary>
                                <div class="sv-drawer__sublist pl-3 pb-1 flex flex-col gap-1 ml-1">
                                    <a th:each="subsub : ${sub.subCategories}"
                                       th:if="${subsub.isActive}"
                                       th:href="@{/s/{slug}/catalog(slug=${slug}, category=${subsub.id}, preview=${previewParam})}"
                                       class="sv-drawer__sublink text-xs font-medium py-1.5 block opacity-85"
                                       th:text="${subsub.name}">Sub-subcategoría</a>
                                </div>
                            </details>
                        </div>
                    </div>
                </details>
            </div>

            <!-- Páginas Personalizadas en el Drawer Móvil -->
            <th:block th:if="${theme != null and not #lists.isEmpty(theme.navbarCustomPages)}">
                <a th:each="cp : ${theme.navbarCustomPages}"
                   th:href="@{/s/{slug}/page/{pageSlug}(slug=${slug}, pageSlug=${cp.slug}, preview=${previewParam})}"
                   class="sv-drawer__link font-bold py-3 block"
                   th:classappend="${(pageSlug != null and pageSlug == cp.slug) or (editorPageKey != null and editorPageKey == 'page:' + cp.slug)} ? ' is-active' : ''"
                   th:attr="data-page-slug=${cp.slug}, aria-current=${((pageSlug != null and pageSlug == cp.slug) or (editorPageKey != null and editorPageKey == 'page:' + cp.slug)) ? 'page' : null}"
                   th:text="${cp.title}">Página</a>
            </th:block>
        </div>

        <!-- Accesos rápidos -->
        <div class="sv-drawer__footer p-4 space-y-2">
            <div class="grid grid-cols-2 gap-2">
                <a th:href="@{/s/{slug}/wishlist(slug=${slug}, preview=${previewParam})}" class="sv-drawer__wish-btn flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-xl text-xs font-bold transition">
                    <svg class="w-4 h-4 text-brand" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L12 8.343l3.172-3.171a4 4 0 115.656 5.656L12 21.414l-8.828-8.828a4 4 0 010-5.656z" clip-rule="evenodd"></path></svg>
                    <span>Favoritos</span>
                </a>
                <a th:href="@{/s/{slug}/cart(slug=${slug}, preview=${previewParam})}" class="flex items-center justify-center gap-1.5 py-2.5 px-3 bg-brand text-white rounded-xl text-xs font-bold shadow-sm hover-bg-brand transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    <span>Mi Bolsa</span>
                </a>
            </div>
        </div>
    </div>
</nav>

</body>
</html>
