<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="storeNavbar" id="storeNavbar" class="sv-nav"
     th:with="gs=${theme != null ? theme.globalStyles : null},
              navLayout=${gs != null and gs.navbarLayout != null ? gs.navbarLayout : 'classic'},
              navStyle=${gs != null and gs.navbarStyle != null ? gs.navbarStyle : 'light'},
              navLinkFormat=${gs != null and gs.navbarLinkFormat != null ? gs.navbarLinkFormat : 'normal'},
              navLinkHover=${gs != null and gs.navbarLinkHover != null ? gs.navbarLinkHover : 'color'},
              navSticky=${gs == null or gs.navbarSticky}"
     th:attr="data-nav-layout=${navLayout},
              data-nav-style=${navStyle},
              data-nav-link-format=${navLinkFormat},
              data-nav-link-hover=${navLinkHover},
              data-nav-sticky=${navSticky}">

    <div class="sv-nav__bar">
        <div class="sv-nav__grid">

            <!-- Botón de menú (móvil, y en PC solo en el diseño Minimalista) -->
            <button type="button" id="mobile-menu-btn" class="sv-nav__burger" aria-label="Abrir menú">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                <span class="sv-nav__burger-label">Categorías</span>
            </button>

            <!-- Logo -->
            <a th:href="@{/s/{slug}(slug=${slug})}" class="sv-nav__logo" th:text="${settings.storeName}">Mi Tienda</a>

            <!-- Navegación Desktop (3 niveles) -->
            <div class="sv-nav__menu">
                <a th:href="@{/s/{slug}(slug=${slug})}" class="sv-nav__link"><span class="sv-nav__label">Inicio</span></a>
                <a th:href="@{/s/{slug}/catalog(slug=${slug})}" class="sv-nav__link"><span class="sv-nav__label">Todo el Catálogo</span></a>

                <div th:each="cat : ${navCategories}" class="nav-parent">
                    <a th:href="@{/s/{slug}/catalog(slug=${slug}, category=${cat.id})}" class="sv-nav__link">
                        <span class="sv-nav__label" th:text="${cat.name}"></span>
                        <svg th:if="${not #lists.isEmpty(cat.subCategories)}" class="nav-arrow w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </a>

                    <div th:if="${not #lists.isEmpty(cat.subCategories)}" class="sv-nav__dropdown">
                        <div class="py-2 flex flex-col">
                            <div th:each="sub : ${cat.subCategories}" th:if="${sub.isActive}" class="relative nav-flyout-parent group/item">
                                <a th:href="@{/s/{slug}/catalog(slug=${slug}, category=${sub.id})}" class="px-5 py-2.5 text-sm font-medium text-slate-600 hover:text-brand hover:bg-slate-50 transition flex justify-between items-center w-full">
                                    <span th:text="${sub.name}">Subcategoría</span>
                                    <svg th:if="${not #lists.isEmpty(sub.subCategories)}" class="w-4 h-4 text-slate-400 group-hover/item:text-brand transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                </a>

                                <div th:if="${not #lists.isEmpty(sub.subCategories)}" class="sv-nav__flyout">
                                    <div class="py-2 flex flex-col">
                                        <a th:each="subsub : ${sub.subCategories}" th:if="${subsub.isActive}" th:href="@{/s/{slug}/catalog(slug=${slug}, category=${subsub.id})}" class="px-5 py-2.5 text-sm font-medium text-slate-600 hover:text-brand hover:bg-slate-50 transition" th:text="${subsub.name}">Sub-sub</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Buscador -->
            <form th:action="@{/s/{slug}/catalog(slug=${slug})}" method="GET" class="sv-nav__search">
                <input th:if="${isDraftPreview}" type="hidden" name="preview" value="draft">
                <input type="search" name="q" th:value="${param.q != null ? param.q[0] : ''}" placeholder="Buscar productos...">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </form>

            <!-- Acciones: Favoritos + Bolsa -->
            <div class="sv-nav__actions">
                <a th:href="@{/s/{slug}/wishlist(slug=${slug})}" class="sv-nav__icon sv-nav__icon--wish" title="Mis Favoritos" aria-label="Mis Favoritos">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                    <span id="navWishlistCounter" class="sv-nav__badge sv-nav__badge--wish" th:text="${wishlistCount != null ? wishlistCount : 0}">0</span>
                </a>

                <a th:href="@{/s/{slug}/cart(slug=${slug})}" class="sv-nav__icon" title="Mi Bolsa" aria-label="Mi Bolsa">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    <span id="navCartCounter" class="sv-nav__badge sv-nav__badge--cart" th:text="${cartCount != null ? cartCount : 0}">0</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Menú Lateral (móvil y diseño Minimalista) -->
    <div id="mobile-menu-backdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[60] hidden opacity-0 transition-opacity duration-300"></div>

    <div id="mobile-menu" class="fixed top-0 left-0 h-full w-4/5 max-w-sm bg-white text-slate-900 shadow-2xl z-[70] transform -translate-x-full transition-transform duration-300 flex flex-col overflow-y-auto">
        <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
            <span class="font-black text-brand text-lg truncate pr-2" th:text="${settings.storeName}">Mi Tienda</span>
            <button type="button" id="mobile-menu-close" class="text-slate-400 hover:text-red-500 p-2" aria-label="Cerrar menú">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <!-- Buscador del menú lateral -->
        <div class="p-4 border-b border-slate-100">
            <form th:action="@{/s/{slug}/catalog(slug=${slug})}" method="GET" class="relative">
                <input th:if="${isDraftPreview}" type="hidden" name="preview" value="draft">
                <input type="search" name="q" th:value="${param.q != null ? param.q[0] : ''}"
                       placeholder="Buscar producto..."
                       class="w-full pl-9 pr-4 py-2.5 bg-slate-100 focus:bg-white border border-slate-200 focus:border-brand rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none">
                <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </form>
        </div>

        <!-- Árbol de Categorías (hasta 3 niveles) -->
        <div class="p-4 flex flex-col gap-1 flex-1">
            <a th:href="@{/s/{slug}(slug=${slug})}" class="font-bold text-slate-700 hover:text-brand py-3 border-b border-slate-100">Inicio</a>
            <a th:href="@{/s/{slug}/catalog(slug=${slug})}" class="font-bold text-slate-700 hover:text-brand py-3 border-b border-slate-100">Todo el Catálogo</a>

            <div th:each="cat : ${navCategories}" class="border-b border-slate-100">
                <a th:if="${#lists.isEmpty(cat.subCategories)}"
                   th:href="@{/s/{slug}/catalog(slug=${slug}, category=${cat.id})}"
                   class="font-bold text-slate-700 hover:text-brand py-3 block"
                   th:text="${cat.name}">Categoría</a>

                <details th:if="${not #lists.isEmpty(cat.subCategories)}" class="group/mobcat">
                    <summary class="flex items-center justify-between py-3 cursor-pointer list-none [&::-webkit-details-marker]:hidden">
                        <a th:href="@{/s/{slug}/catalog(slug=${slug}, category=${cat.id})}"
                           onclick="event.stopPropagation();"
                           class="font-bold text-slate-700 hover:text-brand"
                           th:text="${cat.name}">Categoría</a>
                        <span class="p-1.5 text-slate-400 group-open/mobcat:rotate-180 transition-transform">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </span>
                    </summary>

                    <div class="pl-4 pb-3 flex flex-col gap-1 border-l-2 border-slate-100 ml-1">
                        <div th:each="sub : ${cat.subCategories}" th:if="${sub.isActive}">
                            <a th:if="${#lists.isEmpty(sub.subCategories)}"
                               th:href="@{/s/{slug}/catalog(slug=${slug}, category=${sub.id})}"
                               class="text-sm font-medium text-slate-600 hover:text-brand py-2 block"
                               th:text="${sub.name}">Subcategoría</a>

                            <details th:if="${not #lists.isEmpty(sub.subCategories)}" class="group/mobsub">
                                <summary class="flex items-center justify-between py-2 cursor-pointer list-none [&::-webkit-details-marker]:hidden">
                                    <a th:href="@{/s/{slug}/catalog(slug=${slug}, category=${sub.id})}"
                                       onclick="event.stopPropagation();"
                                       class="text-sm font-medium text-slate-600 hover:text-brand"
                                       th:text="${sub.name}">Subcategoría</a>
                                    <span class="p-1 text-slate-400 group-open/mobsub:rotate-180 transition-transform">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                    </span>
                                </summary>
                                <div class="pl-3 pb-1 flex flex-col gap-1 border-l border-slate-200 ml-1">
                                    <a th:each="subsub : ${sub.subCategories}"
                                       th:if="${subsub.isActive}"
                                       th:href="@{/s/{slug}/catalog(slug=${slug}, category=${subsub.id})}"
                                       class="text-xs font-medium text-slate-500 hover:text-brand py-1.5 block"
                                       th:text="${subsub.name}">Sub-subcategoría</a>
                                </div>
                            </details>
                        </div>
                    </div>
                </details>
            </div>
        </div>

        <!-- Accesos rápidos -->
        <div class="p-4 border-t border-slate-100 bg-slate-50 space-y-2">
            <div class="grid grid-cols-2 gap-2">
                <a th:href="@{/s/{slug}/wishlist(slug=${slug})}" class="flex items-center justify-center gap-1.5 py-2.5 px-3 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-700 hover:text-red-500">
                    <svg class="w-4 h-4 text-red-500" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L12 8.343l3.172-3.171a4 4 0 115.656 5.656L12 21.414l-8.828-8.828a4 4 0 010-5.656z" clip-rule="evenodd"></path></svg>
                    <span>Favoritos</span>
                </a>
                <a th:href="@{/s/{slug}/cart(slug=${slug})}" class="flex items-center justify-center gap-1.5 py-2.5 px-3 bg-brand text-white rounded-xl text-xs font-bold shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    <span>Mi Bolsa</span>
                </a>
            </div>
        </div>
    </div>
</nav>

</body>
</html>
