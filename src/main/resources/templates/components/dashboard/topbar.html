<header th:fragment="topbar" class="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 sticky top-0 z-10">
    <div class="flex items-center text-sm">
        <span class="text-slate-400 font-medium">Dashboard</span>
        <svg class="w-4 h-4 mx-2 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        <span class="text-white font-medium" th:text="${pageTitle ?: 'Inicio'}">Inicio</span>
    </div>

    <div class="flex items-center gap-4">
        <a th:href="@{|/s/${slug}|}" target="_blank" title="Ver mi tienda pública" class="text-slate-400 hover:text-white transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
        </a>
        <div class="h-8 w-8 bg-storevo-600 rounded-full flex items-center justify-center font-bold text-white shadow-lg">
            C
        </div>
        <form th:action="@{/auth/logout}" method="post" class="m-0">
            <button type="submit" title="Cerrar sesión" class="text-slate-400 hover:text-red-400 transition ml-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            </button>
        </form>
    </div>
</header>
