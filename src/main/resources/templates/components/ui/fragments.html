<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="card(title, description)" class="bg-slate-900 border border-slate-800 rounded-xl shadow-sm overflow-hidden">
    <div class="px-6 py-5 border-b border-slate-800">
        <h3 class="text-lg font-medium leading-6 text-white" th:text="${title}">Título</h3>
        <p class="mt-1 text-sm text-slate-400" th:if="${description}" th:text="${description}">Descripción</p>
    </div>
    <div class="px-6 py-6">
    </div>
</div>

<div th:fragment="input(id, label, type, placeholder, value)">
    <label th:for="${id}" class="block text-sm font-medium text-slate-300 mb-1" th:text="${label}"></label>
    <input th:type="${type}" th:id="${id}" th:name="${id}" th:placeholder="${placeholder}" th:value="${value}"
           class="w-full px-4 py-2 bg-slate-950 border border-slate-800 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-storevo-500 transition placeholder-slate-600">
</div>

<div th:fragment="textarea(id, label, placeholder, value, rows)">
    <label th:for="${id}" class="block text-sm font-medium text-slate-300 mb-1" th:text="${label}"></label>
    <textarea th:id="${id}" th:name="${id}" th:rows="${rows}" th:placeholder="${placeholder}" th:text="${value}"
              class="w-full px-4 py-2 bg-slate-950 border border-slate-800 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-storevo-500 transition placeholder-slate-600"></textarea>
</div>

<button th:fragment="btn-primary(text, type)" th:type="${type}" class="bg-storevo-500 hover:bg-storevo-600 text-white font-medium py-2 px-6 rounded-lg shadow-md transition duration-200">
    <span th:text="${text}">Botón</span>
</button>

<button th:fragment="btn-secondary(text, type)" th:type="${type}" class="bg-slate-800 hover:bg-slate-700 text-white font-medium py-2 px-6 rounded-lg border border-slate-700 transition duration-200">
    <span th:text="${text}">Botón</span>
</button>

</body>
</html>
