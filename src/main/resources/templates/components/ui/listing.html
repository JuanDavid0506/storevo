<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="search(placeholder)" class="relative w-full sm:max-w-xs">
  <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
  </svg>
  <input type="text" name="q" th:value="${param.q}" th:placeholder="${placeholder}" data-filter="true" autocomplete="off"
         class="w-full pl-9 pr-9 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:border-storevo-500 focus:ring-1 focus:ring-storevo-500 transition-colors">
  <button type="button" data-clear-field="q" title="Borrar búsqueda"
          class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white transition-colors">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
  </button>
</div>

<div th:fragment="filter-select(name, defaultText, options, valueField, textField)">
  <select th:name="${name}" onchange="this.form.submit()" data-filter="true"
          class="w-full sm:w-auto px-4 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-300 focus:border-storevo-500 focus:ring-1 focus:ring-storevo-500 cursor-pointer appearance-none pr-8">
    <option value="" th:text="${defaultText}"></option>
    <option th:each="opt : ${options}"
            th:value="${opt[valueField]}"
            th:text="${opt[textField]}"
            th:selected="${param.get(name) != null and param.get(name)[0] == opt[valueField].toString()}">
    </option>
  </select>
</div>

<!-- Combobox de categorías: botón compacto + panel flotante con buscador y
     árbol colapsable. Escala igual para una tienda con 3 categorías que para
     una con 300, porque el árbol viaja como JSON (no como <option> planos) y
     el JS solo dibuja lo que el usuario va expandiendo/buscando.
     treeJson = String JSON ya serializado en el controller
     (CategoryService.getCategoryTree() + ObjectMapper.writeValueAsString).
     Escribe el id seleccionado en un <input type="hidden"> con
     data-filter="true", así que sigue integrado con los chips de filtros
     activos y el botón "Limpiar" sin tocar esa lógica. -->
<div th:fragment="category-combobox(name, defaultText, treeJson)"
     class="relative w-full sm:w-64" data-category-combobox th:attr="data-tree=${treeJson}">

  <input type="hidden" th:name="${name}" data-filter="true" data-combobox-value
         th:value="${param.get(name) != null ? param.get(name)[0] : ''}">

  <button type="button" data-combobox-trigger
          class="w-full flex items-center justify-between gap-2 px-4 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-300 hover:border-slate-600 focus:border-storevo-500 focus:ring-1 focus:ring-storevo-500 transition-colors">
    <span data-combobox-label class="truncate" th:text="${defaultText}"></span>
    <span class="flex items-center gap-1 flex-shrink-0">
      <span data-combobox-quick-clear title="Quitar filtro" class="hidden p-0.5 text-slate-500 hover:text-white transition-colors">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
      </span>
      <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
    </span>
  </button>

  <div data-combobox-panel class="hidden absolute z-30 mt-2 w-full sm:w-80 bg-slate-900 border border-slate-700 rounded-xl shadow-xl shadow-black/40 overflow-hidden">
    <div class="p-2 border-b border-slate-800">
      <div class="relative">
        <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <input type="text" data-combobox-search placeholder="Buscar categoría..." autocomplete="off"
               class="w-full pl-8 pr-3 py-1.5 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white placeholder-slate-500 focus:border-storevo-500 focus:ring-1 focus:ring-storevo-500">
      </div>
    </div>

    <div data-combobox-tree class="max-h-72 overflow-y-auto p-1.5"></div>

    <div class="border-t border-slate-800 p-1.5">
      <button type="button" data-combobox-clear
              class="w-full text-left px-3 py-1.5 text-xs font-bold text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
        Quitar filtro de categoría
      </button>
    </div>
  </div>
</div>

<div th:fragment="sort(optionsMap)">
  <div class="flex items-center gap-2">
    <label class="text-xs font-bold text-slate-500 uppercase hidden md:block">Ordenar:</label>
    <select name="sort" onchange="this.form.submit()"
            class="px-4 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-300 focus:border-storevo-500 focus:ring-1 focus:ring-storevo-500 cursor-pointer appearance-none pr-8">
      <option th:each="opt : ${optionsMap}"
              th:value="${opt.key}"
              th:text="${opt.value}"
              th:selected="${param.sort != null and param.sort[0] == opt.key}">
      </option>
    </select>
  </div>
</div>

<div th:fragment="page-size()">
  <select name="size" onchange="this.form.submit()"
          class="px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-400 focus:border-storevo-500 focus:ring-1 focus:ring-storevo-500 cursor-pointer appearance-none pr-8">
    <option value="10" th:selected="${param.size == null or param.size[0] == '10'}">10 / pág</option>
    <option value="20" th:selected="${param.size != null and param.size[0] == '20'}">20 / pág</option>
    <option value="50" th:selected="${param.size != null and param.size[0] == '50'}">50 / pág</option>
    <option value="100" th:selected="${param.size != null and param.size[0] == '100'}">100 / pág</option>
  </select>
</div>

<div th:fragment="pagination(page)" th:if="${page.totalPages > 0}" class="flex flex-col sm:flex-row justify-between items-center gap-4 mt-6 pt-6 border-t border-slate-800">
  <div th:with="currentEnd=${(page.number + 1) * page.size}, total=${page.totalElements}" class="text-sm text-slate-400">
    Mostrando <span class="font-bold text-white" th:text="${page.number * page.size + 1}"></span> a
    <span class="font-bold text-white" th:text="${currentEnd < total ? currentEnd : total}"></span>
    de <span class="font-bold text-white" th:text="${total}"></span> resultados
  </div>

  <div class="flex items-center gap-1 bg-slate-900 border border-slate-800 rounded-xl p-1">
    <button type="button" th:disabled="${page.first}" th:onclick="|StorevoListing.goToPage(${page.number - 1})|"
            class="px-3 py-1.5 text-sm font-medium rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 disabled:opacity-50 disabled:hover:bg-transparent disabled:cursor-not-allowed transition-colors">
      Anterior
    </button>

    <div class="hidden sm:flex items-center">
        <span class="px-4 py-1.5 text-sm font-bold text-storevo-400 bg-storevo-500/10 rounded-lg border border-storevo-500/20"
              th:text="${'Página ' + (page.number + 1) + ' de ' + page.totalPages}"></span>
    </div>

    <button type="button" th:disabled="${page.last}" th:onclick="|StorevoListing.goToPage(${page.number + 1})|"
            class="px-3 py-1.5 text-sm font-medium rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 disabled:opacity-50 disabled:hover:bg-transparent disabled:cursor-not-allowed transition-colors">
      Siguiente
    </button>
  </div>
</div>

<div th:fragment="empty-state(title, message, svgPath, clearUrl)" class="text-center py-16 px-4 bg-slate-900/50 border border-slate-800 border-dashed rounded-2xl">
  <svg class="mx-auto h-12 w-12 text-slate-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" th:d="${svgPath}"></path>
  </svg>
  <h3 class="text-lg font-black text-white" th:text="${title}"></h3>
  <p class="text-slate-400 mt-2 text-sm max-w-sm mx-auto" th:text="${message}"></p>

  <a th:href="${clearUrl}" th:if="${not #maps.isEmpty(param)}"
     class="inline-block mt-4 text-sm font-bold text-storevo-400 hover:text-storevo-300 transition-colors">
    Limpiar todos los filtros
  </a>
</div>
<a th:fragment="clear-filters(clearUrl, showCondition)"
   th:href="${clearUrl}"
   th:if="${showCondition}"
   class="inline-flex items-center justify-center gap-1.5 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-bold rounded-xl border border-slate-700 transition-colors whitespace-nowrap shadow-sm"
   title="Borrar todos los filtros">
  <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
  <span class="hidden sm:inline">Limpiar</span>
</a>
<!-- Contenedor de chips de filtros activos. Colócalo dentro del <form id="listing-form"> de cualquier listado. -->
<div th:fragment="active-filters-chips" id="active-filters-chips" class="flex flex-wrap gap-2 empty:hidden"></div>

<div th:fragment="scripts">
  <script>
    const StorevoListing = {
        goToPage: function(pageNumber) {
            const url = new URL(window.location.href);
            url.searchParams.set('page', pageNumber);
            window.location.href = url.toString();
        },

        // Recorre el formulario #listing-form, detecta los campos marcados con
        // data-filter="true" que tengan valor, y arma chips removibles con el
        // resumen de filtros activos. Funciona en cualquier página que use los
        // fragments de listing.html (search, filter-select, category-combobox),
        // sin config extra. Si el campo trae data-chip-label (lo setea el
        // combobox de categorías), usa ese texto en vez del value crudo.
        initFilterChips: function() {
            const form = document.getElementById('listing-form');
            const chipsContainer = document.getElementById('active-filters-chips');
            if (!form || !chipsContainer) return;

            const fields = form.querySelectorAll('[data-filter="true"]');
            chipsContainer.innerHTML = '';

            fields.forEach(field => {
                if (!field.value) return;

                let label;
                if (field.dataset.chipLabel) {
                    label = field.dataset.chipLabel;
                } else if (field.tagName === 'SELECT') {
                    const opt = field.options[field.selectedIndex];
                    label = opt ? opt.textContent.trim() : field.value;
                } else {
                    label = '"' + field.value + '"';
                }

                const chip = document.createElement('span');
                chip.className = 'inline-flex items-center gap-1.5 pl-3 pr-2 py-1 bg-storevo-500/10 text-storevo-300 text-xs font-bold rounded-full border border-storevo-500/20';
                chip.innerHTML = '<span></span>';
                chip.querySelector('span').textContent = label;

                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.title = 'Quitar este filtro';
                removeBtn.className = 'hover:text-white transition-colors';
                removeBtn.innerHTML = '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>';
                removeBtn.onclick = () => {
                    field.value = '';
                    form.submit();
                };

                chip.appendChild(removeBtn);
                chipsContainer.appendChild(chip);
            });

            // Muestra/oculta la "x" dentro del buscador
            const searchClearBtn = form.querySelector('[data-clear-field="q"]');
            const searchInput = form.querySelector('input[name="q"]');
            if (searchClearBtn && searchInput) {
                searchClearBtn.classList.toggle('hidden', !searchInput.value);
                searchClearBtn.onclick = () => { searchInput.value = ''; form.submit(); };
            }
        },

        // Autosubmit del buscador con debounce, para no obligar a presionar Enter.
        // Marca en sessionStorage que el reload vino del buscador, para
        // restaurar el foco después (ver restoreSearchFocus).
        initSearchDebounce: function(delay = 700) {
            const searchInput = document.querySelector('#listing-form input[name="q"]');
            if (!searchInput) return;

            let timeout;
            searchInput.addEventListener('input', () => {
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    sessionStorage.setItem('storevo:searchFocus', '1');
                    searchInput.form.submit();
                }, delay);
            });
        },

        // Si la página se recargó por el autosubmit del buscador, devuelve el
        // foco y deja el cursor al final para poder seguir escribiendo de
        // corrido, sin sentir que "te saca" del campo.
        restoreSearchFocus: function() {
            const searchInput = document.querySelector('#listing-form input[name="q"]');
            if (!searchInput) return;

            if (sessionStorage.getItem('storevo:searchFocus') === '1') {
                sessionStorage.removeItem('storevo:searchFocus');
                searchInput.focus();
                const pos = searchInput.value.length;
                searchInput.setSelectionRange(pos, pos);
            }
        },

        // Motor del combobox de categorías: botón + panel flotante con
        // buscador y árbol colapsable. No conoce la cantidad de categorías
        // de antemano: recibe el árbol como JSON (data-tree) y dibuja bajo
        // demanda, así que funciona igual con 3 categorías que con 300.
        initCategoryCombobox: function() {
            document.querySelectorAll('[data-category-combobox]').forEach(root => {
                let tree = [];
                try { tree = JSON.parse(root.dataset.tree || '[]'); } catch (e) { tree = []; }

                const hiddenInput = root.querySelector('[data-combobox-value]');
                const trigger = root.querySelector('[data-combobox-trigger]');
                const labelEl = root.querySelector('[data-combobox-label]');
                const quickClear = root.querySelector('[data-combobox-quick-clear]');
                const panel = root.querySelector('[data-combobox-panel]');
                const searchInput = root.querySelector('[data-combobox-search]');
                const treeContainer = root.querySelector('[data-combobox-tree]');
                const clearBtn = root.querySelector('[data-combobox-clear]');

                if (!hiddenInput || !trigger || !panel || !treeContainer || !labelEl) return;

                const defaultLabel = labelEl.textContent.trim();
                const form = hiddenInput.form;

                function findNodePath(nodes, id, path) {
                    for (const node of nodes) {
                        const currentPath = path.concat([node]);
                        if (String(node.id) === String(id)) return currentPath;
                        if (node.children && node.children.length) {
                            const found = findNodePath(node.children, id, currentPath);
                            if (found) return found;
                        }
                    }
                    return null;
                }

                function setSelection(id, displayLabel) {
                    hiddenInput.value = id || '';
                    hiddenInput.dataset.chipLabel = id ? displayLabel : '';
                    labelEl.textContent = id ? displayLabel : defaultLabel;
                    if (quickClear) quickClear.classList.toggle('hidden', !id);
                }

                function selectNode(node, isRoot) {
                    const displayLabel = isRoot ? ('Todo ' + node.name) : node.name;
                    setSelection(node.id, displayLabel);
                    closePanel();
                    if (form) form.submit();
                }

                function nodeMatchesQuery(node, query) {
                    if (node.name.toLowerCase().includes(query)) return true;
                    if (node.children) return node.children.some(child => nodeMatchesQuery(child, query));
                    return false;
                }

                function renderNode(node, isRoot, query, selectedId) {
                    const wrapper = document.createElement('div');
                    const row = document.createElement('div');
                    row.className = 'flex items-center gap-1 rounded-lg hover:bg-slate-800/70';

                    const hasChildren = node.children && node.children.length > 0;
                    const forceOpen = !!query;

                    let chevronBtn = null;
                    if (hasChildren) {
                        chevronBtn = document.createElement('button');
                        chevronBtn.type = 'button';
                        chevronBtn.className = 'p-1.5 text-slate-500 hover:text-white transition-transform flex-shrink-0' + (forceOpen ? ' rotate-90' : '');
                        chevronBtn.innerHTML = '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>';
                        row.appendChild(chevronBtn);
                    } else {
                        const spacer = document.createElement('span');
                        spacer.className = 'w-6 flex-shrink-0';
                        row.appendChild(spacer);
                    }

                    const selectBtn = document.createElement('button');
                    selectBtn.type = 'button';
                    const displayText = isRoot ? ('Todo ' + node.name) : node.name;
                    const isSelected = String(node.id) === String(selectedId);
                    selectBtn.className = 'flex-1 text-left px-2 py-1.5 text-sm rounded-lg truncate transition-colors ' +
                        (isSelected ? 'text-storevo-400 font-bold bg-storevo-500/10' : 'text-slate-300 hover:text-white');
                    selectBtn.textContent = displayText;
                    selectBtn.onclick = () => selectNode(node, isRoot);
                    row.appendChild(selectBtn);

                    wrapper.appendChild(row);

                    if (hasChildren) {
                        const childrenContainer = document.createElement('div');
                        childrenContainer.className = 'pl-4 border-l border-slate-800 ml-3' + (forceOpen ? '' : ' hidden');

                        node.children.forEach(child => {
                            if (query && !nodeMatchesQuery(child, query)) return;
                            childrenContainer.appendChild(renderNode(child, false, query, selectedId));
                        });

                        wrapper.appendChild(childrenContainer);

                        chevronBtn.onclick = () => {
                            const nowHidden = childrenContainer.classList.toggle('hidden');
                            chevronBtn.classList.toggle('rotate-90', !nowHidden);
                        };
                    }

                    return wrapper;
                }

                function renderTree(query) {
                    treeContainer.innerHTML = '';
                    const selectedId = hiddenInput.value;
                    const normalizedQuery = (query || '').trim().toLowerCase();
                    const visibleRoots = tree.filter(node => !normalizedQuery || nodeMatchesQuery(node, normalizedQuery));

                    if (visibleRoots.length === 0) {
                        const empty = document.createElement('p');
                        empty.className = 'text-center text-xs text-slate-500 py-4';
                        empty.textContent = 'No se encontraron categorías.';
                        treeContainer.appendChild(empty);
                        return;
                    }

                    visibleRoots.forEach(node => {
                        treeContainer.appendChild(renderNode(node, true, normalizedQuery, selectedId));
                    });
                }

                function openPanel() {
                    panel.classList.remove('hidden');
                    if (searchInput) searchInput.value = '';
                    renderTree('');
                    if (searchInput) searchInput.focus();
                }

                function closePanel() {
                    panel.classList.add('hidden');
                }

                trigger.addEventListener('click', (e) => {
                    e.stopPropagation();
                    panel.classList.contains('hidden') ? openPanel() : closePanel();
                });

                if (searchInput) {
                    searchInput.addEventListener('input', () => renderTree(searchInput.value));
                    searchInput.addEventListener('click', (e) => e.stopPropagation());
                }

                if (clearBtn) {
                    clearBtn.addEventListener('click', () => {
                        setSelection('', '');
                        closePanel();
                        if (form) form.submit();
                    });
                }

                if (quickClear) {
                    quickClear.addEventListener('click', (e) => {
                        e.stopPropagation();
                        setSelection('', '');
                        if (form) form.submit();
                    });
                }

                panel.addEventListener('click', (e) => e.stopPropagation());
                document.addEventListener('click', () => closePanel());
                document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePanel(); });

                // Estado inicial: si ya hay un filtro aplicado (recarga de
                // página), mostramos el nombre real de la categoría, no el id.
                if (hiddenInput.value) {
                    const path = findNodePath(tree, hiddenInput.value, []);
                    if (path && path.length) {
                        const isRootSelection = path.length === 1;
                        const lastNode = path[path.length - 1];
                        const displayLabel = isRootSelection ? ('Todo ' + lastNode.name) : lastNode.name;
                        setSelection(hiddenInput.value, displayLabel);
                    }
                }
            });
        },

        initListingUX: function() {
            StorevoListing.initCategoryCombobox();
            StorevoListing.initFilterChips();
            StorevoListing.initSearchDebounce();
            StorevoListing.restoreSearchFocus();
        }
    };

    document.addEventListener('DOMContentLoaded', StorevoListing.initListingUX);
  </script>
</div>

</body>
</html>
