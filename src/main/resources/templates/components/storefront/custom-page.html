<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/store-layout}">
<head>
    <title th:text="${customPage != null ? customPage.title : 'Página'}">Página</title>
</head>
<body>
<div layout:fragment="content" class="min-h-[70vh]">
    <script id="storevo-filter-data-json" type="application/json"
            th:if="${catalogFilterDataJson != null}"
            th:utext="${catalogFilterDataJson}"></script>

    <th:block th:if="${customPage != null and customPage.sections != null and not #lists.isEmpty(customPage.sections)}">
        <th:block th:each="sec : ${customPage.sections}" th:if="${sec.enabled}">
            <div th:replace="~{storefront/sections/theme-sections :: render-section(${sec})}"></div>
        </th:block>
    </th:block>

    <!-- Estado vacío si la página aún no tiene secciones activas -->
    <div th:if="${customPage == null or customPage.sections == null or #lists.isEmpty(customPage.sections)}"
         class="max-w-4xl mx-auto px-4 py-20 text-center">
        <div class="bg-white text-slate-900 p-10 store-radius border border-slate-200/80 shadow-sm">
            <h1 class="text-2xl sm:text-3xl font-black text-slate-900 mb-2"
                th:text="${customPage != null ? customPage.title : 'Página personalizada'}">Página</h1>
            <p class="text-sm text-slate-500">
                Esta página aún no tiene secciones visibles. Agrega bloques desde el Editor Visual de tu tienda.
            </p>
        </div>
    </div>
</div>
<th:block layout:fragment="scripts">
    <script th:src="@{/js/modules/storeCatalog.js}"></script>
</th:block>
</body>
</html>
