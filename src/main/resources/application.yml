spring:
  application:
    name: storevo

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 100MB

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/storevo_admin?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${FORMAT_SQL:false}
        default_batch_fetch_size: 50
        dialect: org.hibernate.dialect.MySQLDialect

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    test-connection: false
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  forward-headers-strategy: native

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

security:
  jwt:
    secret: ${JWT_SECRET}

storevo:
  crypto:
    secret-key: ${STOREVO_CRYPTO_SECRET_KEY}
    legacy-secret-key: ${STOREVO_CRYPTO_LEGACY_SECRET_KEY:}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@storevo.com}
    base-url: ${APP_BASE_URL:http://localhost:8080}
  customer:
    email-verification:
      # required = el comprador debe verificar su correo para entrar a "Mi Cuenta" (el checkout nunca se bloquea).
      # off = sin verificación (todas las cuentas se tratan como verificadas).
      mode: ${CUSTOMER_EMAIL_VERIFICATION:required}
      # Inicio del plazo de gracia de 30 dias para las cuentas creadas ANTES de esta fecha (AAAA-MM-DD).
      # Ajustala a la fecha real del despliegue: pasados 30 dias desde ella, las cuentas antiguas sin verificar quedan bloqueadas.
      grace-start: ${CUSTOMER_EMAIL_VERIFICATION_GRACE_START:2026-11-06}