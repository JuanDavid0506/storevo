spring:
  application:
    name: storevo

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/storevo_admin?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:juan123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

# application.yml
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

  # --- CONFIGURACIÓN PARA SUBIDA DE IMÁGENES FÍSICAS ---
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 100MB

server:
  forward-headers-strategy: native

security:
  jwt:
    secret: ${JWT_SECRET:StorevoSuperSecretKey2026_CambiarEnProduccion}

