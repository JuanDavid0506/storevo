spring:
  application:
    name: storevo
    servlet:
      multipart:
        enabled: true
        max-file-size: 10MB
        max-request-size: 100MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/storevo_admin?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${FORMAT_SQL:false}
        default_batch_fetch_size: 50
        dialect: org.hibernate.dialect.MySQLDialect
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

server:
  forward-headers-strategy: native

security:
  jwt:
    secret: ${JWT_SECRET}

storevo:
  crypto:
    secret-key: ${STOREVO_CRYPTO_SECRET_KEY}
    legacy-secret-key: ${STOREVO_CRYPTO_LEGACY_SECRET_KEY:}