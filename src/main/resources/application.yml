spring:
  application:
    name: storevo

  datasource:
    url: ${MYSQL_URL} # Cambiado de jdbc:${MYSQL_URL} a solo la variable
    username: ${MYSQLUSER}
    password: ${MYSQLPASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  thymeleaf:
    cache: true
    mode: HTML
    encoding: UTF-8

server:
  port: ${PORT:8080}